/* ============================================================
   AJOUT RAPIDE DE TÂCHES
   Une ligne par tâche : « Paramétrage @karim 15/10 5j ». Le @ désigne le
   responsable (début du prénom ou du nom), la date l'échéance, « 5j » la
   charge. Tout le reste est l'intitulé.
   ============================================================ */
function lireLigneRapide(l){
  let s = " " + String(l || "").replace(/^[\s\-•*]+/, "") + " ", resp = "", fin = "", charge = 0;
  s = s.replace(/\s@([^\s@]+)/, (x, n) => {
    const q = norm(n);
    const pe = V(DB.personnes).find(pe => norm(pe.nom).split(/\s+/).some(w => w.startsWith(q))) ||
               V(DB.personnes).find(pe => norm(pe.nom).replace(/\s+/g, "").startsWith(q));
    if(pe) resp = pe.id;
    return " ";
  });
  s = s.replace(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/, (x, d, mo, y) => {
    let yy = y ? (y.length === 2 ? 2000 + Number(y) : Number(y)) : new Date().getFullYear();
    let iso = yy + "-" + p2(mo) + "-" + p2(d);
    if(isNaN(dateDe(iso)) || Number(mo) > 12 || Number(d) > 31) return x;
    if(!y && iso < todayISO()) iso = (yy + 1) + "-" + p2(mo) + "-" + p2(d);
    fin = iso; return " ";
  });
  s = s.replace(/\s(\d+(?:[.,]\d+)?)\s?(?:j|jh|j\/h)(?=\s)/i, (x, n) => { charge = num(n); return " "; });
  return { titre:s.replace(/\s+/g, " ").trim(), resp, fin, charge };
}
function apercuRapide(m){
  const L = String(m.texte || "").split(/\n/).map(lireLigneRapide).filter(x => x.titre);
  if(!L.length) return '<div class="aide">Rien à ajouter pour l\'instant.</div>';
  const p = DB.projets[m.projet], j = DB.jalons[m.jalon];
  const defaut = j ? j.date : p && p.fin;
  return L.map(x => '<div class="ln" style="padding:7px 2px"><span class="ln-mid"><span class="ln-t" style="font-size:13.5px">' + esc(x.titre) + '</span>' +
    '<span class="ln-m">' + esc([nomP(x.resp) || "non attribuée", "échéance " + frDate(x.fin || defaut) + (x.fin ? "" : " (par défaut)"), x.charge ? jh(x.charge) + "/h" : ""].filter(Boolean).join(" · ")) + '</span></span></div>').join("") +
    '<div class="aide">' + L.length + ' tâche' + pl(L.length) + ' à créer.</div>';
}

    (J.length ? fChamp("Rattacher au jalon", fSel("jalon", m.jalon, J.map(j => [j.id, j.titre + " · " + frDate(j.date)]), "Aucun"), "", "m-jalon") : "") +

const prenom = n => String(n || "").trim().split(/\s+/)[0] || "";
const emailDe = id => ((DB.personnes[id] || {}).email || "").trim();

function gensDuProjet(p){

function candidatsMail(m){

function changerModele(m, modele){

/* Le contenu, en briques neutres : titre, paragraphe, puce, couple
   libellé / valeur. Deux rendus en sortent : texte et HTML. */
function ligneEcheance(t, avecProjet){
  const auj = todayISO(), retard = t.fin && t.fin < auj;
  return { k:"li", c: retard ? "rouge" : "",
    t:(avecProjet ? nomProjet(t.projet) + " — " : "") + t.titre + " : " + (t.fin ? "échéance " + frDate(t.fin) : "sans échéance") +
      (retard ? ", dépassée de " + diffJ(t.fin, auj) + " j" : "") + (avecProjet ? "" : " (" + (nomP(t.resp) || "non attribuée") + ")") +
      (avT(t) && t.statut !== "fait" ? " · " + avT(t) + " %" : "") };
}
function blocSynthese(p, a, m){
  const n = [], tend = tendance(p);
  n.push({ k:"kv", l:"Météo", v:METEOS[a.meteo] + (tend ? " (" + tend.t + ")" : ""), c:a.meteo });
  n.push({ k:"kv", l:"Avancement", v:a.avance + " %" + (a.tempsPct != null ? " (temps écoulé " + a.tempsPct + " %)" : "") });
  n.push({ k:"kv", l:"Fin prévue", v:frDate(p.fin, true) + (a.joursRetard ? " — dépassée de " + a.joursRetard + " j" : a.glissement > 0 ? " — décalée de " + a.glissement + " j" : ""),
    c: a.joursRetard ? "rouge" : a.glissement > 0 ? "orange" : "" });
  if(m.budget && a.budget) n.push({ k:"kv", l:"Budget", v:eur(a.conso) + " consommés sur " + eur(a.budget) + (a.eac != null && a.avance < 100 ? " · projection " + eur(a.eac) : ""),
    c: a.eacPct > 100 ? (a.eacPct > 115 ? "rouge" : "orange") : "" });
  return n;
}
function contenuMail(m){
  const n = [], auj = todayISO(), p = DB.projets[m.projet];
  const H = t => n.push({ k:"h", t }), LI = (t, c, sub) => n.push({ k:"li", t, c, sub });
  if((m.modele === "point" || m.modele === "odj") && p){
    const a = an(p), per = num(m.periode) || 14, dep = addJ(auj, -per);
    const bloq = a.T.filter(t => t.statut === "bloque");
    const retard = a.T.filter(t => t.statut !== "fait" && t.statut !== "bloque" && t.fin && t.fin < auj);
    const bientot = a.T.filter(t => t.statut !== "fait" && t.statut !== "bloque" && t.fin && t.fin >= auj && diffJ(auj, t.fin) <= 14)
      .sort((x,y) => cmp(x.fin, y.fin));
    const jal = a.J.filter(j => !j.fait && diffJ(auj, j.date) <= 45);
    const risques = a.rOuv.slice().sort((x,y) => scoreR(y) - scoreR(x)).filter(r => scoreR(r) >= 6 || (r.echeance && r.echeance < auj)).slice(0, 5);
    const ligneJ = j => LI(frDate(j.date) + " — " + j.titre + (j.cle ? " (jalon clé)" : "") + (j.date < auj ? " : en retard de " + diffJ(j.date, auj) + " j" : ""), j.date < auj ? "rouge" : "");
    const ligneR = r => LI(r.titre + " — criticité " + scoreR(r) + "/16" + (r.action ? " · action : " + r.action : " · sans plan d'action") +
      (nomP(r.resp) ? " (" + nomP(r.resp) + ")" : ""), niveau(scoreR(r)) === "crit" ? "rouge" : "orange");
    if(m.modele === "point"){
      H("Où en est-on");
      blocSynthese(p, a, m).forEach(x => n.push(x));
      if(a.raisons.length){ H("Points d'attention"); a.raisons.forEach(r => LI(r.t, r.n)); }
      const faits = [];
      const JJ = journalDe(p.id).filter(e => e.date >= dep && !/^Météo :/.test(e.texte));
      const deja = t => JJ.some(e => e.type === "auto" && e.texte.includes(t));
      a.T.forEach(t => { if(t.statut === "fait" && t.faitLe && t.faitLe >= dep && !deja(t.titre)) faits.push({ d:t.faitLe, t:"Tâche terminée : " + t.titre, c:"vert" }); });
      a.J.forEach(j => { if(j.fait && j.atteintLe && j.atteintLe >= dep && !deja(j.titre)) faits.push({ d:j.atteintLe, t:"Jalon atteint : " + j.titre, c:"vert" }); });
      JJ.forEach(e => faits.push({ d:e.date, t:(e.type === "point" || e.type === "auto" ? "" : lib(TYPES_J, e.type) + " : ") + e.texte,
        c:e.type === "probleme" || /bloquée/.test(e.texte) ? "rouge" : /terminée|atteint/.test(e.texte) ? "vert" : "" }));
      if(faits.length){ H("Faits marquants — " + per + " derniers jours"); faits.sort((x,y) => cmp(y.d, x.d)).forEach(f => LI(frDate(f.d) + " — " + f.t.replace(/\s+/g, " "), f.c)); }
      if(bloq.length){ H("Blocages"); bloq.forEach(t => LI(t.titre + (t.motif ? " : " + t.motif : "") + " (" + (nomP(t.resp) || "non attribuée") + ")", "rouge")); }
      if(retard.length || bientot.length){ H("Échéances en retard et à 14 jours"); retard.concat(bientot).forEach(t => n.push(ligneEcheance(t))); }
      if(jal.length){ H("Prochains jalons"); jal.forEach(ligneJ); }
      if(m.risques && M().risques && risques.length){ H("Risques à surveiller"); risques.forEach(ligneR); }
    } else {
      H("1. Météo et avancement");
      blocSynthese(p, a, m).forEach(x => n.push(x));
      H("2. Blocages et retards");
      if(bloq.length || retard.length){
        bloq.forEach(t => LI(t.titre + (t.motif ? " : " + t.motif : "") + " (" + (nomP(t.resp) || "non attribuée") + ")", "rouge"));
        retard.forEach(t => n.push(ligneEcheance(t)));
      } else LI("Rien de bloqué, rien en retard.");
      H("3. Jalons à venir");
      if(jal.length) jal.forEach(ligneJ); else LI("Aucun jalon dans les 45 jours.");
      if(m.risques && M().risques){ H("4. Risques à revoir"); if(risques.length) risques.forEach(ligneR); else LI("Pas de risque significatif ouvert."); }
      const pb = journalDe(p.id).filter(e => e.type === "probleme" && diffJ(e.date, auj) <= 30);
      H((m.risques && M().risques ? "5" : "4") + ". Décisions à prendre");

  }
  else if(m.modele === "relance"){
    const pe = DB.personnes[m.personne];
    if(pe){
      const { T, R } = mesActions(pe.id);
      const late = T.filter(t => t.statut !== "bloque" && t.fin && t.fin < auj);
      const bl = T.filter(t => t.statut === "bloque");
      const soon = T.filter(t => t.statut !== "bloque" && !(t.fin && t.fin < auj));
      if(late.length){ H("En retard"); late.forEach(t => n.push(ligneEcheance(t, true))); }
      if(bl.length){ H("Bloquées — de quoi avez-vous besoin ?"); bl.forEach(t => LI(nomProjet(t.projet) + " — " + t.titre + (t.motif ? " : " + t.motif : ""), "orange")); }
      if(soon.length){ H("À venir dans les 14 jours"); soon.forEach(t => n.push(ligneEcheance(t, true))); }
      if(R.length){ H("Actions sur les risques"); R.forEach(r => LI(nomProjet(r.projet) + " — " + (r.action || r.titre) + " : échéance " + frDate(r.echeance) +
        (r.echeance < auj ? ", dépassée de " + diffJ(r.echeance, auj) + " j" : ""), r.echeance < auj ? "rouge" : "")); }
      if(!T.length && !R.length) n.push({ k:"p", t:"Rien en retard ni d'imminent de votre côté : merci !" });
    }
  }
  else {
    const d = donneesRapport();
    n.push({ k:"p", t:d.act.length + " projets actifs : " + d.cnt.rouge + " en difficulté, " + d.cnt.orange + " à surveiller, " + d.cnt.vert + " sous contrôle — " +
      d.retard + " en retard." + (resumeFiltres() !== "Actifs" ? "\nSélection : " + resumeFiltres() + "." : "") });
    if(m.budget && d.bud) n.push({ k:"kv", l:"Budget", v:eur(d.cons) + " consommés sur " + eur(d.bud) + " · projection " + eur(d.eac) });
    if(M().charge && d.chP) n.push({ k:"kv", l:"Charge", v:jh(d.chC) + "/h consommés sur " + jh(d.chP) + "/h prévus" });
    H("Projets");
    d.act.forEach(p => {
      const a = an(p), dp = notesDe(p.id)[0], tend = tendance(p);
      LI(p.nom + " — " + METEOS[a.meteo].toLowerCase() + (tend ? " " + tend.s : "") + ", " + a.avance + " %, fin " + frDate(p.fin, true) +
        (a.joursRetard ? " (dépassée de " + a.joursRetard + " j)" : a.glissement > 0 ? " (+" + a.glissement + " j)" : "") +
        (m.budget && a.budget ? ", budget " + a.budgetPct + " %" : "") + (nomP(p.chef) ? " — " + nomP(p.chef) : ""),
        a.meteo, dp ? dp.texte.replace(/\s+/g, " ") : "");
    });
    if(d.al.length){ H("Points d'attention"); d.al.slice(0, 10).forEach(x => LI(x.p.nom + " : " + x.t, x.n)); }
    if(d.jal.length){ H("Jalons à 60 jours"); d.jal.slice(0, 10).forEach(j => LI(frDate(j.date) + " — " + j.titre + " (" + nomProjet(j.projet) + ")" + (j.cle ? " · jalon clé" : ""), j.date < auj ? "rouge" : "")); }
    if(m.risques && M().risques && d.risques.length){ H("Risques majeurs"); d.risques.slice(0, 8).forEach(r => LI(r.titre + " (" + nomProjet(r.projet) + ") — " + (r.action || "sans plan d'action"), niveau(scoreR(r)) === "crit" ? "rouge" : "orange")); }
    if(d.clos.length){ H("Projets clôturés ces 90 derniers jours"); d.clos.forEach(p => LI(p.nom + " — " + lib(RESULTATS, p.cloture.resultat).toLowerCase() +
      (texteStats(p.cloture.stats || {}) ? " · " + texteStats(p.cloture.stats) : ""), CLS_RES[p.cloture.resultat] === "ok" ? "vert" : CLS_RES[p.cloture.resultat] === "dang" ? "rouge" : "orange")); }
    if(d.decisions.length){ H("Décisions récentes"); d.decisions.slice(0, 8).forEach(e => LI(frDate(e.date) + " — " + e.texte.replace(/\s+/g, " ") + " (" + nomProjet(e.projet) + ")")); }
    if(M().valeur && d.ve.length){
      H("Arbitrage valeur / effort");
      QUADS.forEach(([, titre, fv, fe, sens]) => {
        const l = d.ve.filter(p => fv(num(p.valeur)) && fe(effortDe(p).v));
        if(l.length) LI(titre + " (" + sens + ") : " + l.map(p => p.nom).join(", "));
      });
    }
  }
  return n;
}
function rendreMail(m){
  const n = contenuMail(m), intro = (m.intro || "").trim(), sig = signature();
  const tx = [];
  if(intro) tx.push(intro, "");
  n.forEach((x, i) => {
    if(x.k === "h"){ if(i) tx.push(""); tx.push(x.t.toUpperCase()); }
    else if(x.k === "p") tx.push(x.t, "");
    else if(x.k === "kv") tx.push((x.c && EMOJI[x.c] ? EMOJI[x.c] + " " : "") + x.l + " : " + x.v);
    else tx.push((x.c && EMOJI[x.c] ? EMOJI[x.c] + " " : "• ") + x.t + (x.sub ? "\n   " + x.sub : ""));
  });
  tx.push("", sig);
  const e = s => esc(s).replace(/\n/g, "<br>");
  const dot = c => c && COUL[c] ? '<span style="color:' + COUL[c] + '">●</span> ' : "";
  let h = "", ouvert = "";
  const fermer = () => { if(ouvert === "ul") h += "</ul>"; if(ouvert === "kv") h += "</table>"; ouvert = ""; };
  if(intro) h += '<p style="margin:0 0 12px">' + e(intro) + '</p>';
  n.forEach(x => {
    if(x.k === "li"){ if(ouvert !== "ul"){ fermer(); h += '<ul style="margin:0 0 10px;padding-left:22px">'; ouvert = "ul"; }
      h += '<li style="margin:0 0 4px">' + dot(x.c) + e(x.t) + (x.sub ? '<br><span style="color:#666;font-style:italic">' + e(x.sub) + '</span>' : "") + '</li>'; return; }
    if(x.k === "kv"){ if(ouvert !== "kv"){ fermer(); h += '<table style="border-collapse:collapse;margin:0 0 10px">'; ouvert = "kv"; }
      h += '<tr><td style="padding:2px 18px 2px 0;color:#666;vertical-align:top">' + e(x.l) + '</td><td style="padding:2px 0;font-weight:600' +
        (x.c && COUL[x.c] ? ';color:' + COUL[x.c] : "") + '">' + dot(x.c) + e(x.v) + '</td></tr>'; return; }
    fermer();
    if(x.k === "h") h += '<p style="margin:18px 0 6px;font-size:15px;font-weight:bold;color:#111;border-bottom:1px solid #e3e3e3;padding-bottom:3px">' + e(x.t) + '</p>';
    else h += '<p style="margin:0 0 10px">' + e(x.t) + '</p>';
  });
  fermer();
  h += '<p style="margin:16px 0 0">' + e(sig) + '</p>';
  return { text:tx.join("\n"), html:'<div style="font-family:Segoe UI,Calibri,Arial,sans-serif;font-size:14px;line-height:1.5;color:#1a1a1a">' + h + '</div>' };
}
async function copierRiche(html, text){
  try{
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({ "text/html":new Blob([html], { type:"text/html" }), "text/plain":new Blob([text], { type:"text/plain" }) })]);
      return true;
    }
  }catch(e){}
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){ return false; }
}
function adressesMail(m){
  const to = [], cc = [];
  Object.keys(m.dest || {}).forEach(id => { const a = emailDe(id); if(!a) return; if(m.dest[id] === "to") to.push(a); else if(m.dest[id] === "cc") cc.push(a); });
  String(m.autres || "").split(/[;,\s]+/).map(x => x.trim()).filter(x => /.+@.+/.test(x)).forEach(x => { if(!to.includes(x)) to.push(x); });
  return { to, cc };
}
async function envoyerMail(act){
  const m = state.modal; if(!m) return;
  const r = rendreMail(m), objet = (m.objet || "").trim();
  if(m.modele === "synthese" && DB.settings.mailDirection !== (m.autres || "")){ DB.settings.mailDirection = m.autres || ""; sauver(true); }
  if(act === "mail-partager"){
    try{ await navigator.share({ title:objet, text:objet + "\n\n" + r.text }); }catch(e){}
    return;
  }
  const ok = await copierRiche(r.html, r.text);
  if(act === "mail-copier"){ toast(ok ? "Copié avec la mise en forme : collez-le dans votre mail" : "Copie refusée par le navigateur"); return; }
  const { to, cc } = adressesMail(m);
  let url = "mailto:" + to.join(",") + "?subject=" + encodeURIComponent(objet) + (cc.length ? "&cc=" + cc.join(",") : "");
  if(!ok) url += "&body=" + encodeURIComponent(r.text.slice(0, 1800));
  const a = document.createElement("a"); a.href = url; document.body.appendChild(a); a.click(); a.remove();
  toast(ok ? "Contenu copié : collez-le (Ctrl+V) dans le mail qui s'ouvre" : "Mail ouvert avec le texte brut");
}

function aideEffort(m){
  const T = m.id ? tachesDe(m.id) : [];
  const r = effortCalc({ budget:num(m.budget), charge:T.length ? T.reduce((s,t) => s + num(t.charge), 0) : num(m.charge),
    debut:m.debut, fin:m.fin, service:m.service, equipe:m.equipe });
  if(!r) return "Auto : renseignez budget, charge, dates ou équipe pour obtenir une estimation.";
  const det = r.crit.map(c => c.t + " → " + c.v).join(", ");
  return (num(m.effort) ? "Fixé à la main. " : "") + "Estimation automatique : <b>" + NIV_EFFORT[r.v] + "</b> (" + esc(det) + ", sur une échelle de 1 à 4). " +
    (num(m.effort) ? "Choisissez Auto pour la suivre." : "Elle se met à jour avec le projet.");
}

function ouvrirModal(m){ state.modal = m; render(); }
function fermerModal(){ state.modal = null; render(); }
function capturerModal(){
  const m = state.modal; if(!m) return;
  document.querySelectorAll("#modal [data-f]").forEach(el => { m[el.dataset.f] = el.value; });
}
const copie = o => JSON.parse(JSON.stringify(o));

/* ---------- création des fenêtres ---------- */
function mProjet(p){
  if(p) return { type:"projet", ...copie(p), prio:String(p.prio || ""), avance:String(num(p.avance)), equipe:(p.equipe||[]).slice() };
  const auj = todayISO();
  return { type:"projet", nom:"", code:"", statut:"encours", prio:"2", service:DB.settings.f.service || "", chef:DB.personnes[DB.settings.moi] ? DB.settings.moi : "", sponsor:"",
    debut:auj, fin:addJ(auj, 90), budget:"", conso:"", charge:"", chargeConso:"", avance:"0", meteo:"auto",
    valeur:"", effort:"", equipe:[], description:"", focus:"m-nom" };
}
function mTache(t, pid){
  if(t) return { type:"tache", ...copie(t), fixe:false };
  const p = DB.projets[pid], auj = todayISO();
  return { type:"tache", projet:pid || "", fixe:!!pid, titre:"", resp:"", jalon:"", debut:auj,
    fin:p && p.fin && p.fin < addJ(auj, 14) ? p.fin : addJ(auj, 14), statut:"afaire", avance:"0", charge:"", conso:"", motif:"", note:"", focus:"m-titre" };
}
function mJalon(j, pid){
  if(j) return { type:"jalon", ...copie(j), fixe:false };
  return { type:"jalon", projet:pid || "", fixe:!!pid, titre:"", date:addJ(todayISO(), 30), cle:false, fait:false, note:"", focus:"m-titre" };
}
function mRisque(r, pid){
  if(r) return { type:"risque", ...copie(r), proba:String(r.proba), impact:String(r.impact), fixe:false };
  return { type:"risque", projet:pid || "", fixe:!!pid, titre:"", proba:"2", impact:"2", strat:"reduire", action:"", resp:"", echeance:"", statut:"ouvert", focus:"m-titre" };
}
function mPersonne(pe){
  if(pe) return { type:"personne", ...copie(pe), dispo:pe.dispo == null ? "" : String(pe.dispo).replace(".", ",") };
  return { type:"personne", nom:"", service:"", role:"", email:"", dispo:"2,5", note:"", focus:"m-nom" };
}
function mPoint(e, pid){
  // L'entrée porte son propre champ « type » (point, décision, problème) :
  // il doit passer dans « genre », sans écraser le type de la fenêtre.
  if(e) return { ...copie(e), type:"point", genre:e.type };
  return { type:"point", projet:pid, genre:"point", texte:"", date:todayISO(), focus:"m-texte" };
}

/* ---------- enregistrement ---------- */
function enregistrerProjet(){
  capturerModal();
  const m = state.modal, nom = (m.nom || "").trim();
  if(!nom){ toast("Donnez un nom au projet"); return; }
  if(m.debut && m.fin && m.fin < m.debut){ toast("La fin précède le début"); return; }
  const neuf = !m.id;
  const p = neuf ? { id:uid(), cree:Date.now() } : DB.projets[m.id];
  if(!p) return fermerModal();
  const av = { fin:p.fin, statut:p.statut };
  Object.assign(p, {
    nom, code:(m.code||"").trim(), statut:m.statut || "encours", prio:m.prio || "", service:m.service || "", chef:m.chef || "",
    sponsor:(m.sponsor||"").trim(), debut:m.debut || "", fin:m.fin || "", budget:num(m.budget), conso:num(m.conso),
    charge:num(m.charge), chargeConso:num(m.chargeConso), avance:clamp(num(m.avance), 0, 100), meteo:m.meteo || "auto",
    valeur:m.valeur || "", effort:m.effort || "", equipe:(m.equipe||[]).filter(id => DB.personnes[id]),
    description:(m.description||"").trim(), maj:Date.now()
  });
  p.finBase = neuf ? p.fin : (m.finBase || p.fin);
  DB.projets[p.id] = p;
  let extra = "";
  if(neuf){
    evenement(p.id, "Projet créé");
    if(m.modeleP){ const n = appliquerModele(p, m.modeleP); if(n) extra = " · " + n; }
  } else {
    if(av.fin && p.fin && av.fin !== p.fin) evenement(p.id, "Fin prévue déplacée du " + frDate(av.fin, true) + " au " + frDate(p.fin, true) +
      " (" + (diffJ(av.fin, p.fin) > 0 ? "+" : "") + diffJ(av.fin, p.fin) + " j)");
    if(av.statut !== p.statut) evenement(p.id, "Statut : " + lib(STATUTS_P, av.statut) + " → " + lib(STATUTS_P, p.statut));
  }
  state.modal = null;
  if(neuf){ state.sheet = { t:"projet", id:p.id }; state.ptab = "synthese"; }
  sauver(); render();
  toast((neuf ? "Projet créé" : "Projet enregistré") + extra);
}
/* Tout changement de statut d'une tâche passe par ici : journal, date de
   fin, charge consommée présumée, et jalon atteint quand sa dernière tâche
   se termine. Renvoie les messages à afficher. */
function apresStatutTache(t, avant){
  const msgs = [];
  if(t.statut === avant) return msgs;
  if(t.statut === "fait"){
    t.avance = 100; t.faitLe = t.faitLe || todayISO();
    if(!num(t.conso) && num(t.charge)) t.conso = num(t.charge);
    evenement(t.projet, "Tâche terminée : " + t.titre + (nomP(t.resp) ? " (" + nomP(t.resp) + ")" : ""));
    const j = DB.jalons[t.jalon];
    if(j && !j.fait && !tachesDe(t.projet).some(x => x.jalon === j.id && x.statut !== "fait")){
      j.fait = true; j.atteintLe = todayISO();
      evenement(t.projet, "Jalon atteint : " + j.titre + " — toutes ses tâches sont faites");
      msgs.push("Jalon « " + j.titre + " » atteint");
    }
  } else t.faitLe = "";

/* ---------- suppressions, toujours rattrapables le temps du bandeau ---------- */
let corbeille = null;
function garder(c, k, o){ c[k] = c[k] || {}; if(!c[k][o.id]) c[k][o.id] = copie(o); }
function restaurer(){
  if(!corbeille) return;
  Object.keys(corbeille).forEach(k => Object.keys(corbeille[k]).forEach(id => { DB[k][id] = corbeille[k][id]; }));
  corbeille = null; sauver(); render(); fermerToast(); toast("Restauré");
}
function supprimerProjet(id){
  const p = DB.projets[id]; if(!p) return;
  const c = {}; garder(c, "projets", p);
  ["taches","jalons","risques","journal"].forEach(k => V(DB[k]).forEach(o => { if(o.projet === id){ garder(c, k, o); delete DB[k][o.id]; } }));
  delete DB.projets[id];
  corbeille = c; state.sheet = null; state.modal = null; sauver(); render();
  toast("« " + p.nom + " » supprimé", "annuler");
}
function supprimerSimple(k, id, msg){
  const o = DB[k][id]; if(!o) return;
  const c = {}; garder(c, k, o);
  if(k === "jalons") V(DB.taches).forEach(t => { if(t.jalon === id){ garder(c, "taches", t); t.jalon = ""; } });
  if(o.projet) touche(o.projet);
  delete DB[k][id];
  corbeille = c; state.modal = null; sauver(); render();
  toast(msg, "annuler");
}
function supprimerPersonne(id){
  const pe = DB.personnes[id]; if(!pe) return;
  const c = {}; garder(c, "personnes", pe);
  V(DB.taches).forEach(t => { if(t.resp === id){ garder(c, "taches", t); t.resp = ""; } });
  V(DB.risques).forEach(r => { if(r.resp === id){ garder(c, "risques", r); r.resp = ""; } });
  V(DB.projets).forEach(p => {
    if(p.chef === id || (p.equipe||[]).includes(id)){ garder(c, "projets", p); if(p.chef === id) p.chef = ""; p.equipe = (p.equipe||[]).filter(x => x !== id); }
  });
  delete DB.personnes[id];
  corbeille = c; state.modal = null; if(state.sheet && state.sheet.t === "personne") state.sheet = null;
  sauver(); render();
  toast(pe.nom + " retiré·e de l'équipe", "annuler");
}
function dupliquerProjet(id){
  const p = DB.projets[id]; if(!p) return;
  const n = copie(p); n.id = uid(); n.nom = p.nom + " (copie)"; n.cree = Date.now(); n.maj = Date.now(); n.conso = 0; n.chargeConso = 0;
  DB.projets[n.id] = n;
  const mapJ = {};
  jalonsDe(id).forEach(j => { const x = copie(j); x.id = uid(); x.projet = n.id; x.fait = false; mapJ[j.id] = x.id; DB.jalons[x.id] = x; });
  tachesDe(id).forEach(t => { const x = copie(t); x.id = uid(); x.projet = n.id; x.jalon = mapJ[t.jalon] || ""; x.statut = "afaire"; x.avance = 0; x.conso = 0; DB.taches[x.id] = x; });
  risquesDe(id).forEach(r => { const x = copie(r); x.id = uid(); x.projet = n.id; DB.risques[x.id] = x; });
  state.sheet = { t:"projet", id:n.id }; state.ptab = "synthese";

/* ---------- import / export ---------- */
function telecharger(nom, blob){
  const u = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = u; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 1500);
}
const tampon = () => { const d = new Date(); return d.getFullYear() + p2(d.getMonth()+1) + p2(d.getDate()); };
function exporterJSON(){
  DB.meta.exporte = Date.now();

}

function importer(){
  const i = document.createElement("input");
  i.type = "file"; i.accept = "application/json,.json";
  i.onchange = async () => {
    const f = i.files && i.files[0]; if(!f) return;
    try{
      const x = JSON.parse(await f.text());
      if(!x || typeof x !== "object" || !x.projets) throw new Error("ce n'est pas une sauvegarde Jalon");
      const n = V(x.projets).length;
      ouvrirModal({ type:"confirmer", titre:"Restaurer la sauvegarde ?", danger:true, bouton:"Remplacer",
        texte:"Le fichier contient " + n + " projet" + pl(n) + ". Les données actuelles de cet appareil seront remplacées.",
        ok:() => {
          const theme = DB.settings.theme, accent = DB.settings.accent;
          DB = assembler(x); DB.settings.theme = theme; DB.settings.accent = accent;
          state.sheet = null; sauver(); render(); toast("Sauvegarde restaurée · " + n + " projet" + pl(n));
        } });
    }catch(e){ toast("Fichier illisible : " + ((e && e.message) || e)); }
  };
  i.click();
}

/* ============================================================
   ACTIONS
   ============================================================ */
const CYCLE = { afaire:"encours", encours:"fait", fait:"afaire", bloque:"encours" };
function ouvrirProjet(id, onglet){ state.sheet = { t:"projet", id }; state.ptab = onglet || "synthese"; state.modal = null; render(); const s = document.querySelector(".sheet"); if(s) s.scrollTop = 0; }

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if(act === "rien"){ if(ev.target.closest("[data-act]") === el) ev.stopPropagation(); return; }

  /* ---- navigation ---- */
  if(act === "tab"){ state.tab = id; state.sheet = null; state.seulRetard = false; if(id === "planning") state.gRecentrer = true; render(); window.scrollTo(0,0); return; }
  if(act === "ouvrir-projet"){ ouvrirProjet(id); return; }
  if(act === "ouvrir-personne"){ state.sheet = { t:"personne", id }; state.modal = null; render(); return; }
  if(act === "fermer-sheet"){ state.sheet = null; render(); return; }
  if(act === "fermer-modal"){ if(ev.target === el || el.tagName === "BUTTON") fermerModal(); return; }
  if(act === "ptab"){ state.ptab = id; render(); return; }
  if(act === "journal-ouvrir" || act === "basculer-journal"){
    state.journal = act === "journal-ouvrir" ? true : !state.journal; state.neuf = false; DB.meta.vue = VERSION; sauver(true);
    if(act === "journal-ouvrir"){ state.tab = "reglages"; state.sheet = null; window.scrollTo(0,0); }
    render(); return;
  }
  if(act === "basculer-masque"){ DB.settings.masque = !masque(); sauver(true); render(); toast(masque() ? "Montants masqués" : "Montants réaffichés"); return; }
  if(act === "annuler"){ restaurer(); return; }

  /* ---- créations ---- */
  if(act === "nouveau"){
    if(state.sheet && state.sheet.t === "projet") return ouvrirModal(mTache(null, state.sheet.id));
    if(state.tab === "equipe") return ouvrirModal(mPersonne());
    if(state.tab === "risques" && M().risques) return ouvrirModal(mRisque(null, ""));
    return ouvrirModal(mProjet());
  }
  if(act === "nouveau-projet") return ouvrirModal(mProjet());
  if(act === "nouvelle-tache") return ouvrirModal(mTache(null, id));
  if(act === "nouveau-jalon") return ouvrirModal(mJalon(null, id));
  if(act === "nouveau-risque") return ouvrirModal(mRisque(null, id || ""));
  if(act === "nouvelle-personne") return ouvrirModal(mPersonne());
  if(act === "nouveau-point") return ouvrirModal(mPoint(null, id));
  if(act === "services") return ouvrirModal({ type:"services" });

  /* ---- modifications ---- */
  if(act === "modifier-projet" && DB.projets[id]) return ouvrirModal(mProjet(DB.projets[id]));
  if(act === "modifier-tache" && DB.taches[id]) return ouvrirModal(mTache(DB.taches[id]));
  if(act === "modifier-jalon" && DB.jalons[id]) return ouvrirModal(mJalon(DB.jalons[id]));
  if(act === "modifier-risque" && DB.risques[id]) return ouvrirModal(mRisque(DB.risques[id]));
  if(act === "modifier-personne" && DB.personnes[id]) return ouvrirModal(mPersonne(DB.personnes[id]));
  if(act === "modifier-point" && DB.journal[id]) return ouvrirModal(mPoint(DB.journal[id]));

  /* ---- champs des fenêtres ---- */
  if(act === "m-set"){ capturerModal(); state.modal[el.dataset.k] = id; render(); return; }
  if(act === "m-bool"){ capturerModal(); state.modal[el.dataset.k] = !state.modal[el.dataset.k]; render(); return; }
  if(act === "m-toggle"){
    capturerModal();
    const k = el.dataset.k, l = state.modal[k] = state.modal[k] || [];
    const i = l.indexOf(id); if(i < 0) l.push(id); else l.splice(i, 1);
    render(); return;
  }
  if(act === "m-rebaser"){ ev.preventDefault(); capturerModal(); state.modal.finBase = state.modal.fin; render(); toast("Fin initiale recalée sur " + frDate(state.modal.fin, true)); return; }
  if(act === "enregistrer-projet") return enregistrerProjet();
  if(act === "enregistrer-tache") return enregistrerTache();
  if(act === "enregistrer-jalon") return enregistrerJalon();
  if(act === "enregistrer-risque") return enregistrerRisque();
  if(act === "enregistrer-personne") return enregistrerPersonne();
  if(act === "enregistrer-point") return enregistrerPoint();
  if(act === "confirmer-ok"){ const m = state.modal; state.modal = null; if(m && m.ok) m.ok(); else render(); return; }

  /* ---- suppressions et copies ---- */
  if(act === "supprimer-projet") return supprimerProjet(id);
  if(act === "supprimer-tache") return supprimerSimple("taches", id, "Tâche supprimée");
  if(act === "supprimer-jalon") return supprimerSimple("jalons", id, "Jalon supprimé");
  if(act === "supprimer-risque") return supprimerSimple("risques", id, "Risque supprimé");
  if(act === "supprimer-point") return supprimerSimple("journal", id, "Entrée supprimée");
  if(act === "supprimer-personne") return supprimerPersonne(id);
  if(act === "dupliquer-projet") return dupliquerProjet(id);
  if(act === "dupliquer-tache"){
    const t = DB.taches[id]; if(!t) return;
    const m = mTache(t); delete m.id; m.titre = t.titre + " (copie)"; m.statut = "afaire"; m.avance = "0"; m.conso = ""; m.focus = "m-titre";
    return ouvrirModal(m);
  }

  /* ---- mises à jour express ---- */
  if(act === "cycle-tache"){
    const t = DB.taches[id]; if(!t) return;
    const avant = t.statut;
    t.statut = CYCLE[t.statut] || "encours";
    if(t.statut === "afaire") t.avance = 0;
    else if(t.statut === "encours" && !num(t.avance)) t.avance = 10;
    if(t.statut !== "bloque") t.motif = "";
    const msgs = apresStatutTache(t, avant);
    touche(t.projet); sauver(); render();
    toast(["« " + t.titre + " » : " + lib(STATUTS_T, t.statut).toLowerCase()].concat(msgs).join(" · "));
    return;
  }
  if(act === "masquer-faits"){ state.masquerFaits = !state.masquerFaits; render(); return; }

  /* ---- filtres et tris ---- */
  if(act === "filtres-raz"){ DB.settings.f = { ...DEFAULTS.settings.f }; state.seulRetard = false; sauver(true); render(); return; }
  if(act === "filtre-meteo"){ DB.settings.f.meteo = DB.settings.f.meteo === id ? "" : id; sauver(true); render(); return; }
  if(act === "tri"){ DB.settings.tri = id; sauver(true); render(); return; }
  if(act === "aller-projets-retard"){ state.tab = "projets"; state.seulRetard = true; DB.settings.tri = "fin"; render(); window.scrollTo(0,0); return; }
  if(act === "seul-retard"){ state.seulRetard = false; render(); return; }
  if(act === "alertes-tout"){ state.alertesTout = !state.alertesTout; render(); return; }
  if(act === "aller-risques-cell"){ state.tab = "risques"; state.rCell = id; state.rFermes = false; render(); window.scrollTo(0,0); return; }
  if(act === "r-cell"){ state.rCell = state.rCell === id ? null : id; render(); return; }
  if(act === "r-fermes"){ state.rFermes = id === "1"; render(); return; }

  /* ---- planning ---- */
  if(act === "g-zoom"){ DB.settings.gZoom = id; state.gDecal = 0; state.gRecentrer = true; sauver(true); render(); return; }
  if(act === "g-decal"){ state.gDecal = id === "0" ? 0 : state.gDecal + Number(id); state.gRecentrer = true; render(); return; }
  if(act === "g-toggle"){ if(state.gOuverts.has(id)) state.gOuverts.delete(id); else state.gOuverts.add(id); render(); return; }
  if(act === "g-tout"){
    if(state.gOuverts.size) state.gOuverts.clear();
    else projetsFiltres(true).forEach(p => { if(tachesDe(p.id).length) state.gOuverts.add(p.id); });
    render(); return;
  }

  /* ---- point hebdo ---- */
  if(act === "revue") return demarrerRevue();
  if(act === "rv-set"){ capturerRevue(); state.sheet.m[el.dataset.k] = id; render(); return; }
  if(act === "rv-tstat"){
    capturerRevue();
    const t = DB.taches[id]; if(!t) return;
    const avant = t.statut;
    t.statut = el.dataset.s;
    if(t.statut === "encours" && !num(t.avance)) t.avance = 10;
    const msgs = apresStatutTache(t, avant);
    touche(t.projet); sauver(); render(); if(msgs.length) toast(msgs.join(" · ")); return;
  }
  if(act === "rv-jfait"){ capturerRevue(); const j = DB.jalons[id]; if(j){ j.fait = true; j.atteintLe = todayISO(); evenement(j.projet, "Jalon atteint : " + j.titre); touche(j.projet); sauver(); render(); toast("Jalon « " + j.titre + " » atteint"); } return; }
  if(act === "rv-prec"){ capturerRevue(); state.sheet.i--; state.sheet.m = null; render(); return; }
  if(act === "rv-passer") return suivantRevue();
  if(act === "rv-ok") return enregistrerRevue();

  /* ---- rapport ---- */
  if(act === "rapport"){ state.sheet = { t:"rapport" }; render(); return; }
  if(act === "imprimer"){ window.print(); return; }

  /* ---- clôture, archives, modèles, saisie rapide ---- */
  if(act === "cloturer-projet" && DB.projets[id]) return ouvrirModal(mCloture(DB.projets[id]));
  if(act === "enregistrer-cloture") return enregistrerCloture();
  if(act === "rouvrir-projet"){
    const p = DB.projets[id]; if(!p) return;
    p.statut = "encours"; p.clotureAncienne = p.cloture; delete p.cloture; p.maj = Date.now();
    evenement(p.id, "Projet rouvert"); sauver(); render(); toast("Projet rouvert : il revient sur le tableau de bord"); return;
  }
  if(act === "modele-depuis") return enregistrerCommeModele(id);
  if(act === "modele-suppr"){ DB.settings.modelesPerso = (DB.settings.modelesPerso || []).filter(x => x.id !== id); sauver(); render(); toast("Modèle retiré"); return; }
  if(act === "ajout-rapide") return ouvrirModal({ type:"rapide", projet:id, texte:"", jalon:"", focus:"m-texte" });
  if(act === "enregistrer-rapide") return enregistrerRapide();
  if(act === "p-vue"){ state.pVue = id; state.q = ""; render(); return; }
  if(act === "j-filtre"){ state.jFiltre = id; render(); return; }
  if(act === "mes-tout"){ state.mesTout = !state.mesTout; render(); return; }

  /* ---- mails ---- */
  if(act === "mail-projet") return ouvrirModal(mMail(el.dataset.m || "point", { projet:id }));
  if(act === "mail-personne") return ouvrirModal(mMail("relance", { personne:id }));
  if(act === "mail-synthese") return ouvrirModal(mMail("synthese", {}));
  if(act === "mail-modele"){ capturerModal(); changerModele(state.modal, id); render(); return; }
  if(act === "mail-dest"){
    const m = state.modal, cur = m.dest[id] || "";
    m.dest[id] = cur === "" ? "to" : cur === "to" ? "cc" : "";
    capturerModal(); render(); return;
  }
  if(act === "mail-copier" || act === "mail-ouvrir" || act === "mail-partager"){ capturerModal(); return envoyerMail(act); }

  /* ---- réglages ---- */
  if(act === "theme"){ ecritLS(LSTHEME, id); DB.settings.theme = id; appliquerTheme(id); sauver(true); render(); majIcone(); return; }
  if(act === "accent"){ ecritLS(LSACC, id); DB.settings.accent = id; appliquerAccent(id); sauver(true); render(); majIcone(); return; }
  if(act === "module"){ DB.settings.modules[id] = !DB.settings.modules[id]; if(id === "budget" && !DB.settings.modules.budget) DB.settings.masque = false; sauver(true); render(); return; }
  if(act === "obsolete"){ DB.settings.obsolete = Number(id); sauver(true); render(); return; }
  if(act === "svc-ajout"){
    const i = $("#m-svc"), v = (i && i.value || "").trim();
    if(!v) return;
    if(!DB.settings.services.some(s => norm(s) === norm(v))) DB.settings.services.push(v);
    sauver(); render(); const j = $("#m-svc"); if(j) j.focus(); return;
  }
  if(act === "svc-suppr"){ DB.settings.services.splice(Number(id), 1); if(!DB.settings.services.includes(DB.settings.f.service)) DB.settings.f.service = ""; sauver(); render(); return; }
  if(act === "exporter-json") return exporterJSON();
  if(act === "exporter-csv") return exporterCSV();
  if(act === "importer") return importer();
  if(act === "exemple"){
    if(!V(DB.projets).length) return exemple();
    return ouvrirModal({ type:"confirmer", titre:"Ajouter l'exemple ?", texte:"Sept projets fictifs et huit personnes s'ajouteront à vos données. Vous pourrez les supprimer un par un.", bouton:"Ajouter", ok:exemple });
  }
  if(act === "effacer"){
    return ouvrirModal({ type:"confirmer", titre:"Tout effacer ?", danger:true, bouton:"Tout effacer",
      texte:"Projets, tâches, jalons, risques, équipe et journal seront supprimés de cet appareil. Exportez d'abord une sauvegarde si vous avez un doute.",
      ok:() => {
        const s = DB.settings;
        DB = JSON.parse(JSON.stringify(DEFAULTS));
        DB.settings.theme = s.theme; DB.settings.accent = s.accent; DB.settings.services = s.services; DB.settings.organisation = s.organisation;
        state.sheet = null; sauver(); render(); toast("Tout est effacé");
      } });
  }
});

/* ============================================================
   ICÔNE ET MANIFESTE, PEINTS À LA COULEUR D'ACCENT
   ============================================================ */
function dessinerIcone(taille, marge){
  const c = document.createElement("canvas");
  c.width = c.height = taille;
  const x = c.getContext("2d"), acc = accentActuel();
  const p = marge ? taille * 0.14 : 0, t = taille - p * 2, r = t * 0.22;
  x.fillStyle = acc;
  if(marge) x.fillRect(0, 0, taille, taille);
  else{
    x.beginPath(); x.moveTo(r, 0); x.arcTo(t, 0, t, t, r); x.arcTo(t, t, 0, t, r);
    x.arcTo(0, t, 0, 0, r); x.arcTo(0, 0, t, 0, r); x.closePath(); x.fill();
  }
  const u = t / 64, o = p, sur = surAccent(acc);
  x.strokeStyle = sur; x.fillStyle = sur; x.lineCap = "round"; x.lineWidth = 5 * u;
  x.beginPath(); x.moveTo(o + 14*u, o + 47*u); x.lineTo(o + 50*u, o + 47*u); x.stroke();
  x.beginPath(); x.moveTo(o + 32*u, o + 12*u); x.lineTo(o + 44*u, o + 26*u); x.lineTo(o + 32*u, o + 40*u); x.lineTo(o + 20*u, o + 26*u); x.closePath(); x.fill();
  return c.toDataURL("image/png");
}
let _manifeste = null;
function majIcone(){
  try{
    const acc = accentActuel(), sur = surAccent(acc);
    const fav = document.getElementById("favicon");
    if(fav) fav.href = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' + SIGLE(acc, sur) + '</svg>');
    const p192 = dessinerIcone(192, false), p512 = dessinerIcone(512, false), pm = dessinerIcone(512, true);
    let at = document.querySelector('link[rel="apple-touch-icon"]');
    if(!at){ at = document.createElement("link"); at.rel = "apple-touch-icon"; document.head.appendChild(at); }
    at.href = p192;
    const sombre = document.documentElement.getAttribute("data-theme") === "sombre";
    const man = { id:"jalon", name:"Jalon — suivi de projets", short_name:"Jalon", start_url:location.href.split("#")[0], scope:".",
      display:"standalone", background_color:sombre ? "#0d0d10" : "#ffffff", theme_color:sombre ? "#0d0d10" : "#ffffff",
      icons:[ { src:p192, sizes:"192x192", type:"image/png" }, { src:p512, sizes:"512x512", type:"image/png" },
              { src:pm, sizes:"512x512", type:"image/png", purpose:"maskable" } ] };
    if(_manifeste) URL.revokeObjectURL(_manifeste);
    _manifeste = URL.createObjectURL(new Blob([JSON.stringify(man)], { type:"application/manifest+json" }));
    let lm = document.querySelector('link[rel="manifest"]');
    if(!lm){ lm = document.createElement("link"); lm.rel = "manifest"; document.head.appendChild(lm); }
    lm.href = _manifeste;
  }catch(e){ /* une icône ratée ne doit pas empêcher l'application de tourner */ }
}

/* ============================================================
   DÉMARRAGE
   ============================================================ */
async function demarrer(){
  try{
    await IDB.ouvrir();
    DB = assembler(await IDB.lire());
  }catch(e){
    document.getElementById("view").innerHTML =
      '<div class="vide" style="margin-top:60px"><b>Stockage indisponible</b>' +
      esc(String((e && e.message) || e)) + '<br>La navigation privée de certains navigateurs interdit IndexedDB.</div>';
    return;
  }
  pret = true;
  if(!litLS(LSTHEME) && DB.settings.theme){ ecritLS(LSTHEME, DB.settings.theme); appliquerTheme(DB.settings.theme); }
  if(!litLS(LSACC) && DB.settings.accent){ ecritLS(LSACC, DB.settings.accent); appliquerAccent(DB.settings.accent); }
  DB.settings.theme = themeActuel();
  DB.settings.accent = accentActuel();
  state.neuf = !!DB.meta.vue && DB.meta.vue !== VERSION;
  if(!DB.meta.vue){ DB.meta.vue = VERSION; sauver(true); }
  // Demande au navigateur de ne pas purger la base quand l'espace manque.
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  render();
  majIcone();
}
let _jour = todayISO();
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden"){ ecouler(); return; }
  if(!pret) return;
  if(_jour !== todayISO()){ _jour = todayISO(); render(); }
});
window.addEventListener("pagehide", () => { ecouler(); });

demarrer();
