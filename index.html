/* Tout changement de statut d'une tâche passe par ici : journal, date de
   fin, charge consommée présumée, et jalon atteint quand sa dernière tâche
   se termine. Renvoie les messages à afficher. */
function apresStatutTache(t, avant){
  const msgs = [];
  if(t.statut === avant) return msgs;
  if(t.statut === "fait"){
    t.avance = 100; t.faitLe = t.faitLe || todayISO();
    if(!num(t.conso) && num(t.charge)) t.conso = num(t.charge);
    evenement(t.projet, "Tâche terminée : " + t.titre + (nomP(t.resp) ? " (" + nomP(t.resp) + ")" : ""));
    const j = DB.jalons[t.jalon];
    if(j && !j.fait && !tachesDe(t.projet).some(x => x.jalon === j.id && x.statut !== "fait")){
      j.fait = true; j.atteintLe = todayISO();
      evenement(t.projet, "Jalon atteint : " + j.titre + " — toutes ses tâches sont faites");
      msgs.push("Jalon « " + j.titre + " » atteint");
    }
  } else t.faitLe = "";
  if(t.statut === "bloque") evenement(t.projet, "Tâche bloquée : " + t.titre + (t.motif ? " — " + t.motif : ""));
  else if(avant === "bloque") evenement(t.projet, "Tâche débloquée : " + t.titre);
  return msgs;
}

/* ---------- suppressions, toujours rattrapables le temps du bandeau ---------- */
let corbeille = null;
function garder(c, k, o){ c[k] = c[k] || {}; if(!c[k][o.id]) c[k][o.id] = copie(o); }
function restaurer(){
  if(!corbeille) return;
  // « _ajouts » : ce qu'un import a créé, à retirer pour revenir en arrière.
  const aj = corbeille._ajouts || {};
  Object.keys(aj).forEach(k => aj[k].forEach(id => { delete DB[k][id]; }));
  Object.keys(corbeille).filter(k => k !== "_ajouts").forEach(k => Object.keys(corbeille[k]).forEach(id => { DB[k][id] = corbeille[k][id]; }));
  corbeille = null; sauver(); render(); fermerToast(); toast("Restauré");
}
function supprimerProjet(id){
  const p = DB.projets[id]; if(!p) return;
  const c = {}; garder(c, "projets", p);
  ["taches","jalons","risques","journal"].forEach(k => V(DB[k]).forEach(o => { if(o.projet === id){ garder(c, k, o); delete DB[k][o.id]; } }));
  delete DB.projets[id];
  corbeille = c; state.sheet = null; state.modal = null; sauver(); render();
  toast("« " + p.nom + " » supprimé", "annuler");
}
function supprimerSimple(k, id, msg){
  const o = DB[k][id]; if(!o) return;
  const c = {}; garder(c, k, o);
  if(k === "jalons") V(DB.taches).forEach(t => { if(t.jalon === id){ garder(c, "taches", t); t.jalon = ""; } });
  if(o.projet) touche(o.projet);
  delete DB[k][id];
  corbeille = c; state.modal = null; sauver(); render();
  toast(msg, "annuler");
}
function supprimerPersonne(id){
  const pe = DB.personnes[id]; if(!pe) return;
  const c = {}; garder(c, "personnes", pe);
  V(DB.taches).forEach(t => { if(t.resp === id){ garder(c, "taches", t); t.resp = ""; } });
  V(DB.risques).forEach(r => { if(r.resp === id){ garder(c, "risques", r); r.resp = ""; } });
  V(DB.projets).forEach(p => {
    if(p.chef === id || (p.equipe||[]).includes(id)){ garder(c, "projets", p); if(p.chef === id) p.chef = ""; p.equipe = (p.equipe||[]).filter(x => x !== id); }
  });
  delete DB.personnes[id];
  corbeille = c; state.modal = null; if(state.sheet && state.sheet.t === "personne") state.sheet = null;
  sauver(); render();
  toast(pe.nom + " retiré·e de l'équipe", "annuler");
}
function dupliquerProjet(id){
  const p = DB.projets[id]; if(!p) return;
  const n = copie(p); n.id = uid(); n.nom = p.nom + " (copie)"; n.code = codeAuto(n.service); delete n.cloture; delete n.meteoNotee; n.cree = Date.now(); n.maj = Date.now(); n.conso = 0; n.chargeConso = 0;
  DB.projets[n.id] = n;
  const mapJ = {};
  jalonsDe(id).forEach(j => { const x = copie(j); x.id = uid(); x.projet = n.id; x.fait = false; mapJ[j.id] = x.id; DB.jalons[x.id] = x; });
  tachesDe(id).forEach(t => { const x = copie(t); x.id = uid(); x.projet = n.id; x.jalon = mapJ[t.jalon] || ""; x.statut = "afaire"; x.avance = 0; x.conso = 0; DB.taches[x.id] = x; });
  risquesDe(id).forEach(r => { const x = copie(r); x.id = uid(); x.projet = n.id; DB.risques[x.id] = x; });
  state.sheet = { t:"projet", id:n.id }; state.ptab = "synthese";
  sauver(); render(); toast("Projet dupliqué, avec ses tâches, jalons et risques");
}

const CYCLE = { afaire:"encours", encours:"fait", fait:"afaire", bloque:"encours" };
function ouvrirProjet(id, onglet){ state.sheet = { t:"projet", id }; state.ptab = onglet || "synthese"; state.modal = null; render(); const s = document.querySelector(".sheet"); if(s) s.scrollTop = 0; }

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if(act === "rien"){ if(ev.target.closest("[data-act]") === el) ev.stopPropagation(); return; }
  if(state.modal && act.startsWith("m-") && el.closest("#modal")) state.modal.sale = true;

  /* ---- navigation ---- */
  if(act === "tab"){ state.tab = id; state.sheet = null; state.seulRetard = false; if(id === "planning") state.gRecentrer = true; render(); window.scrollTo(0,0); return; }
  if(act === "ouvrir-projet"){ ouvrirProjet(id); return; }
  if(act === "monde-site"){ choisirSite(id); if(state.tab === "monde"){ const z = document.querySelector(".carte-zone"); if(z && z.getBoundingClientRect().top < 0) z.scrollIntoView({ behavior:"smooth", block:"start" }); } return; }
  if(act === "monde-tout"){ state.site = null; state.zone = "monde"; render(); cadrer("monde"); return; }
  if(act === "monde-zone"){ state.site = null; state.zone = id; render(); cadrer(id); return; }
  if(act === "monde-projets"){ DB.settings.f.site = id; state.tab = "projets"; state.sheet = null; sauver(true); render(); window.scrollTo(0,0); return; }
  if(act === "nouveau-projet-site"){ state.siteNouveau = id; ouvrirModal(mProjet()); state.siteNouveau = null; return; }
  if(act === "ouvrir-personne"){ state.sheet = { t:"personne", id }; state.modal = null; render(); return; }
  if(act === "fermer-sheet"){ if(state.sheet && state.sheet.t === "reunion") syncActions(DB.reunions[state.sheet.id]); state.sheet = null; render(); return; }
  if(act === "fond-modal"){ if(ev.target === el) secouerModal(); return; }
  if(act === "fermer-modal"){ if(el.tagName === "BUTTON") fermerModal(); return; }
  if(act === "ptab"){ state.ptab = id; render(); return; }
  if(act === "journal-ouvrir" || act === "basculer-journal"){
    state.journal = act === "journal-ouvrir" ? true : !state.journal; state.neuf = false; DB.meta.vue = VERSION; sauver(true);
    if(act === "journal-ouvrir"){ state.tab = "reglages"; state.sheet = null; window.scrollTo(0,0); }
    render(); return;
  }
  if(act === "basculer-masque"){ DB.settings.masque = !masque(); sauver(true); render(); toast(masque() ? "Montants masqués" : "Montants réaffichés"); return; }
  if(act === "annuler"){ restaurer(); return; }

  /* ---- créations ---- */
  if(act === "nouveau"){
    if(state.sheet && state.sheet.t === "projet") return ouvrirModal(mTache(null, state.sheet.id));
    if(state.tab === "equipe") return ouvrirModal(mPersonne());
    if(state.tab === "risques" && M().risques) return ouvrirModal(mRisque(null, ""));
    if(state.tab === "achats") return ouvrirModal(state.aVue === "lic" ? mLicence() : mAchat());
    if(state.tab === "reunions") return creerReunion("equipe");
    return ouvrirModal(mProjet());
  }
  if(act === "nouvel-achat") return ouvrirModal(mAchat(null, id));
  if(act === "nouvelle-licence") return ouvrirModal(mLicence());

  if(act === "p-vue"){ state.pVue = id; state.q = ""; render(); return; }
  if(act === "j-filtre"){ state.jFiltre = id; render(); return; }
  if(act === "basculer-modeles"){ state.voirModeles = !state.voirModeles; render(); return; }
  if(act === "mes-vue"){ DB.settings.mesVue = id; sauver(true); render(); return; }
  if(act === "mes-tout"){ state.mesTout = !state.mesTout; render(); return; }

  /* ---- mails ---- */
  if(act === "mail-projet") return ouvrirModal(mMail(el.dataset.m || "point", { projet:id }));
  if(act === "mail-personne") return ouvrirModal(mMail("relance", { personne:id }));
  if(act === "mail-synthese") return ouvrirModal(mMail("synthese", {}));
  if(act === "mail-modele"){ capturerModal(); changerModele(state.modal, id); majModal(); return; }
  if(act === "mail-dest"){
    const m = state.modal, cur = m.dest[id] || "";
    m.dest[id] = cur === "" ? "to" : cur === "to" ? "cc" : "";
    capturerModal(); majModal(); return;
  }
  if(act === "mail-copier" || act === "mail-ouvrir" || act === "mail-partager"){ capturerModal(); return envoyerMail(act); }

  /* ---- réglages ---- */
  if(act === "onglet-haut" || act === "onglet-bas"){
    const o = ongletsOrdonnes(true).map(t => t.id), i = o.indexOf(id), j = act === "onglet-haut" ? i - 1 : i + 1;
    if(i < 0 || j < 0 || j >= o.length) return;
    [o[i], o[j]] = [o[j], o[i]]; DB.settings.ordreOnglets = o; sauver(true); render(); return;
  }
  if(act === "onglet-voir"){
    const mq = DB.settings.ongletsMasques = (DB.settings.ongletsMasques || []).slice(), i = mq.indexOf(id);
    if(i >= 0) mq.splice(i, 1);
    else { if(TABS.length - mq.length <= 1){ toast("Gardez au moins un onglet"); return; } mq.push(id); }
    sauver(true); render(); return;
  }
  if(act === "onglets-raz"){ DB.settings.ordreOnglets = []; DB.settings.ongletsMasques = []; sauver(true); render(); toast("Onglets remis dans l'ordre d'origine"); return; }
  if(act === "theme"){ ecritLS(LSTHEME, id); DB.settings.theme = id; appliquerTheme(id); sauver(true); render(); majIcone(); return; }
  if(act === "accent"){ ecritLS(LSACC, id); DB.settings.accent = id; appliquerAccent(id); sauver(true); render(); majIcone(); return; }
  if(act === "module"){ DB.settings.modules[id] = !DB.settings.modules[id]; if(id === "budget" && !DB.settings.modules.budget) DB.settings.masque = false; sauver(true); render(); return; }
  if(act === "obsolete"){ DB.settings.obsolete = Number(id); sauver(true); render(); return; }
  if(act === "svc-ajout"){
    const i = $("#m-svc"), v = (i && i.value || "").trim(), r = (($("#m-svcresp") || {}).value || "").trim();
    if(!v) return;
    ajouterService(v, r);
    sauver(); render(); const j = $("#m-svc"); if(j) j.focus(); return;
  }
  if(act === "m-svc-ok"){
    const v = (($("#m-nsvc") || {}).value || "").trim(), r = (($("#m-nresp") || {}).value || "").trim();
    if(!v){ toast("Indiquez le nom du service"); return; }
    capturerModal();
    const m = state.modal;
    m.service = ajouterService(v, r); m.ajoutSvc = false; autoProjet(m);
    sauver(); majModal(); toast("Service « " + m.service + " » ajouté"); return;
  }
  if(act === "m-svc-annuler"){ capturerModal(); state.modal.ajoutSvc = false; majModal(); return; }
  if(act === "m-chef-ok"){
    const nom = (($("#m-ncnom") || {}).value || "").trim();
    if(!nom){ toast("Indiquez un nom"); return; }
    capturerModal();
    const pe = { id:uid(), nom, service:(($("#m-ncsvc") || {}).value || ""), role:"Chef de projet", email:(($("#m-ncmail") || {}).value || "").trim(),
      dispo:2.5, note:"", cree:Date.now() };
    DB.personnes[pe.id] = pe;
    const m = state.modal; m.chef = pe.id; m.ajoutChef = false;
    sauver(); majModal(); toast(nom + " ajouté·e à l'équipe"); return;
  }
  if(act === "m-chef-annuler"){ capturerModal(); state.modal.ajoutChef = false; majModal(); return; }
  if(act === "svc-suppr"){ const nomS = DB.settings.services[Number(id)]; if(DB.settings.respServices) delete DB.settings.respServices[nomS];
    DB.settings.services.splice(Number(id), 1); if(!DB.settings.services.includes(DB.settings.f.service)) DB.settings.f.service = ""; sauver(); render(); return; }
  if(act === "exporter-json") return exporterJSON();
  if(act === "exporter-csv") return exporterCSV();
  if(act === "importer") return importer();
  if(act === "exemple"){
    if(!V(DB.projets).length) return exemple();
    return ouvrirModal({ type:"confirmer", titre:"Ajouter l'exemple ?", texte:"Dix projets fictifs, huit personnes, des achats et des licences s'ajouteront à vos données. Vous pourrez les supprimer un par un.", bouton:"Ajouter", ok:exemple });
  }
  if(act === "effacer"){
    return ouvrirModal({ type:"confirmer", titre:"Tout effacer ?", danger:true, bouton:"Tout effacer",
      texte:"Projets, tâches, jalons, risques, équipe et journal seront supprimés de cet appareil. Exportez d'abord une sauvegarde si vous avez un doute.",
      ok:() => {
        const s = DB.settings;
        DB = JSON.parse(JSON.stringify(DEFAULTS));
        DB.settings.theme = s.theme; DB.settings.accent = s.accent; DB.settings.services = s.services; DB.settings.organisation = s.organisation;
        state.sheet = null; sauver(); render(); toast("Tout est effacé");
      } });
  }
});

    capturerModal(); const t = document.getElementById("lic-total"); if(t) t.innerHTML = totalLicHTML(state.modal);
  }
  if(el.id === "q"){ state.q = el.value; render(); return; }
  if(el.id === "qa"){ state.qa = el.value; render(); return; }
  if(el.id === "qr"){ state.qr = el.value; render(); return; }
  /* Notes de réunion : enregistrées à la frappe, sans redessiner la page
     (le curseur ne bouge pas). */
  if(state.sheet && state.sheet.t === "reunion" && el.closest && el.closest("#sheet")){
    const r = DB.reunions[state.sheet.id]; if(!r) return;
    if(el.dataset.rn){
      const rb = r.rubriques.find(x => x.id === el.dataset.rn); if(!rb) return;
      rb.notes = rb.notes || {}; rb.notes[el.dataset.rp] = el.value; grandir(el);
      clearTimeout(vueReunion._t);
      vueReunion._t = setTimeout(() => { syncActions(r); const p = document.getElementById("r-suivi"); if(p && DB.reunions[r.id]) p.innerHTML = panneauSuivi(r); }, 900);
    }
    else if(el.dataset.rt){ const rb = r.rubriques.find(x => x.id === el.dataset.rt); if(rb) rb.t = el.value; }
    else if(el.id === "r-titre") r.titre = el.value;
    else if(el.id === "r-date" && el.value) r.date = el.value;
    else return;
    r.maj = Date.now(); sauver(); return;
  }
  if(state.modal && state.modal.type === "coller" && el.id === "m-texte"){ capturerModal(); const a = document.getElementById("apercu-coller"); if(a) a.innerHTML = apercuColler(state.modal); return; }
  if(el.id === "set-org"){ DB.settings.organisation = el.value; sauver(); return; }
  if(state.modal && state.modal.type === "projet" && el.id === "m-code") state.modal.codeAuto = false;
  if(state.modal && state.modal.type === "projet" && el.id === "m-sponsor") state.modal.sponsorAuto = !el.value.trim();
  if(el.classList && el.classList.contains("svc-resp")){ DB.settings.respServices = DB.settings.respServices || {}; DB.settings.respServices[el.dataset.svc] = el.value; sauver(); return; }
  if(el.id === "set-sig"){ DB.settings.signature = el.value; sauver(); return; }
  if(el.id === "set-dir"){ DB.settings.mailDirection = el.value; sauver(); return; }
  if(state.modal && state.modal.type === "mail" && el.closest && el.closest("#modal")){ capturerModal(); majApercuMail(); return; }
  if(state.modal && state.modal.type === "cr" && el.id === "m-actions"){ capturerModal(); const a = document.getElementById("apercu-cr"); if(a) a.innerHTML = apercuActionsCR(state.modal); return; }
  if(state.modal && state.modal.type === "rapide" && el.id === "m-texte"){ capturerModal(); const a = document.getElementById("apercu-rapide"); if(a) a.innerHTML = apercuRapide(state.modal); return; }
  if(el.dataset && el.dataset.out){ const o = document.getElementById(el.dataset.out); if(o) o.textContent = el.value + " %"; }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if(el.id === "set-moi"){ DB.settings.moi = el.value; sauver(true); render(); return; }
  if(el.dataset && el.dataset.filtre){ DB.settings.f[el.dataset.filtre] = el.value; sauver(true); render(); return; }
  if(el.dataset && el.dataset.asite){ state.aSite = el.value; render(); return; }
  if(el.dataset && el.dataset.aserv){ state.aServ = el.value; render(); return; }
  if(el.dataset && el.dataset.aan){ state.aAn = el.value === "tout" ? "" : el.value; render(); return; }
  // Fin de saisie d'un bloc : les lignes « → » deviennent des actions. On ne
  // rafraîchit que le panneau « À suivre », pour ne pas avaler le clic suivant.
  if(state.sheet && state.sheet.t === "reunion" && el.dataset && el.dataset.rn){
    const r = DB.reunions[state.sheet.id]; if(!r) return;
    syncActions(r);
    const p = document.getElementById("r-suivi"); if(p) p.innerHTML = panneauSuivi(r);
    return;
  }
  if(state.sheet && state.sheet.t === "reunion" && el.id === "r-date"){ render(); return; }
  if(el.dataset && el.dataset.rerender){
    capturerModal();
    const m = state.modal;
    if(m && el.dataset.f === "projet") m.jalon = "";
    if(m && m.type === "projet" && el.dataset.f === "service"){
      if(m.service === "__new"){ m.service = ""; m.ajoutSvc = true; m.focus = "m-nsvc"; }
      else { m.ajoutSvc = false; autoProjet(m); }
    }
    if(m && m.type === "projet" && el.dataset.f === "chef"){
      if(m.chef === "__new"){ m.chef = ""; m.ajoutChef = true; m.focus = "m-ncnom"; } else m.ajoutChef = false;
    }
    if(m) majModal(); else render();
  }
});
/* Onglets : glisser un onglet sur un autre le place avant lui (ou après,
   dans la seconde moitié). */
let _ongletG = null;
document.addEventListener("dragstart", ev => {
  const t = ev.target.closest && ev.target.closest(".tab[data-onglet]"); if(!t) return;
  _ongletG = t.dataset.onglet; t.classList.add("drag");
  try{ ev.dataTransfer.setData("text/plain", _ongletG); ev.dataTransfer.effectAllowed = "move"; }catch(e){}
});
document.addEventListener("dragover", ev => {
  if(!_ongletG) return;
  const t = ev.target.closest && ev.target.closest(".tab[data-onglet]"); if(!t) return;
  ev.preventDefault();
  document.querySelectorAll(".tab.cible").forEach(x => { if(x !== t) x.classList.remove("cible"); });
  if(t.dataset.onglet !== _ongletG) t.classList.add("cible");
});
document.addEventListener("drop", ev => {
  if(!_ongletG) return;
  const t = ev.target.closest && ev.target.closest(".tab[data-onglet]"), id = _ongletG; _ongletG = null;
  if(!t || t.dataset.onglet === id){ render(); return; }
  ev.preventDefault();
  const b = t.getBoundingClientRect(), vertical = window.innerWidth >= 960;
  const apres = vertical ? ev.clientY > b.top + b.height / 2 : ev.clientX > b.left + b.width / 2;
  deplacerOnglet(id, t.dataset.onglet, apres);
});
document.addEventListener("dragend", () => { if(_ongletG){ _ongletG = null; document.querySelectorAll(".tab.drag,.tab.cible").forEach(x => x.classList.remove("drag", "cible")); } });

/* Kanban : glisser une carte dans une autre colonne change le statut. */
let _glisse = null;
document.addEventListener("dragstart", ev => {
  const c = ev.target.closest && ev.target.closest(".kb-card"); if(!c) return;
  _glisse = c.dataset.tache; c.classList.add("drag");
  try{ ev.dataTransfer.setData("text/plain", _glisse); ev.dataTransfer.effectAllowed = "move"; }catch(e){}
});
document.addEventListener("dragend", () => { _glisse = null; document.querySelectorAll(".kb-col.over,.kb-card.drag").forEach(x => x.classList.remove("over", "drag")); });
document.addEventListener("dragover", ev => {
  const col = ev.target.closest && ev.target.closest(".kb-col"); if(!col || !_glisse) return;
  ev.preventDefault();
  document.querySelectorAll(".kb-col.over").forEach(x => { if(x !== col) x.classList.remove("over"); });
  col.classList.add("over");
});
document.addEventListener("drop", ev => {
  const col = ev.target.closest && ev.target.closest(".kb-col"); if(!col || !_glisse) return;
  ev.preventDefault();
  const t = DB.taches[_glisse], st = col.dataset.col; _glisse = null;
  if(!t || t.statut === st) return render();
  const avant = t.statut; t.statut = st;
  if(st === "afaire") t.avance = 0; else if(st === "encours" && !num(t.avance)) t.avance = 10;
  if(st !== "bloque") t.motif = "";
  const msgs = apresStatutTache(t, avant);
  touche(t.projet); sauver(); render();
  toast(["« " + t.titre + " » : " + lib(STATUTS_T, st).toLowerCase()].concat(msgs).join(" · "));
});
document.addEventListener("keydown", ev => {
  if(ev.key === "Enter" && ev.target.id === "r-newrub"){ ev.preventDefault(); const b = document.querySelector('[data-act="r-rub-add"]'); if(b) b.click(); return; }

  if(ev.key === "Enter" && /^moi-(nom|role|mail)$/.test(ev.target.id || "")){ ev.preventDefault(); const b = document.querySelector('[data-act="moi-creer"]'); if(b) b.click(); return; }
  if(ev.key === "Escape"){
    if(state.modal){
      ev.preventDefault();
      if(state.modal.sale) secouerModal("Saisie en cours : Enregistrer pour garder, Annuler pour abandonner");
      else fermerModal();

    else if(state.sheet && state.sheet.t === "revue") secouerModal();

  }
});

/* ============================================================
   ICÔNE ET MANIFESTE, PEINTS À LA COULEUR D'ACCENT
   ============================================================ */
function dessinerIcone(taille, marge){
  const c = document.createElement("canvas");
  c.width = c.height = taille;
  const x = c.getContext("2d"), acc = accentActuel();
  const p = marge ? taille * 0.14 : 0, t = taille - p * 2, r = t * 0.22;
  x.fillStyle = acc;
  if(marge) x.fillRect(0, 0, taille, taille);
  else{
    x.beginPath(); x.moveTo(r, 0); x.arcTo(t, 0, t, t, r); x.arcTo(t, t, 0, t, r);
    x.arcTo(0, t, 0, 0, r); x.arcTo(0, 0, t, 0, r); x.closePath(); x.fill();
  }
  const u = t / 64, o = p, sur = surAccent(acc);
  x.strokeStyle = sur; x.fillStyle = sur; x.lineCap = "round"; x.lineWidth = 5 * u;
  x.beginPath(); x.moveTo(o + 14*u, o + 47*u); x.lineTo(o + 50*u, o + 47*u); x.stroke();
  x.beginPath(); x.moveTo(o + 32*u, o + 12*u); x.lineTo(o + 44*u, o + 26*u); x.lineTo(o + 32*u, o + 40*u); x.lineTo(o + 20*u, o + 26*u); x.closePath(); x.fill();
  return c.toDataURL("image/png");
}
let _manifeste = null;
function majIcone(){
  try{
    const acc = accentActuel(), sur = surAccent(acc);
    const fav = document.getElementById("favicon");
    if(fav) fav.href = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' + SIGLE(acc, sur) + '</svg>');
    const p192 = dessinerIcone(192, false), p512 = dessinerIcone(512, false), pm = dessinerIcone(512, true);
    let at = document.querySelector('link[rel="apple-touch-icon"]');
    if(!at){ at = document.createElement("link"); at.rel = "apple-touch-icon"; document.head.appendChild(at); }
    at.href = p192;
    const sombre = document.documentElement.getAttribute("data-theme") === "sombre";
    const man = { id:"jalon", name:"Jalon — suivi de projets", short_name:"Jalon", start_url:location.href.split("#")[0], scope:".",
      display:"standalone", background_color:sombre ? "#0d0d10" : "#ffffff", theme_color:sombre ? "#0d0d10" : "#ffffff",
      icons:[ { src:p192, sizes:"192x192", type:"image/png" }, { src:p512, sizes:"512x512", type:"image/png" },
              { src:pm, sizes:"512x512", type:"image/png", purpose:"maskable" } ] };
    if(_manifeste) URL.revokeObjectURL(_manifeste);
    _manifeste = URL.createObjectURL(new Blob([JSON.stringify(man)], { type:"application/manifest+json" }));
    let lm = document.querySelector('link[rel="manifest"]');
    if(!lm){ lm = document.createElement("link"); lm.rel = "manifest"; document.head.appendChild(lm); }
    lm.href = _manifeste;
  }catch(e){ /* une icône ratée ne doit pas empêcher l'application de tourner */ }
}

/* ============================================================
   DÉMARRAGE
   ============================================================ */
async function demarrer(){
  try{
    await IDB.ouvrir();
    DB = assembler(await IDB.lire());
  }catch(e){
    document.getElementById("view").innerHTML =
      '<div class="vide" style="margin-top:60px"><b>Stockage indisponible</b>' +
      esc(String((e && e.message) || e)) + '<br>La navigation privée de certains navigateurs interdit IndexedDB.</div>';
    return;
  }
  pret = true;
  if(!litLS(LSTHEME) && DB.settings.theme){ ecritLS(LSTHEME, DB.settings.theme); appliquerTheme(DB.settings.theme); }
  if(!litLS(LSACC) && DB.settings.accent){ ecritLS(LSACC, DB.settings.accent); appliquerAccent(DB.settings.accent); }
  DB.settings.theme = themeActuel();
  DB.settings.accent = accentActuel();
  state.neuf = !!DB.meta.vue && DB.meta.vue !== VERSION;
  if(!DB.meta.vue){ DB.meta.vue = VERSION; sauver(true); }
  // Demande au navigateur de ne pas purger la base quand l'espace manque.
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  render();
  majIcone();
  reconduireTacites();
}
let _jour = todayISO();
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden"){ ecouler(); return; }
  if(!pret) return;
  if(_jour !== todayISO()){ _jour = todayISO(); render(); reconduireTacites(); }
});
window.addEventListener("pagehide", () => { ecouler(); });

demarrer();
