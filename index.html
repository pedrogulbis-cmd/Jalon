  }
  h += '<div class="duo">';
  if(mo.budget) h += '<div class="champ"><label for="rv-conso">Consommé à date (€)</label><input type="number" id="rv-conso" data-rf="conso" inputmode="decimal" min="0" step="any" value="' + esc(m.conso) + '">' +

    .sort((x,y) => cmp(x.fin || "9999", y.fin || "9999"));
  if(T.length){
    h += '<div class="sect"><h2>Tâches du moment</h2><span class="cnt">' + T.length + '</span></div>';

      h += '<div class="ln" style="flex-wrap:wrap"><button class="ln-mid" style="text-align:left" data-act="modifier-tache" data-id="' + t.id + '">' +

    });
  }
  const J = a.J.filter(j => !j.fait && diffJ(auj, j.date) <= 14);

function enregistrerRevue(){
  const s = state.sheet; capturerRevue();
  const p = DB.projets[s.ids[s.i]]; if(!p) return;
  const m = s.m, a = an(p);
  p.meteo = m.meteo || "auto";
  if(!a.T.length) p.avance = clamp(num(m.avance), 0, 100);
  if(M().budget && m.conso !== "") p.conso = num(m.conso);
  if(m.fin && m.fin !== p.fin){ if(!p.finBase) p.finBase = p.fin || m.fin; p.fin = m.fin; }
  p.maj = Date.now();
  _an.delete(p.id);
  const txt = (m.texte || "").trim();
  if(txt){
    const e = { id:uid(), projet:p.id, type:"point", date:todayISO(), texte:txt, meteo:an(p).meteo, cree:Date.now() };
    DB.journal[e.id] = e;
  }
  s.faits++;
  sauver();
  suivantRevue();
}
function suivantRevue(){
  const s = state.sheet;
  if(s.i >= s.ids.length - 1){
    const n = s.faits;
    state.sheet = null; render();
    toast("Point hebdo terminé · " + n + " projet" + pl(n) + " mis à jour");
    return;
  }
  s.i++; s.m = null; render();
  const sh = document.querySelector(".sheet"); if(sh) sh.scrollTop = 0;
}

/* ============================================================
   RAPPORT DIRECTION — une page, imprimable, reprenant les filtres
   ============================================================ */
function donneesRapport(){
  const L = projetsFiltres(true), act = trierProjets(L.filter(actif), "meteo"), auj = todayISO();
  const cnt = { vert:0, orange:0, rouge:0 };
  act.forEach(p => { const m = an(p).meteo; if(cnt[m] != null) cnt[m]++; });
  const jal = []; act.forEach(p => an(p).J.forEach(j => { if(!j.fait && diffJ(auj, j.date) <= 60) jal.push(j); }));
  jal.sort((a,b) => cmp(a.date, b.date));
  const risques = []; act.forEach(p => an(p).rOuv.forEach(r => { if(scoreR(r) >= 8) risques.push(r); }));
  risques.sort((a,b) => scoreR(b) - scoreR(a));
  const ids = new Set(act.map(p => p.id));
  const decisions = V(DB.journal).filter(e => ids.has(e.projet) && e.type === "decision" && diffJ(e.date, auj) <= 30)
    .sort((a,b) => cmp(b.date, a.date));
  return { L, act, cnt, jal, risques, decisions, al:alertes(L).filter(x => x.n !== "info"),
    bud:act.reduce((s,p) => s + an(p).budget, 0), cons:act.reduce((s,p) => s + an(p).conso, 0),
    eac:act.reduce((s,p) => { const a = an(p); return s + (a.eac != null ? a.eac : a.budget); }, 0),
    chP:act.reduce((s,p) => s + an(p).chargePrev, 0), chC:act.reduce((s,p) => s + an(p).chargeConso, 0),
    retard:act.filter(p => an(p).enRetard).length };
}

  if(d.jal.length){ l.push(""); l.push("JALONS À 60 JOURS"); d.jal.slice(0, 12).forEach(j => l.push("• " + frDate(j.date) + " — " + j.titre + " (" + nomProjet(j.projet) + ")" + (j.cle ? " [clé]" : ""))); }

  return l.join("\n");

function ouvrirModal(m){ state.modal = m; render(); }
function fermerModal(){ state.modal = null; render(); }
function capturerModal(){
  const m = state.modal; if(!m) return;
  document.querySelectorAll("#modal [data-f]").forEach(el => { m[el.dataset.f] = el.value; });
}
const copie = o => JSON.parse(JSON.stringify(o));

/* ---------- création des fenêtres ---------- */
function mProjet(p){
  if(p) return { type:"projet", ...copie(p), prio:String(p.prio || ""), avance:String(num(p.avance)), equipe:(p.equipe||[]).slice() };
  const auj = todayISO();
  return { type:"projet", nom:"", code:"", statut:"encours", prio:"2", service:DB.settings.f.service || "", chef:"", sponsor:"",
    debut:auj, fin:addJ(auj, 90), budget:"", conso:"", charge:"", chargeConso:"", avance:"0", meteo:"auto",
    valeur:"", effort:"", equipe:[], description:"", focus:"m-nom" };
}
function mTache(t, pid){
  if(t) return { type:"tache", ...copie(t), fixe:false };
  const p = DB.projets[pid], auj = todayISO();
  return { type:"tache", projet:pid || "", fixe:!!pid, titre:"", resp:"", jalon:"", debut:auj,
    fin:p && p.fin && p.fin < addJ(auj, 14) ? p.fin : addJ(auj, 14), statut:"afaire", avance:"0", charge:"", conso:"", motif:"", note:"", focus:"m-titre" };
}
function mJalon(j, pid){
  if(j) return { type:"jalon", ...copie(j), fixe:false };
  return { type:"jalon", projet:pid || "", fixe:!!pid, titre:"", date:addJ(todayISO(), 30), cle:false, fait:false, note:"", focus:"m-titre" };
}
function mRisque(r, pid){
  if(r) return { type:"risque", ...copie(r), proba:String(r.proba), impact:String(r.impact), fixe:false };
  return { type:"risque", projet:pid || "", fixe:!!pid, titre:"", proba:"2", impact:"2", strat:"reduire", action:"", resp:"", echeance:"", statut:"ouvert", focus:"m-titre" };
}
function mPersonne(pe){
  if(pe) return { type:"personne", ...copie(pe), dispo:pe.dispo == null ? "" : String(pe.dispo).replace(".", ",") };
  return { type:"personne", nom:"", service:"", role:"", email:"", dispo:"2,5", note:"", focus:"m-nom" };
}
function mPoint(e, pid){
  if(e) return { type:"point", ...copie(e), genre:e.type };
  return { type:"point", projet:pid, genre:"point", texte:"", date:todayISO(), focus:"m-texte" };
}

/* ---------- enregistrement ---------- */
function enregistrerProjet(){
  capturerModal();
  const m = state.modal, nom = (m.nom || "").trim();
  if(!nom){ toast("Donnez un nom au projet"); return; }
  if(m.debut && m.fin && m.fin < m.debut){ toast("La fin précède le début"); return; }
  const neuf = !m.id;
  const p = neuf ? { id:uid(), cree:Date.now() } : DB.projets[m.id];
  if(!p) return fermerModal();
  Object.assign(p, {
    nom, code:(m.code||"").trim(), statut:m.statut || "encours", prio:m.prio || "", service:m.service || "", chef:m.chef || "",
    sponsor:(m.sponsor||"").trim(), debut:m.debut || "", fin:m.fin || "", budget:num(m.budget), conso:num(m.conso),
    charge:num(m.charge), chargeConso:num(m.chargeConso), avance:clamp(num(m.avance), 0, 100), meteo:m.meteo || "auto",
    valeur:m.valeur || "", effort:m.effort || "", equipe:(m.equipe||[]).filter(id => DB.personnes[id]),
    description:(m.description||"").trim(), maj:Date.now()
  });
  p.finBase = neuf ? p.fin : (m.finBase || p.fin);
  DB.projets[p.id] = p;
  state.modal = null;
  if(neuf){ state.sheet = { t:"projet", id:p.id }; state.ptab = "synthese"; }
  sauver(); render();
  toast(neuf ? "Projet créé" : "Projet enregistré");
}
function enregistrerTache(){
  capturerModal();
  const m = state.modal, titre = (m.titre || "").trim();
  if(!titre){ toast("Donnez un intitulé à la tâche"); return; }
  if(!m.projet || !DB.projets[m.projet]){ toast("Choisissez un projet"); return; }
  if(m.debut && m.fin && m.fin < m.debut){ toast("L'échéance précède le début"); return; }
  const neuf = !m.id;
  const t = neuf ? { id:uid(), cree:Date.now() } : DB.taches[m.id];
  if(!t) return fermerModal();
  const jalOk = m.jalon && DB.jalons[m.jalon] && DB.jalons[m.jalon].projet === m.projet;
  Object.assign(t, { titre, projet:m.projet, resp:m.resp || "", jalon:jalOk ? m.jalon : "", debut:m.debut || "", fin:m.fin || "",
    statut:m.statut || "afaire", motif:m.statut === "bloque" ? (m.motif||"").trim() : "", charge:num(m.charge), conso:num(m.conso),
    avance:m.statut === "fait" ? 100 : clamp(num(m.avance), 0, 100), note:(m.note||"").trim() });
  if(t.statut === "afaire" && t.avance > 0) t.statut = "encours";
  DB.taches[t.id] = t; touche(t.projet);
  state.modal = null; sauver(); render();
  toast(neuf ? "Tâche ajoutée" : "Tâche enregistrée");
}

/* ---------- suppressions, toujours rattrapables le temps du bandeau ---------- */
let corbeille = null;
function garder(c, k, o){ c[k] = c[k] || {}; if(!c[k][o.id]) c[k][o.id] = copie(o); }
function restaurer(){
  if(!corbeille) return;
  Object.keys(corbeille).forEach(k => Object.keys(corbeille[k]).forEach(id => { DB[k][id] = corbeille[k][id]; }));
  corbeille = null; sauver(); render(); fermerToast(); toast("Restauré");
}
function supprimerProjet(id){
  const p = DB.projets[id]; if(!p) return;
  const c = {}; garder(c, "projets", p);
  ["taches","jalons","risques","journal"].forEach(k => V(DB[k]).forEach(o => { if(o.projet === id){ garder(c, k, o); delete DB[k][o.id]; } }));
  delete DB.projets[id];
  corbeille = c; state.sheet = null; state.modal = null; sauver(); render();
  toast("« " + p.nom + " » supprimé", "annuler");
}
function supprimerSimple(k, id, msg){
  const o = DB[k][id]; if(!o) return;
  const c = {}; garder(c, k, o);
  if(k === "jalons") V(DB.taches).forEach(t => { if(t.jalon === id){ garder(c, "taches", t); t.jalon = ""; } });
  if(o.projet) touche(o.projet);
  delete DB[k][id];
  corbeille = c; state.modal = null; sauver(); render();
  toast(msg, "annuler");
}
function supprimerPersonne(id){
  const pe = DB.personnes[id]; if(!pe) return;
  const c = {}; garder(c, "personnes", pe);
  V(DB.taches).forEach(t => { if(t.resp === id){ garder(c, "taches", t); t.resp = ""; } });
  V(DB.risques).forEach(r => { if(r.resp === id){ garder(c, "risques", r); r.resp = ""; } });
  V(DB.projets).forEach(p => {
    if(p.chef === id || (p.equipe||[]).includes(id)){ garder(c, "projets", p); if(p.chef === id) p.chef = ""; p.equipe = (p.equipe||[]).filter(x => x !== id); }
  });
  delete DB.personnes[id];
  corbeille = c; state.modal = null; if(state.sheet && state.sheet.t === "personne") state.sheet = null;
  sauver(); render();
  toast(pe.nom + " retiré·e de l'équipe", "annuler");
}
function dupliquerProjet(id){
  const p = DB.projets[id]; if(!p) return;
  const n = copie(p); n.id = uid(); n.nom = p.nom + " (copie)"; n.cree = Date.now(); n.maj = Date.now(); n.conso = 0; n.chargeConso = 0;
  DB.projets[n.id] = n;
  const mapJ = {};
  jalonsDe(id).forEach(j => { const x = copie(j); x.id = uid(); x.projet = n.id; x.fait = false; mapJ[j.id] = x.id; DB.jalons[x.id] = x; });
  tachesDe(id).forEach(t => { const x = copie(t); x.id = uid(); x.projet = n.id; x.jalon = mapJ[t.jalon] || ""; x.statut = "afaire"; x.avance = 0; x.conso = 0; DB.taches[x.id] = x; });
  risquesDe(id).forEach(r => { const x = copie(r); x.id = uid(); x.projet = n.id; DB.risques[x.id] = x; });
  state.sheet = { t:"projet", id:n.id }; state.ptab = "synthese";
  sauver(); render(); toast("Projet dupliqué, avec ses tâches, jalons et risques");
}

/* ---------- import / export ---------- */
function telecharger(nom, blob){
  const u = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = u; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 1500);
}
const tampon = () => { const d = new Date(); return d.getFullYear() + p2(d.getMonth()+1) + p2(d.getDate()); };
function exporterJSON(){
  DB.meta.exporte = Date.now();
  const x = copie(DB); x.app = "jalon"; x.exporte = new Date().toISOString();
  telecharger("jalon-" + tampon() + ".json", new Blob([JSON.stringify(x, null, 1)], { type:"application/json" }));
  sauver(true); render(); toast("Sauvegarde exportée");
}
function exporterCSV(){
  const L = trierProjets(projetsFiltres(true), "prio");
  const cel = v => { const s = String(v == null ? "" : v); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const n = v => v == null || v === "" ? "" : String(Math.round(v * 10) / 10).replace(".", ",");
  const tete = ["Projet","Code","Service","Chef de projet","Sponsor","Priorité","Statut","Météo","Météo forcée","Avancement %","Temps écoulé %",
    "Début","Fin prévue","Fin initiale","Glissement (j)","Retard (j)","Budget €","Consommé €","Projection €","Charge prévue j/h","Charge consommée j/h",
    "Tâches","Tâches en retard","Tâches bloquées","Jalons en retard","Risques ouverts","Risque max","Valeur","Effort","Dernier point"];
  const lignes = L.map(p => {
    const a = an(p), dp = journalDe(p.id)[0];
    return [p.nom, p.code, p.service, nomP(p.chef), p.sponsor, p.prio ? "P" + p.prio : "", lib(STATUTS_P, p.statut), METEOS[a.meteo], a.manuel ? "oui" : "",
      a.avance, a.tempsPct, p.debut, p.fin, p.finBase, a.glissement, a.joursRetard, n(a.budget), n(a.conso), n(a.eac), n(a.chargePrev), n(a.chargeConso),
      a.T.length, a.tRetard.length, a.tBloq.length, a.jRetard.length, a.rOuv.length, a.rMax || "", p.valeur, p.effort,
      dp ? frDate(dp.date, true) + " — " + dp.texte : ""].map(cel).join(";");
  });
  telecharger("jalon-portefeuille-" + tampon() + ".csv", new Blob(["﻿" + [tete.join(";")].concat(lignes).join("\r\n")], { type:"text/csv;charset=utf-8" }));
  toast(L.length + " projet" + pl(L.length) + " exporté" + pl(L.length) + " (filtres appliqués)");
}
function importer(){
  const i = document.createElement("input");
  i.type = "file"; i.accept = "application/json,.json";
  i.onchange = async () => {
    const f = i.files && i.files[0]; if(!f) return;
    try{
      const x = JSON.parse(await f.text());
      if(!x || typeof x !== "object" || !x.projets) throw new Error("ce n'est pas une sauvegarde Jalon");
      const n = V(x.projets).length;
      ouvrirModal({ type:"confirmer", titre:"Restaurer la sauvegarde ?", danger:true, bouton:"Remplacer",
        texte:"Le fichier contient " + n + " projet" + pl(n) + ". Les données actuelles de cet appareil seront remplacées.",
        ok:() => {
          const theme = DB.settings.theme, accent = DB.settings.accent;
          DB = assembler(x); DB.settings.theme = theme; DB.settings.accent = accent;
          state.sheet = null; sauver(); render(); toast("Sauvegarde restaurée · " + n + " projet" + pl(n));
        } });
    }catch(e){ toast("Fichier illisible : " + ((e && e.message) || e)); }
  };
  i.click();
}

/* ============================================================
   ACTIONS

const CYCLE = { afaire:"encours", encours:"fait", fait:"afaire", bloque:"encours" };
function ouvrirProjet(id, onglet){ state.sheet = { t:"projet", id }; state.ptab = onglet || "synthese"; state.modal = null; render(); const s = document.querySelector(".sheet"); if(s) s.scrollTop = 0; }

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if(act === "rien"){ if(ev.target.closest("[data-act]") === el) ev.stopPropagation(); return; }

  /* ---- navigation ---- */
  if(act === "tab"){ state.tab = id; state.sheet = null; state.seulRetard = false; if(id === "planning") state.gRecentrer = true; render(); window.scrollTo(0,0); return; }
  if(act === "ouvrir-projet"){ ouvrirProjet(id); return; }
  if(act === "ouvrir-personne"){ state.sheet = { t:"personne", id }; state.modal = null; render(); return; }
  if(act === "fermer-sheet"){ state.sheet = null; render(); return; }
  if(act === "fermer-modal"){ if(ev.target === el || el.tagName === "BUTTON") fermerModal(); return; }
  if(act === "ptab"){ state.ptab = id; render(); return; }
  if(act === "journal-ouvrir" || act === "basculer-journal"){
    state.journal = act === "journal-ouvrir" ? true : !state.journal; state.neuf = false; DB.meta.vue = VERSION; sauver(true);
    if(act === "journal-ouvrir"){ state.tab = "reglages"; state.sheet = null; window.scrollTo(0,0); }
    render(); return;
  }
  if(act === "basculer-masque"){ DB.settings.masque = !masque(); sauver(true); render(); toast(masque() ? "Montants masqués" : "Montants réaffichés"); return; }
  if(act === "annuler"){ restaurer(); return; }

  /* ---- créations ---- */
  if(act === "nouveau"){
    if(state.sheet && state.sheet.t === "projet") return ouvrirModal(mTache(null, state.sheet.id));
    if(state.tab === "equipe") return ouvrirModal(mPersonne());
    if(state.tab === "risques" && M().risques) return ouvrirModal(mRisque(null, ""));
    return ouvrirModal(mProjet());
  }
  if(act === "nouveau-projet") return ouvrirModal(mProjet());
  if(act === "nouvelle-tache") return ouvrirModal(mTache(null, id));
  if(act === "nouveau-jalon") return ouvrirModal(mJalon(null, id));
  if(act === "nouveau-risque") return ouvrirModal(mRisque(null, id || ""));
  if(act === "nouvelle-personne") return ouvrirModal(mPersonne());
  if(act === "nouveau-point") return ouvrirModal(mPoint(null, id));
  if(act === "services") return ouvrirModal({ type:"services" });

  /* ---- modifications ---- */
  if(act === "modifier-projet" && DB.projets[id]) return ouvrirModal(mProjet(DB.projets[id]));
  if(act === "modifier-tache" && DB.taches[id]) return ouvrirModal(mTache(DB.taches[id]));
  if(act === "modifier-jalon" && DB.jalons[id]) return ouvrirModal(mJalon(DB.jalons[id]));
  if(act === "modifier-risque" && DB.risques[id]) return ouvrirModal(mRisque(DB.risques[id]));
  if(act === "modifier-personne" && DB.personnes[id]) return ouvrirModal(mPersonne(DB.personnes[id]));
  if(act === "modifier-point" && DB.journal[id]) return ouvrirModal(mPoint(DB.journal[id]));

  /* ---- champs des fenêtres ---- */
  if(act === "m-set"){ capturerModal(); state.modal[el.dataset.k] = id; render(); return; }
  if(act === "m-bool"){ capturerModal(); state.modal[el.dataset.k] = !state.modal[el.dataset.k]; render(); return; }
  if(act === "m-toggle"){
    capturerModal();
    const k = el.dataset.k, l = state.modal[k] = state.modal[k] || [];
    const i = l.indexOf(id); if(i < 0) l.push(id); else l.splice(i, 1);
    render(); return;
  }
  if(act === "m-rebaser"){ ev.preventDefault(); capturerModal(); state.modal.finBase = state.modal.fin; render(); toast("Fin initiale recalée sur " + frDate(state.modal.fin, true)); return; }
  if(act === "enregistrer-projet") return enregistrerProjet();
  if(act === "enregistrer-tache") return enregistrerTache();
  if(act === "enregistrer-jalon") return enregistrerJalon();
  if(act === "enregistrer-risque") return enregistrerRisque();
  if(act === "enregistrer-personne") return enregistrerPersonne();
  if(act === "enregistrer-point") return enregistrerPoint();
  if(act === "confirmer-ok"){ const m = state.modal; state.modal = null; if(m && m.ok) m.ok(); else render(); return; }

  /* ---- suppressions et copies ---- */
  if(act === "supprimer-projet") return supprimerProjet(id);
  if(act === "supprimer-tache") return supprimerSimple("taches", id, "Tâche supprimée");
  if(act === "supprimer-jalon") return supprimerSimple("jalons", id, "Jalon supprimé");
  if(act === "supprimer-risque") return supprimerSimple("risques", id, "Risque supprimé");
  if(act === "supprimer-point") return supprimerSimple("journal", id, "Entrée supprimée");
  if(act === "supprimer-personne") return supprimerPersonne(id);
  if(act === "dupliquer-projet") return dupliquerProjet(id);
  if(act === "dupliquer-tache"){
    const t = DB.taches[id]; if(!t) return;
    const m = mTache(t); delete m.id; m.titre = t.titre + " (copie)"; m.statut = "afaire"; m.avance = "0"; m.conso = ""; m.focus = "m-titre";
    return ouvrirModal(m);
  }

  /* ---- mises à jour express ---- */
  if(act === "cycle-tache"){
    const t = DB.taches[id]; if(!t) return;
    t.statut = CYCLE[t.statut] || "encours";
    if(t.statut === "fait") t.avance = 100;
    else if(t.statut === "afaire") t.avance = 0;
    else if(t.statut === "encours" && !num(t.avance)) t.avance = 10;
    if(t.statut !== "bloque") t.motif = "";
    touche(t.projet); sauver(); render();
    toast("« " + t.titre + " » : " + lib(STATUTS_T, t.statut).toLowerCase());
    return;
  }
  if(act === "masquer-faits"){ state.masquerFaits = !state.masquerFaits; render(); return; }

  /* ---- filtres et tris ---- */
  if(act === "filtres-raz"){ DB.settings.f = { ...DEFAULTS.settings.f }; state.seulRetard = false; sauver(true); render(); return; }
  if(act === "filtre-meteo"){ DB.settings.f.meteo = DB.settings.f.meteo === id ? "" : id; sauver(true); render(); return; }
  if(act === "tri"){ DB.settings.tri = id; sauver(true); render(); return; }
  if(act === "aller-projets-retard"){ state.tab = "projets"; state.seulRetard = true; DB.settings.tri = "fin"; render(); window.scrollTo(0,0); return; }
  if(act === "seul-retard"){ state.seulRetard = false; render(); return; }
  if(act === "alertes-tout"){ state.alertesTout = !state.alertesTout; render(); return; }
  if(act === "aller-risques-cell"){ state.tab = "risques"; state.rCell = id; state.rFermes = false; render(); window.scrollTo(0,0); return; }
  if(act === "r-cell"){ state.rCell = state.rCell === id ? null : id; render(); return; }
  if(act === "r-fermes"){ state.rFermes = id === "1"; render(); return; }

  /* ---- planning ---- */
  if(act === "g-zoom"){ DB.settings.gZoom = id; state.gDecal = 0; state.gRecentrer = true; sauver(true); render(); return; }
  if(act === "g-decal"){ state.gDecal = id === "0" ? 0 : state.gDecal + Number(id); state.gRecentrer = true; render(); return; }
  if(act === "g-toggle"){ if(state.gOuverts.has(id)) state.gOuverts.delete(id); else state.gOuverts.add(id); render(); return; }
  if(act === "g-tout"){
    if(state.gOuverts.size) state.gOuverts.clear();
    else projetsFiltres(true).forEach(p => { if(tachesDe(p.id).length) state.gOuverts.add(p.id); });
    render(); return;
  }

  /* ---- point hebdo ---- */
  if(act === "revue") return demarrerRevue();
  if(act === "rv-set"){ capturerRevue(); state.sheet.m[el.dataset.k] = id; render(); return; }
  if(act === "rv-tstat"){
    capturerRevue();
    const t = DB.taches[id]; if(!t) return;
    t.statut = el.dataset.s;
    if(t.statut === "fait") t.avance = 100;
    else if(t.statut === "encours" && !num(t.avance)) t.avance = 10;
    touche(t.projet); sauver(); render(); return;
  }
  if(act === "rv-jfait"){ capturerRevue(); const j = DB.jalons[id]; if(j){ j.fait = true; touche(j.projet); sauver(); render(); toast("Jalon « " + j.titre + " » atteint"); } return; }
  if(act === "rv-prec"){ capturerRevue(); state.sheet.i--; state.sheet.m = null; render(); return; }
  if(act === "rv-passer") return suivantRevue();
  if(act === "rv-ok") return enregistrerRevue();

  /* ---- rapport ---- */
  if(act === "rapport"){ state.sheet = { t:"rapport" }; render(); return; }
  if(act === "imprimer"){ window.print(); return; }
  if(act === "rapport-copier"){
    const txt = texteRapport();
    try{ await navigator.clipboard.writeText(txt); toast("Synthèse copiée : collez-la dans un mail"); }
    catch(e){ telecharger("jalon-synthese-" + tampon() + ".txt", new Blob([txt], { type:"text/plain;charset=utf-8" })); toast("Copie refusée : synthèse téléchargée"); }
    return;
  }

  /* ---- réglages ---- */
  if(act === "theme"){ ecritLS(LSTHEME, id); DB.settings.theme = id; appliquerTheme(id); sauver(true); render(); majIcone(); return; }
  if(act === "accent"){ ecritLS(LSACC, id); DB.settings.accent = id; appliquerAccent(id); sauver(true); render(); majIcone(); return; }
  if(act === "module"){ DB.settings.modules[id] = !DB.settings.modules[id]; if(id === "budget" && !DB.settings.modules.budget) DB.settings.masque = false; sauver(true); render(); return; }
  if(act === "obsolete"){ DB.settings.obsolete = Number(id); sauver(true); render(); return; }
  if(act === "svc-ajout"){
    const i = $("#m-svc"), v = (i && i.value || "").trim();
    if(!v) return;
    if(!DB.settings.services.some(s => norm(s) === norm(v))) DB.settings.services.push(v);
    sauver(); render(); const j = $("#m-svc"); if(j) j.focus(); return;
  }
  if(act === "svc-suppr"){ DB.settings.services.splice(Number(id), 1); if(!DB.settings.services.includes(DB.settings.f.service)) DB.settings.f.service = ""; sauver(); render(); return; }
  if(act === "exporter-json") return exporterJSON();
  if(act === "exporter-csv") return exporterCSV();
  if(act === "importer") return importer();
  if(act === "exemple"){
    if(!V(DB.projets).length) return exemple();
    return ouvrirModal({ type:"confirmer", titre:"Ajouter l'exemple ?", texte:"Sept projets fictifs et huit personnes s'ajouteront à vos données. Vous pourrez les supprimer un par un.", bouton:"Ajouter", ok:exemple });
  }
  if(act === "effacer"){
    return ouvrirModal({ type:"confirmer", titre:"Tout effacer ?", danger:true, bouton:"Tout effacer",
      texte:"Projets, tâches, jalons, risques, équipe et journal seront supprimés de cet appareil. Exportez d'abord une sauvegarde si vous avez un doute.",
      ok:() => {
        const s = DB.settings;
        DB = JSON.parse(JSON.stringify(DEFAULTS));
        DB.settings.theme = s.theme; DB.settings.accent = s.accent; DB.settings.services = s.services; DB.settings.organisation = s.organisation;
        state.sheet = null; sauver(); render(); toast("Tout est effacé");
      } });
  }
});

document.addEventListener("input", ev => {
  const el = ev.target;
  if(el.id === "q"){ state.q = el.value; render(); return; }
  if(el.id === "set-org"){ DB.settings.organisation = el.value; sauver(); return; }
  if(el.dataset && el.dataset.out){ const o = document.getElementById(el.dataset.out); if(o) o.textContent = el.value + " %"; }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if(el.dataset && el.dataset.filtre){ DB.settings.f[el.dataset.filtre] = el.value; sauver(true); render(); return; }
  if(el.dataset && el.dataset.rerender){ capturerModal(); if(state.modal && el.dataset.f === "projet") state.modal.jalon = ""; render(); }
});
document.addEventListener("keydown", ev => {
  if(ev.key === "Escape"){
    if(state.modal){ fermerModal(); ev.preventDefault(); }
    else if(state.sheet){ state.sheet = null; render(); ev.preventDefault(); }
    return;
  }
  if(ev.key === "Enter" && state.modal && ev.target.tagName === "INPUT"){
    ev.preventDefault();
    if(ev.target.id === "m-svc"){ const b = document.querySelector('[data-act="svc-ajout"]'); if(b) b.click(); return; }
    const b = document.querySelector(".mdl .btn.pri"); if(b) b.click();
  }
});

/* ============================================================
   ICÔNE ET MANIFESTE, PEINTS À LA COULEUR D'ACCENT
   ============================================================ */
function dessinerIcone(taille, marge){
  const c = document.createElement("canvas");
  c.width = c.height = taille;
  const x = c.getContext("2d"), acc = accentActuel();
  const p = marge ? taille * 0.14 : 0, t = taille - p * 2, r = t * 0.22;
  x.fillStyle = acc;
  if(marge) x.fillRect(0, 0, taille, taille);
  else{
    x.beginPath(); x.moveTo(r, 0); x.arcTo(t, 0, t, t, r); x.arcTo(t, t, 0, t, r);
    x.arcTo(0, t, 0, 0, r); x.arcTo(0, 0, t, 0, r); x.closePath(); x.fill();
  }
  const u = t / 64, o = p, sur = surAccent(acc);
  x.strokeStyle = sur; x.fillStyle = sur; x.lineCap = "round"; x.lineWidth = 5 * u;
  x.beginPath(); x.moveTo(o + 14*u, o + 47*u); x.lineTo(o + 50*u, o + 47*u); x.stroke();
  x.beginPath(); x.moveTo(o + 32*u, o + 12*u); x.lineTo(o + 44*u, o + 26*u); x.lineTo(o + 32*u, o + 40*u); x.lineTo(o + 20*u, o + 26*u); x.closePath(); x.fill();
  return c.toDataURL("image/png");
}
let _manifeste = null;
function majIcone(){
  try{
    const acc = accentActuel(), sur = surAccent(acc);
    const fav = document.getElementById("favicon");
    if(fav) fav.href = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' + SIGLE(acc, sur) + '</svg>');
    const p192 = dessinerIcone(192, false), p512 = dessinerIcone(512, false), pm = dessinerIcone(512, true);
    let at = document.querySelector('link[rel="apple-touch-icon"]');
    if(!at){ at = document.createElement("link"); at.rel = "apple-touch-icon"; document.head.appendChild(at); }
    at.href = p192;
    const sombre = document.documentElement.getAttribute("data-theme") === "sombre";
    const man = { id:"jalon", name:"Jalon — suivi de projets", short_name:"Jalon", start_url:location.href.split("#")[0], scope:".",
      display:"standalone", background_color:sombre ? "#0d0d10" : "#ffffff", theme_color:sombre ? "#0d0d10" : "#ffffff",
      icons:[ { src:p192, sizes:"192x192", type:"image/png" }, { src:p512, sizes:"512x512", type:"image/png" },
              { src:pm, sizes:"512x512", type:"image/png", purpose:"maskable" } ] };
    if(_manifeste) URL.revokeObjectURL(_manifeste);
    _manifeste = URL.createObjectURL(new Blob([JSON.stringify(man)], { type:"application/manifest+json" }));
    let lm = document.querySelector('link[rel="manifest"]');
    if(!lm){ lm = document.createElement("link"); lm.rel = "manifest"; document.head.appendChild(lm); }
    lm.href = _manifeste;
  }catch(e){ /* une icône ratée ne doit pas empêcher l'application de tourner */ }
}

/* ============================================================
   DÉMARRAGE
   ============================================================ */
async function demarrer(){
  try{
    await IDB.ouvrir();
    DB = assembler(await IDB.lire());
  }catch(e){
    document.getElementById("view").innerHTML =
      '<div class="vide" style="margin-top:60px"><b>Stockage indisponible</b>' +
      esc(String((e && e.message) || e)) + '<br>La navigation privée de certains navigateurs interdit IndexedDB.</div>';
    return;
  }
  pret = true;
  if(!litLS(LSTHEME) && DB.settings.theme){ ecritLS(LSTHEME, DB.settings.theme); appliquerTheme(DB.settings.theme); }
  if(!litLS(LSACC) && DB.settings.accent){ ecritLS(LSACC, DB.settings.accent); appliquerAccent(DB.settings.accent); }
  DB.settings.theme = themeActuel();
  DB.settings.accent = accentActuel();
  state.neuf = !!DB.meta.vue && DB.meta.vue !== VERSION;
  if(!DB.meta.vue){ DB.meta.vue = VERSION; sauver(true); }
  // Demande au navigateur de ne pas purger la base quand l'espace manque.
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  render();
  majIcone();
}
let _jour = todayISO();
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden"){ ecouler(); return; }
  if(!pret) return;
  if(_jour !== todayISO()){ _jour = todayISO(); render(); }
});
window.addEventListener("pagehide", () => { ecouler(); });

demarrer();
</script>
