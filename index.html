<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jalon">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Suivi de projets simple : jalons, retards, budget, charge, risques. Hors ligne, données locales.">
<title>Jalon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232C3AE0'/%3E%3Cpath d='M14 47h36' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 12 44 26 32 40 20 26z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --fond:#ffffff; --fond2:#fafafa; --carte:#ffffff;
  --trait:#e6e6e9; --trait2:#f1f1f4;
  --texte:#000000; --gris:#71717a; --gris2:#a1a1aa;
  --acc:#2C3AE0; --accF:rgba(44,58,224,.08); --accB:rgba(44,58,224,.35); --surAcc:#ffffff;
  --ok:#0B6B45;   --okF:rgba(11,107,69,.10);
  --att:#B3701E;  --attF:rgba(179,112,30,.12);
  --dang:#B32424; --dangF:rgba(179,36,36,.09);
  --voile:rgba(255,255,255,.88);
  --ombre:0 1px 2px rgba(0,0,0,.04), 0 8px 28px rgba(0,0,0,.06);
  --r:12px;
  --tab:calc(58px + env(safe-area-inset-bottom));
  --rail:0px;
  --max:640px;
}
html[data-theme="sombre"]{
  --fond:#0d0d10; --fond2:#141418; --carte:#141418;
  --trait:#26262d; --trait2:#1c1c22;
  --texte:#f6f6f7; --gris:#9a9aa4; --gris2:#6d6d78;
  --accF:rgba(255,255,255,.06); --accB:rgba(255,255,255,.22); --surAcc:#ffffff;
  --ok:#4ADE9B;   --okF:rgba(74,222,155,.12);
  --att:#F0B45C;  --attF:rgba(240,180,92,.14);
  --dang:#FF7B72; --dangF:rgba(255,123,114,.12);
  --voile:rgba(13,13,16,.88);
  --ombre:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--fond);color:var(--texte);
  font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;padding-left:var(--rail);
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:var(--acc)}
h1,h2,h3{font-weight:600;margin:0;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.015em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.c-ok{color:var(--ok)} .c-att{color:var(--att)} .c-dang{color:var(--dang)} .c-gris{color:var(--gris)}
.hide{display:none!important}

/* ---------------- ossature ---------------- */
.wrap{max-width:var(--max);margin:0 auto;padding:0 18px calc(var(--tab) + 28px);position:relative;z-index:1}
header.top{position:sticky;top:0;z-index:30;background:var(--voile);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--trait);padding-top:env(safe-area-inset-top)}
.top-in{max-width:var(--max);margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.03em}
.brand svg{display:block;border-radius:7px}
.top-sp{flex:1}
.ver{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--gris);
  border:1px solid var(--trait);border-radius:7px;padding:3px 7px;background:var(--fond2)}
.ver.neuf{color:var(--acc);border-color:var(--accB);background:var(--accF)}
.iconbtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
  border:1px solid var(--trait);color:var(--texte);background:var(--carte);flex:0 0 36px}
.iconbtn.on{border-color:var(--accB);background:var(--accF);color:var(--acc)}
.iconbtn:active{background:var(--fond2)}
.iconbtn.pri{background:var(--acc);border-color:var(--acc);color:var(--surAcc)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--voile);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--trait);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--gris);font-size:9.5px;letter-spacing:-.01em;border-top:2px solid transparent;margin-top:-1px}
.tab span{white-space:nowrap}
.tab.on{color:var(--texte);border-top-color:var(--acc)}
.tab.on svg{color:var(--acc)}

/* Sur grand écran : la barre d'onglets devient un rail à gauche et la page
   s'élargit pour que le tableau de bord tienne en deux colonnes. */
@media(min-width:960px){
  :root{--tab:0px;--rail:84px;--max:1240px}
  nav.tabs{top:0;right:auto;width:84px;border-top:0;border-right:1px solid var(--trait);
    padding:calc(env(safe-area-inset-top) + 70px) 0 0}
  .tabs-in{grid-template-columns:1fr;gap:2px}
  .tab{border-top:0;border-left:2px solid transparent;margin:0;padding:12px 0;font-size:11px}
  .tab.on{border-left-color:var(--acc)}
  .wrap{padding-bottom:48px}
}

/* ---------------- en-tête de vue ---------------- */
.total{padding:24px 0 18px;border-bottom:1px solid var(--trait)}
.total-lbl{font-size:13.5px;color:var(--gris)}
.total-val{font-size:clamp(30px,9vw,42px);font-weight:600;letter-spacing:-.045em;
  line-height:1.05;margin:6px 0 0;display:block}
.total-sub{font-size:13px;color:var(--gris);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.total-sub b{font-weight:500;color:var(--texte)}
.vh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vh .sp{flex:1}
.vh .btns{margin:0}

/* ---------------- jauges ---------------- */
.bud-b{height:6px;border-radius:4px;background:var(--trait2);overflow:hidden;margin-top:7px}
.bud-b i{display:block;height:100%;background:var(--acc);transition:width .25s}
.bud-b i.ok{background:var(--ok)} .bud-b i.att{background:var(--att)} .bud-b i.dang{background:var(--dang)}
/* avancement + repère du temps écoulé : l'écart entre les deux se lit d'un coup d'œil */
.av{position:relative;height:6px;border-radius:4px;background:var(--trait2);margin-top:8px}
.av i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--acc)}
.av i.vert{background:var(--ok)} .av i.orange{background:var(--att)} .av i.rouge{background:var(--dang)} .av i.gris{background:var(--gris2)}
.av b{position:absolute;top:-4px;width:2px;height:14px;margin-left:-1px;background:var(--texte);border-radius:1px;opacity:.6}

/* ---------------- sections et listes ---------------- */
.sect{margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.sect h2{font-size:15px;font-weight:600}
.sect .cnt{font-size:12.5px;color:var(--gris2)}
.sect .sp{flex:1}
.sect .lien{font-size:13px;color:var(--acc)}
.vide{padding:30px 4px;color:var(--gris);font-size:14px;text-align:center;border-bottom:1px solid var(--trait2)}
.vide b{display:block;color:var(--texte);font-weight:500;margin-bottom:5px;font-size:15px}
.vide.petit{padding:16px 4px;font-size:13px}
.badge{display:inline-block;font-size:10px;border:1px solid var(--trait);color:var(--gris);
  border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px;font-family:"IBM Plex Mono",monospace;
  white-space:nowrap;line-height:16px}
.badge.ok{color:var(--ok);border-color:var(--okF);background:var(--okF)}
.badge.att{color:var(--att);border-color:var(--attF);background:var(--attF)}
.badge.dang{color:var(--dang);border-color:var(--dangF);background:var(--dangF)}
.badge.acc{color:var(--acc);border-color:var(--accB);background:var(--accF)}
.badge.plein{margin-left:0}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;background:var(--gris2);display:inline-block}
.dot.vert{background:var(--ok)} .dot.orange{background:var(--att)} .dot.rouge{background:var(--dang)}
.meteo{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:500;
  background:var(--fond2);color:var(--gris)}
.meteo.vert{background:var(--okF);color:var(--ok)} .meteo.orange{background:var(--attF);color:var(--att)}
.meteo.rouge{background:var(--dangF);color:var(--dang)}
.meteo .dot{background:currentColor}

/* ligne de projet */
.pf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;text-align:left;
  padding:12px 2px;border-bottom:1px solid var(--trait2);align-items:center}
.pf-n{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500;letter-spacing:-.01em}
.pf-n .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-m{grid-column:1;font-size:11.5px;color:var(--gris2);font-family:"IBM Plex Mono",monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-r{grid-row:1 / span 2;grid-column:2;text-align:right}
.pf-r .v{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:500;display:block}
.pf-r .s{font-size:11px;color:var(--gris2);font-family:"IBM Plex Mono",monospace;display:block}
.pf-b{grid-column:1 / -1}
.pf-c{grid-column:1 / -1;font-size:12px;color:var(--gris);font-style:italic;margin-top:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:720px){
  .pf{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 110px 90px;gap:2px 16px}
  .pf-m{grid-column:1}
  .pf-b{grid-column:2;grid-row:1 / span 2;align-self:center}
  .pf-b .av{margin-top:0}
  .pf-bud{grid-column:3;grid-row:1 / span 2;text-align:right;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
  .pf-bud .s{display:block;font-size:10.5px;color:var(--gris2)}
  .pf-r{grid-column:4}
  .pf-c{grid-column:1 / -1}
}
@media(max-width:719px){ .pf-bud{display:none} }

/* ligne générique */
.ln{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  padding:11px 2px;border-bottom:1px solid var(--trait2)}
.ln-ic{width:30px;height:30px;flex:0 0 30px;border-radius:8px;display:grid;place-items:center;
  background:var(--fond2);color:var(--gris);margin-top:1px}
.ln-ic.dang{background:var(--dangF);color:var(--dang)} .ln-ic.att{background:var(--attF);color:var(--att)}
.ln-ic.ok{background:var(--okF);color:var(--ok)} .ln-ic.acc{background:var(--accF);color:var(--acc)}
.ln-mid{flex:1;min-width:0}
.ln-t{display:block;font-size:14px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.ln-m{display:block;font-size:11.5px;color:var(--gris2);margin-top:2px;
  font-family:"IBM Plex Mono",monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ln-n{display:block;font-size:12px;color:var(--gris);margin-top:3px;line-height:1.4}
.ln-r{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;white-space:nowrap;padding-top:2px;text-align:right}
.ln-r .s{display:block;font-size:10.5px;color:var(--gris2);font-weight:400}

/* tâches et jalons */
.st{width:24px;height:24px;border-radius:50%;border:2px solid var(--gris2);display:grid;place-items:center;
  flex:0 0 24px;margin-top:1px;color:transparent}
.st.encours{border-color:var(--acc);background:conic-gradient(var(--acc) 0 50%,transparent 50% 100%)}
.st.bloque{border-color:var(--dang);color:var(--dang);background:var(--dangF)}
.st.fait{border-color:var(--ok);background:var(--ok);color:#fff}
html[data-theme="sombre"] .st.fait{color:#0d0d10}
.tk.fait .ln-t{color:var(--gris);text-decoration:line-through;text-decoration-color:var(--gris2)}
.jl{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:16px 2px 8px;border-bottom:1px solid var(--trait)}
.jl .ln-mid{font-weight:600;font-size:14px}
.dia{width:12px;height:12px;flex:0 0 12px;transform:rotate(45deg);border-radius:2px;background:var(--acc);margin:0 6px}
.dia.fait{background:var(--ok)} .dia.retard{background:var(--dang)} .dia.gris{background:var(--gris2)}
.dia.cle{box-shadow:0 0 0 2px var(--fond),0 0 0 3.5px currentColor}
.tk{padding-left:10px}

/* ---------------- chips, filtres, boutons ---------------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:12.5px;padding:6px 11px;border-radius:999px;
  border:1px solid var(--trait);color:var(--gris);background:var(--carte)}
.chip.on{color:var(--surAcc);background:var(--acc);border-color:var(--acc)}
html[data-theme="sombre"] .chip.on{color:#0d0d10;background:var(--texte);border-color:var(--texte)}
.chip .n{font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.7;margin-left:4px}
.fbar{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;align-items:center}
.fbar::-webkit-scrollbar{display:none}
.fbar select{width:auto;flex:0 0 auto;padding:6px 28px 6px 11px;border-radius:999px;font-size:12.5px;
  color:var(--gris);background-position:right 10px center}
.fbar select.on{color:var(--acc);border-color:var(--accB);background-color:var(--accF)}
.fbar .raz{font-size:12.5px;color:var(--acc);white-space:nowrap;padding:6px 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 14px;border-radius:10px;border:1px solid var(--trait);background:var(--carte);
  font-size:14px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.btn:active{background:var(--fond2)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--surAcc)}
.btn.dang{color:var(--dang);border-color:var(--dangF)}
.btn.pt{padding:7px 11px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}
.btns.grow>*{flex:1}
.seg{display:inline-flex;border:1px solid var(--trait);border-radius:9px;overflow:hidden;max-width:100%}
.seg button{padding:7px 11px;font-size:13px;color:var(--gris);border-right:1px solid var(--trait);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:var(--surAcc)}
html[data-theme="sombre"] .seg button.on{background:var(--texte);color:#0d0d10}
.seg.plein{display:flex;width:100%}
.seg.plein button{flex:1;padding:8px 4px}
.seg button.m-vert.on{background:var(--ok);color:#fff} .seg button.m-orange.on{background:var(--att);color:#fff}
.seg button.m-rouge.on{background:var(--dang);color:#fff}

/* ---------------- tableau de bord ---------------- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 6px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tuile{border:1px solid var(--trait);border-radius:var(--r);padding:12px 13px 13px;background:var(--carte);
  text-align:left;width:100%;display:block;min-width:0}
button.tuile:active{background:var(--fond2)}
.tuile .tl{font-size:12px;color:var(--gris);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.tuile .tv{font-size:clamp(22px,6vw,28px);font-weight:600;letter-spacing:-.04em;margin-top:5px;line-height:1.1;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tuile .tv small{font-size:13px;color:var(--gris);font-weight:500;letter-spacing:-.01em}
.tuile .ts{font-size:11.5px;color:var(--gris2);margin-top:5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;background:var(--trait2)}
.mbar i{display:block;height:100%}
.mleg{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--gris)}
.mleg button{display:inline-flex;align-items:center;gap:6px;color:var(--gris)}
.mleg button b{color:var(--texte);font-weight:600;font-family:"IBM Plex Mono",monospace}
.mleg button.on{color:var(--texte);text-decoration:underline;text-underline-offset:3px}
.dgrid{display:grid;gap:0 18px;grid-template-columns:minmax(0,1fr)}
.dgrid>*{min-width:0}
.rappel{display:flex;align-items:center;gap:10px;margin:14px 0 0;padding:10px 12px;border-radius:10px;
  background:var(--attF);color:var(--att);font-size:13px;line-height:1.4}
.rappel span{display:grid}
.rappel span:nth-child(2){display:block;color:var(--texte)}
/* composeur de mail */
.dest{display:flex;gap:6px;flex-wrap:wrap}
.dest .chip{display:inline-flex;align-items:center;gap:5px}
.dest .chip b{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600}
.dest .chip.cc{color:var(--acc);border-color:var(--accB);background:var(--accF)}
.dest .chip[disabled]{opacity:.45;cursor:not-allowed}
.apercu-mail{border:1px solid var(--trait);border-radius:10px;background:#fff;color:#111;padding:12px 14px;
  max-height:320px;overflow:auto;font-size:13px}
.apercu-mail .obj{font-weight:600;border-bottom:1px solid #e5e5e5;padding-bottom:8px;margin-bottom:8px}
.tend{font-size:12px;font-weight:500;white-space:nowrap}
.jour-h{font-size:11px;color:var(--gris2);font-family:"IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.05em;
  padding:12px 2px 4px;border-bottom:1px solid var(--trait2)}
.jour-h.dang{color:var(--dang)} .jour-h.acc{color:var(--acc)}
.plus-r{width:100%;padding:11px 2px 4px;font-size:13px;color:var(--acc);text-align:center}
.sheet.fixe,.mdl.fixe{animation:none}
.liste-c{margin:4px 0 8px;padding-left:20px}
.liste-c li{font-size:14px;margin:0 0 5px;line-height:1.45}
.chk{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--trait2)}
.chk-b{width:22px;height:22px;flex:0 0 22px;border-radius:6px;border:2px solid var(--gris2);display:grid;place-items:center;color:#fff}
.chk.on .chk-b{background:var(--ok);border-color:var(--ok)}
html[data-theme="sombre"] .chk.on .chk-b{color:#0d0d10}
.chk-t{flex:1;min-width:0;font-size:14px}
.chk.on .chk-t{color:var(--gris)}
.chk-x{color:var(--gris2);display:grid;padding:4px}
.obj-l{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--trait2);flex-wrap:wrap}
.obj-t{flex:1;min-width:160px;font-size:13.5px}
.kb{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:10px;overflow-x:auto;padding:4px 0 8px;margin:8px 0 0;-webkit-overflow-scrolling:touch}
.kb-col{background:var(--fond2);border:1px solid var(--trait2);border-radius:12px;padding:8px;min-height:140px}
.kb-col.over{outline:2px dashed var(--acc);outline-offset:-2px}
.kb-h{font-size:13px;font-weight:600;padding:2px 4px 8px;display:flex;align-items:center;gap:7px}
.kb-h .cnt{margin-left:auto;font-weight:400;font-size:12px;color:var(--gris2);font-family:"IBM Plex Mono",monospace}
.kb-card{background:var(--carte);border:1px solid var(--trait);border-radius:10px;padding:9px 10px;margin-bottom:7px;display:flex;gap:9px;align-items:flex-start;cursor:grab}
.kb-card.retard{border-left:3px solid var(--dang)}
.kb-card.drag{opacity:.4}

}

const LSACC   = "jalon.accent";

  ["#2C3AE0","Encre"], ["#7A3FA8","Prune"], ["#0E7490","Océan"],

function litLS(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function ecritLS(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function themeActuel(){ return litLS(LSTHEME) || "clair"; }
function accentActuel(){ return litLS(LSACC) || ACCENTS[0][0]; }
function hexRGBA(h,a){
  const n = parseInt(h.slice(1),16);
  return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
}
function surAccent(h){
  const n = parseInt(h.slice(1),16);
  const l = (0.299*((n>>16)&255) + 0.587*((n>>8)&255) + 0.114*(n&255)) / 255;
  return l > .62 ? "#000000" : "#ffffff";
}
function appliquerAccent(h){
  const r = document.documentElement.style;
  r.setProperty("--acc", h);
  r.setProperty("--accF", hexRGBA(h,.08));
  r.setProperty("--accB", hexRGBA(h,.35));
  r.setProperty("--surAcc", surAccent(h));
}
function appliquerTheme(t){
  const sombre = t === "auto" ? !!(media && media.matches) : t === "sombre";
  document.documentElement.setAttribute("data-theme", sombre ? "sombre" : "clair");
  const m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", sombre ? "#0d0d10" : "#ffffff");
}
appliquerTheme(themeActuel());
appliquerAccent(accentActuel());
if(media && media.addEventListener)
  media.addEventListener("change", () => { if(themeActuel() === "auto") appliquerTheme("auto"); });

/* ---------- dates : tout est en ISO « AAAA-MM-JJ », calculé à midi pour
   qu'un changement d'heure ne fasse jamais sauter un jour ---------- */
const isoDe = d => d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const todayISO = () => isoDe(new Date());
const dateDe = iso => new Date(iso + "T12:00:00");
const diffJ = (a,b) => Math.round((dateDe(b) - dateDe(a)) / 86400000);
const addJ = (iso,n) => { const d = dateDe(iso); d.setDate(d.getDate()+n); return isoDe(d); };
const MOIS = ["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
const MOIS_LONG = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function frDate(iso, avecAn){
  if(!iso) return "—";
  const d = dateDe(iso);
  if(isNaN(d)) return iso;
  const an = (avecAn || d.getFullYear() !== new Date().getFullYear()) ? " " + d.getFullYear() : "";
  return d.getDate() + " " + MOIS[d.getMonth()] + an;
}
function relJ(iso){
  if(!iso) return "—";
  const j = diffJ(todayISO(), iso);
  if(j === 0) return "aujourd'hui";
  if(j === 1) return "demain";
  if(j === -1) return "hier";
  if(j > 1 && j <= 45) return "dans " + j + " j";
  if(j < -1 && j >= -45) return "il y a " + (-j) + " j";
  return frDate(iso);
}
function quand(ts){
  if(!ts) return "—";
  const d = new Date(ts);
  return frDate(isoDe(d), true) + " " + p2(d.getHours()) + ":" + p2(d.getMinutes());
}
const cap = s => String(s||"").charAt(0).toUpperCase() + String(s||"").slice(1);
const initiales = n => String(n||"?").trim().split(/\s+/).slice(0,2).map(x => x.charAt(0).toUpperCase()).join("") || "?";

/* ---------- argent et charge ----------
   Les budgets se tiennent à l'euro près : un suivi de projet n'a que faire
   des centimes. Tout montant affiché passe par eur() : masquer les chiffres
   pendant une présentation ne peut donc rien laisser échapper. */
const masque = () => !!DB.settings.masque;
let _nf = null;
function eur(v){
  if(masque()) return "••••";
  if(!_nf) _nf = new Intl.NumberFormat("fr-FR", { style:"currency", currency:"EUR", maximumFractionDigits:0 });
  return _nf.format(Math.round(v||0));
}
function eurC(v){
  if(masque()) return "••••";
  v = v || 0; const a = Math.abs(v);
  if(a >= 1e6) return (v/1e6).toLocaleString("fr-FR", { maximumFractionDigits:1 }) + " M€";
  if(a >= 1e4) return Math.round(v/1e3).toLocaleString("fr-FR") + " k€";
  return eur(v);
}
const jh = v => (Math.round((v||0)*10)/10).toLocaleString("fr-FR") + " j";

function toast(msg, action){
  const t = $("#toast");
  t.innerHTML = '<span>' + esc(msg) + '</span>' +
    (action ? '<button class="toast-act" data-act="' + action + '">Annuler</button>' : "");
  t.classList.toggle("agir", !!action);
  t.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("on","agir"), action ? 7000 : 2600);
}
function fermerToast(){ const t = $("#toast"); if(t) t.classList.remove("on","agir"); clearTimeout(toast._t); }

/* ============================================================
   STOCKAGE — IndexedDB
   Un portefeuille de projets pèse quelques centaines de Ko au plus : on
   garde l'objet entier en mémoire, et on l'écrit d'un bloc, avec un léger
   différé pour regrouper les rafales de modifications.
   ============================================================ */
const DEFAULTS = {
  version:SCHEMA, projets:{}, taches:{}, jalons:{}, risques:{}, personnes:{}, journal:{},
  settings:{
    theme:"clair", accent:ACCENTS[0][0], masque:false,
    organisation:"",
    services:["Direction","DSI","Finance","RH","Production","Commercial","Logistique"],
    modules:{ budget:true, charge:true, risques:true, valeur:true, cadrage:true, raci:true, reunions:true, gonogo:true, kanban:true, dependances:true },
    f:{ service:"", chef:"", prio:"", statut:"actifs", meteo:"" },
    tri:"meteo", gZoom:"6m", obsolete:14,
    moi:"", signature:"", mailDirection:"", respServices:{}
  },
  meta:{ cree:Date.now(), modifie:0, exporte:0, vue:null }
};
let DB = JSON.parse(JSON.stringify(DEFAULTS));
let pret = false;

const IDB = (() => {
  let db = null;
  const prom = r => new Promise((res,rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return {
    ouvrir(){
      return new Promise((res,rej) => {
        if(!window.indexedDB) return rej(new Error("IndexedDB indisponible"));
        const r = indexedDB.open("jalon", 1);
        r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains("kv")) r.result.createObjectStore("kv"); };
        r.onsuccess = () => { db = r.result; res(); };
        r.onerror   = () => rej(r.error || new Error("ouverture refusée"));
        r.onblocked = () => rej(new Error("base verrouillée par un autre onglet"));
      });
    },
    lire(){ return prom(db.transaction("kv").objectStore("kv").get("db")); },
    ecrire(v){
      return new Promise((res,rej) => {
        const t = db.transaction("kv", "readwrite");
        t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
        t.objectStore("kv").put(v, "db");
      });
    }
  };
})();
let _fl = null, _sale = false;
function sauver(interne){
  if(!interne) DB.meta.modifie = Date.now();
  _sale = true; clearTimeout(_fl); _fl = setTimeout(ecouler, 180);
}
async function ecouler(){
  clearTimeout(_fl);
  if(!pret || !_sale) return;
  _sale = false;
  try{ await IDB.ecrire(JSON.parse(JSON.stringify(DB))); }
  catch(e){ toast("Enregistrement impossible : " + ((e && e.message) || e)); }
}
function assembler(x){
  const d = JSON.parse(JSON.stringify(DEFAULTS));
  if(!x || typeof x !== "object") return d;
  ["projets","taches","jalons","risques","personnes","journal"].forEach(k => { if(x[k]) d[k] = x[k]; });
  const s = x.settings || {};
  d.settings = { ...d.settings, ...s,
    modules:{ ...d.settings.modules, ...(s.modules||{}) },
    f:{ ...d.settings.f, ...(s.f||{}) },
    services: Array.isArray(s.services) ? s.services : d.settings.services };
  d.meta = { ...d.meta, ...(x.meta||{}) };
  return d;
}

const PROBAS  = ["Rare","Possible","Probable","Quasi certain"];
const IMPACTS = ["Mineur","Modéré","Majeur","Critique"];
const STRATS = [["reduire","Réduire"],["accepter","Accepter"],["transferer","Transférer"],["eviter","Éviter"]];
const METEOS = { vert:"Sous contrôle", orange:"À surveiller", rouge:"En difficulté", gris:"Hors suivi" };
const ORDRE_M = { rouge:0, orange:1, vert:2, gris:3 };
const TYPES_J = [["point","Point"],["decision","Décision"],["probleme","Problème"]];
const NIV_R = { faible:"Faible", moyen:"Modéré", fort:"Fort", crit:"Critique" };
const lib = (liste, k) => { const x = liste.find(e => String(e[0]) === String(k)); return x ? x[1] : ""; };
const niveau = sc => sc >= 12 ? "crit" : sc >= 8 ? "fort" : sc >= 4 ? "moyen" : "faible";
const scoreR = r => (r.proba||1) * (r.impact||1);
const M = () => DB.settings.modules;

const actif = p => ACTIFS.has(p.statut);
const tachesDe  = pid => V(DB.taches).filter(t => t.projet === pid);
const jalonsDe  = pid => V(DB.jalons).filter(j => j.projet === pid).sort((a,b) => cmp(a.date,b.date));
const risquesDe = pid => V(DB.risques).filter(r => r.projet === pid);
const journalDe = pid => V(DB.journal).filter(e => e.projet === pid).sort((a,b) => cmp(b.date,a.date) || (b.cree||0)-(a.cree||0));
const notesDe = pid => journalDe(pid).filter(e => e.type !== "auto");
/* Le journal se tient en partie tout seul : tâches terminées ou bloquées,
   jalons atteints ou déplacés, changements de météo, de statut ou de date
   de fin s'y inscrivent sans qu'on ait rien à écrire. */
function evenement(pid, texte, meteo){
  if(!DB.projets[pid]) return;
  const e = { id:uid(), projet:pid, type:"auto", date:todayISO(), texte, meteo:meteo || "", cree:Date.now() };
  DB.journal[e.id] = e;
}
const nomP = id => (DB.personnes[id] || {}).nom || "";
const nomProjet = id => (DB.projets[id] || {}).nom || "—";
const avT = t => t.statut === "fait" ? 100 : clamp(num(t.avance), 0, 100);
const restantT = t => t.statut === "fait" ? 0 : num(t.charge) * (1 - avT(t)/100);
const touche = pid => { const p = DB.projets[pid]; if(p) p.maj = Date.now(); };

/* L'analyse d'un projet : tout ce qu'on en déduit sans rien demander de plus.
   Mémorisée le temps d'un rendu, puisque chaque vue la consulte plusieurs fois. */
let _an = new Map();
const _pile = new Set();
function an(p){
  if(_an.has(p.id)) return _an.get(p.id);
  _pile.add(p.id);
  const auj = todayISO(), mo = M();
  const T = tachesDe(p.id), J = jalonsDe(p.id), R = risquesDe(p.id);
  const chargeT = T.reduce((s,t) => s + num(t.charge), 0);

  // Avancement : pondéré par la charge des tâches quand il y en a, sinon
  // saisi à la main sur le projet.
  let avance;
  if(T.length) avance = chargeT > 0 ? T.reduce((s,t) => s + num(t.charge) * avT(t), 0) / chargeT
                                    : T.reduce((s,t) => s + avT(t), 0) / T.length;
  else avance = num(p.avance);
  if(p.statut === "termine") avance = 100;
  avance = Math.round(clamp(avance, 0, 100));

  const act = actif(p);
  const duree = p.debut && p.fin ? Math.max(1, diffJ(p.debut, p.fin)) : 0;
  const tempsPct = duree ? clamp(Math.round(diffJ(p.debut, auj) / duree * 100), 0, 100) : null;
  const ecart = tempsPct == null ? null : avance - tempsPct;
  const joursRetard = act && p.fin && p.fin < auj && avance < 100 ? diffJ(p.fin, auj) : 0;
  const glissement = p.fin && p.finBase ? diffJ(p.finBase, p.fin) : 0;
  const tRetard = T.filter(t => t.statut !== "fait" && t.fin && t.fin < auj);
  const tBloq = T.filter(t => t.statut === "bloque");
  const jRetard = J.filter(j => !j.fait && j.date && j.date < auj);
  const jProch = J.filter(j => !j.fait && j.date && j.date >= auj);

  // Budget : la projection à terminaison suppose que le rythme de dépense
  // observé se maintient (coût consommé ÷ avancement). Sous 10 % d'avancement,
  // elle ne veut rien dire : on s'abstient.
  const budget = num(p.budget), conso = num(p.conso);
  const budgetPct = budget ? Math.round(conso / budget * 100) : null;
  const eac = !budget ? null : avance >= 100 ? conso : (conso && avance >= 10 ? Math.round(conso / (avance/100)) : null);
  const eacPct = eac != null && budget ? Math.round(eac / budget * 100) : null;

  const chargePrev = chargeT || num(p.charge);
  const chargeConso = T.length ? T.reduce((s,t) => s + num(t.conso), 0) : num(p.chargeConso);
  const chargePct = chargePrev ? Math.round(chargeConso / chargePrev * 100) : null;
  const chargeEac = chargePrev && chargeConso && avance >= 10 && avance < 100 ? chargeConso / (avance/100) : null;

  const rOuv = R.filter(r => r.statut !== "clos");
  const rMax = rOuv.reduce((m,r) => Math.max(m, scoreR(r)), 0);

  // Un projet en pause l'est par décision : on ne lui cherche pas de défaut.
  const suivi = act && p.statut !== "pause";
  const rs = [];
  if(suivi){
    if(joursRetard) rs.push({ n:"rouge", t:"Échéance dépassée de " + joursRetard + " j" });
    jRetard.forEach(j => rs.push({ n:j.cle ? "rouge" : "orange",
      t:(j.cle ? "Jalon clé" : "Jalon") + " « " + j.titre + " » en retard de " + diffJ(j.date, auj) + " j" }));
    if(mo.budget && budget){
      if(budgetPct > 100) rs.push({ n:"rouge", t:"Budget dépassé : " + budgetPct + " % consommé" });
      else if(eacPct > 115) rs.push({ n:"rouge", t:"Projection budget à " + eacPct + " % du prévu" });
      else if(eacPct > 100) rs.push({ n:"orange", t:"Projection budget à " + eacPct + " % du prévu" });
    }
    if(mo.risques){
      const nc = rOuv.filter(r => scoreR(r) >= 12).length, nf = rOuv.filter(r => scoreR(r) >= 8 && scoreR(r) < 12).length;
      if(nc) rs.push({ n:"rouge", t:nc + " risque" + pl(nc) + " critique" + pl(nc) + " ouvert" + pl(nc) });
      else if(nf) rs.push({ n:"orange", t:nf + " risque" + pl(nf) + " fort" + pl(nf) + " ouvert" + pl(nf) });
    }
    if(tBloq.length) rs.push({ n:"orange", t:tBloq.length + " tâche" + pl(tBloq.length) + " bloquée" + pl(tBloq.length) });
    if(mo.risques){
      const ra = rOuv.filter(r => r.echeance && r.echeance < auj).length;
      if(ra) rs.push({ n:"orange", t:ra + " action" + pl(ra) + " de risque en retard" });
    }
    if(mo.gonogo) J.forEach(j => {
      const n = (j.checklist || []).length;
      if(!j.fait && n && j.go !== "go" && diffJ(auj, j.date) <= 7 && checkOk(j) < n)
        rs.push({ n:"orange", t:"Go / No-Go « " + j.titre + " » : " + checkOk(j) + "/" + n + " points validés" });
      if(!j.fait && j.go === "nogo") rs.push({ n:"rouge", t:"Décision NO-GO pour « " + j.titre + " »" });
    });
    if(mo.dependances) (p.depend || []).forEach(id => {
      const d = DB.projets[id];
      if(!d || estArchive(d) || _pile.has(d.id)) return;
      const ad = an(d);
      if(ad.joursRetard || ad.glissement > 0 || ad.meteo === "rouge") rs.push({ n:"orange", t:"Dépend de « " + d.nom + " », qui dérape" });
    });
    if(tRetard.length) rs.push({ n:"orange", t:tRetard.length + " tâche" + pl(tRetard.length) + " en retard" });
    if(ecart != null && p.statut === "encours" && !joursRetard){
      if(ecart < -25) rs.push({ n:"rouge", t:"Avancement " + (-ecart) + " pts sous le temps écoulé" });
      else if(ecart < -10) rs.push({ n:"orange", t:"Avancement " + (-ecart) + " pts sous le temps écoulé" });
    }
    if(glissement > 0 && !joursRetard) rs.push({ n:"orange", t:"Fin repoussée de " + glissement + " j par rapport à l'initiale" });
    if(mo.charge && chargeEac && chargeEac > chargePrev * 1.15)
      rs.push({ n:"orange", t:"Charge projetée à " + jh(chargeEac) + "/h pour " + jh(chargePrev) + "/h prévus" });
  }
  rs.sort((a,b) => ORDRE_M[a.n] - ORDRE_M[b.n]);
  const meteoAuto = !suivi ? "gris" : rs.some(r => r.n === "rouge") ? "rouge" : rs.length ? "orange" : "vert";
  const manuel = act && p.meteo && p.meteo !== "auto";
  const meteo = manuel ? p.meteo : meteoAuto;
  const joursSansPoint = p.maj ? diffJ(isoDe(new Date(p.maj)), auj) : null;
  const obsolete = suivi && (joursSansPoint == null || joursSansPoint > (DB.settings.obsolete || 14));
  const r = { T, J, R, avance, tempsPct, ecart, joursRetard, glissement, tRetard, tBloq, jRetard, jProch,
    budget, conso, budgetPct, eac, eacPct, chargePrev, chargeConso, chargePct, chargeEac,
    rOuv, rMax, raisons:rs, meteoAuto, meteo, manuel, obsolete, joursSansPoint,
    enRetard: act && (joursRetard > 0 || jRetard.length > 0 || tRetard.length > 0) };
  _pile.delete(p.id);
  _an.set(p.id, r);
  return r;
}

/* Tendance : la météo d'aujourd'hui comparée à celle notée au journal il y a
   au moins deux semaines. Sans point assez ancien, on ne dit rien. */
function tendance(p){
  const a = an(p);
  if(a.meteo === "gris") return null;
  const lim = addJ(todayISO(), -14);
  const ref = journalDe(p.id).find(e => e.date <= lim && ORDRE_M[e.meteo] != null && e.meteo !== "gris");
  if(!ref) return null;
  const d = ORDRE_M[a.meteo] - ORDRE_M[ref.meteo];
  return d > 0 ? { s:"↗", t:"en amélioration", c:"c-ok" } : d < 0 ? { s:"↘", t:"en dégradation", c:"c-dang" } : { s:"→", t:"stable", c:"c-gris" };
}
const tendHTML = p => { const t = tendance(p); return t ? '<span class="tend ' + t.c + '" title="Par rapport à il y a deux semaines">' + t.s + ' ' + t.t + '</span>' : ""; };

/* Charge d'une personne sur une fenêtre à venir : le reste à faire de chaque
   tâche est étalé uniformément sur les jours qui lui restent, et on ne garde
   que la part qui tombe dans la fenêtre. Grossier, mais juste assez pour voir
   qui est sous l'eau. */
const FEN = 28;
function chargePersonne(pid, projetsOk){
  const auj = todayISO(), finF = addJ(auj, FEN - 1);
  let c = 0;
  V(DB.taches).forEach(t => {
    if(t.resp !== pid || t.statut === "fait") return;
    const p = DB.projets[t.projet];
    if(!p || !actif(p) || (projetsOk && !projetsOk.has(p.id))) return;
    const reste = restantT(t);
    if(!reste) return;
    const d = t.debut && t.debut > auj ? t.debut : auj;
    const f = t.fin && t.fin >= d ? t.fin : d;
    const tot = diffJ(d, f) + 1;
    const a = d, b = f < finF ? f : finF;
    if(b < a) return;
    c += reste * (diffJ(a, b) + 1) / tot;
  });
  const cap = num((DB.personnes[pid]||{}).dispo || 0) * FEN / 7;
  return { charge:c, capacite:cap, pct: cap ? Math.round(c / cap * 100) : null };
}

/* ---------- filtres communs au tableau de bord, aux projets, au planning
   et aux risques : on filtre une fois, partout ---------- */
const F_STATUTS = [["actifs","Actifs"],["encours","En cours"],["etude","À l'étude"],["termines","Terminés"],["tous","Tous statuts"]];
function filtreActif(){
  const f = DB.settings.f;
  return !!(f.service || f.chef || f.prio || f.meteo || f.statut !== "actifs");
}
function projetsFiltres(sansRecherche){
  const f = DB.settings.f, q = sansRecherche ? "" : norm(state.q);
  return V(DB.projets).filter(p => {
    if(f.service && p.service !== f.service) return false;
    if(f.chef && p.chef !== f.chef) return false;
    if(f.prio && String(p.prio) !== f.prio) return false;
    if(f.statut === "actifs" && !actif(p)) return false;
    if(f.statut === "encours" && p.statut !== "encours") return false;
    if(f.statut === "etude" && p.statut !== "idee") return false;
    if(f.statut === "termines" && p.statut !== "termine") return false;
    if(f.meteo && an(p).meteo !== f.meteo) return false;
    if(q && !norm([p.nom, p.code, p.service, nomP(p.chef), p.sponsor, p.description].join(" ")).includes(q)) return false;
    return true;
  });
}
const TRIS = [["meteo","Météo"],["prio","Priorité"],["fin","Échéance"],["avance","Avancement"],["nom","Nom"]];
function trierProjets(l, mode){
  const k = mode || DB.settings.tri;
  return l.slice().sort((a,b) => {
    if(k === "nom") return cmp(norm(a.nom), norm(b.nom));
    if(k === "fin") return cmp(a.fin || "9999", b.fin || "9999");
    if(k === "avance") return an(b).avance - an(a).avance;
    if(k === "prio") return (num(a.prio)||9) - (num(b.prio)||9) || ORDRE_M[an(a).meteo] - ORDRE_M[an(b).meteo];
    return ORDRE_M[an(a).meteo] - ORDRE_M[an(b).meteo] || (num(a.prio)||9) - (num(b.prio)||9) || cmp(a.fin||"", b.fin||"");
  });
}

   RENDU
   ============================================================ */
const TABS = [
  { id:"bord",     l:"Tableau",  i:"grille" },
  { id:"projets",  l:"Projets",  i:"dossier" },
  { id:"planning", l:"Planning", i:"gantt" },
  { id:"risques",  l:"Risques",  i:"bouclier" },
  { id:"equipe",   l:"Équipe",   i:"equipe" }
];
const state = { tab:"bord", sheet:null, modal:null, q:"", journal:false, neuf:false,
                gDecal:0, gOuverts:new Set(), rCell:null, rFermes:false, alertesTout:false, ptab:"synthese" };

function render(){
  const v = $("#view");
  const anc = document.querySelector(".sheet");
  const posSheet = anc ? anc.scrollTop : 0;
  const md = document.querySelector(".mdl"), posM = md ? md.scrollTop : 0, modalAvant = state.modal;
  const posPage = window.scrollY;
  const g = document.querySelector(".gantt");
  const gx = g ? g.scrollLeft : null;
  const h = v.offsetHeight;
  if(h) v.style.minHeight = h + "px";
  try{ dessiner(); }
  finally{ requestAnimationFrame(() => { v.style.minHeight = ""; }); }
  const neuf = document.querySelector(".sheet");
  if(neuf && posSheet) neuf.scrollTop = posSheet;
  const md2 = document.querySelector(".mdl");
  if(md2 && posM && state.modal === modalAvant) md2.scrollTop = posM;
  if(window.scrollY !== posPage) window.scrollTo(0, posPage);
  const g2 = document.querySelector(".gantt");
  if(g2){
    if(gx != null && !state.gRecentrer) g2.scrollLeft = gx;
    else{
      const now = g2.querySelector(".g-now");
      if(now) g2.scrollLeft = Math.max(0, now.offsetLeft - g2.clientWidth * .35);
    }
    state.gRecentrer = false;
  }
}

function dessiner(){
  _an = new Map();
  suivreMeteos();
  $("#tabs").innerHTML = TABS.map(t =>
    '<button class="tab ' + (state.tab === t.id ? "on" : "") + '" data-act="tab" data-id="' + t.id + '">' +
    svg(t.i, 20) + '<span>' + t.l + '</span></button>').join("");

  $("#brand").innerHTML = icoSVG(22) + '<span>Jalon</span>';
  const chip = $("#ver-chip");
  if(chip){ chip.textContent = "v" + VERSION; chip.classList.toggle("neuf", state.neuf); }

  const mq = masque();
  $("#top-slot").innerHTML =
    (M().budget ? '<button class="iconbtn' + (mq ? " on" : "") + '" data-act="basculer-masque" title="' +
      (mq ? "Réafficher les montants" : "Masquer les montants") + '" aria-label="' +
      (mq ? "Réafficher les montants" : "Masquer les montants") + '">' + svg(mq ? "oeilBarre" : "oeil", 17) + '</button>' : "") +
    '<button class="iconbtn' + (state.tab === "reglages" ? " on" : "") + '" data-act="tab" data-id="reglages" title="Réglages" aria-label="Réglages">' + svg("cog", 17) + '</button>' +
    '<button class="iconbtn pri" data-act="nouveau" title="' + esc(libNouveau()) + '" aria-label="' + esc(libNouveau()) + '">' + svg("plus", 18, 2) + '</button>';

  const ae = document.activeElement;
  const fid = ae && ae.id ? ae.id : null;
  let sel = null;
  try{ if(ae && ae.selectionStart != null) sel = [ae.selectionStart, ae.selectionEnd]; }catch(e){}

  const v = $("#view");
  if(state.tab === "bord")          v.innerHTML = vueBord();
  else if(state.tab === "projets")  v.innerHTML = vueProjets();
  else if(state.tab === "planning") v.innerHTML = vuePlanning();
  else if(state.tab === "risques")  v.innerHTML = vueRisques();
  else if(state.tab === "equipe")   v.innerHTML = vueEquipe();
  else                              v.innerHTML = vueReglages();

  const s = state.sheet;
  if(s && s.t === "projet" && !DB.projets[s.id]) state.sheet = null;
  if(s && s.t === "personne" && !DB.personnes[s.id]) state.sheet = null;
  // Un panneau ou une fenêtre déjà ouverts ne rejouent pas leur animation
  // d'entrée à chaque redessin : sans quoi chaque clic ressemble à un
  // rechargement de la page.
  const cle = state.sheet ? state.sheet.t + ":" + (state.sheet.id || "") : "";
  let hs = !state.sheet ? "" :
    state.sheet.t === "projet" ? vueFiche(DB.projets[state.sheet.id]) :
    state.sheet.t === "personne" ? vuePersonne(DB.personnes[state.sheet.id]) :
    state.sheet.t === "revue" ? vueRevue() : vueRapport();
  if(cle && cle === _cleSheet) hs = hs.replace('<div class="sheet', '<div class="sheet fixe');
  _cleSheet = cle;
  $("#sheet").innerHTML = hs;
  $("#modal").innerHTML = htmlModal();

  if(fid){
    const el = document.getElementById(fid);
    if(el && el !== document.activeElement){
      el.focus({ preventScroll:true });
      if(sel && el.setSelectionRange){ try{ el.setSelectionRange(sel[0], sel[1]); }catch(e){} }
    }
  }
  const couvert = !!($("#sheet").firstChild || $("#modal").firstChild);
  document.body.style.overflow = couvert ? "hidden" : "";
  if(state.modal && state.modal.focus){
    const el = document.getElementById(state.modal.focus);
    if(el && document.activeElement !== el){ el.focus(); state.modal.focus = null; }
  }
}
let _cleSheet = "", _modalPrec = null;
function htmlModal(){
  let h = state.modal ? vueModal(state.modal) : "";
  if(h && state.modal === _modalPrec) h = h.replace('<div class="mdl"', '<div class="mdl fixe"');
  _modalPrec = state.modal;
  return h;
}
/* Redessine la seule fenêtre ouverte, sans toucher à la page derrière : un
   choix dans une liste ou un interrupteur ne doit rien faire bouger d'autre.
   La position de défilement et le champ actif sont conservés. */
function majModal(){
  const anc = document.querySelector(".mdl"), pos = anc ? anc.scrollTop : 0;
  const ae = document.activeElement, fid = ae && ae.id && ae.closest && ae.closest("#modal") ? ae.id : null;
  $("#modal").innerHTML = htmlModal();
  const nv = document.querySelector(".mdl");
  if(nv) nv.scrollTop = pos;
  const m = state.modal;
  const cible = m && m.focus ? m.focus : fid;
  if(cible){ const el = document.getElementById(cible); if(el) el.focus({ preventScroll:true }); if(m) m.focus = null; }
  if(!state.modal && !$("#sheet").firstChild) document.body.style.overflow = "";
}
function libNouveau(){
  if(state.sheet && state.sheet.t === "projet") return "Nouvelle tâche";
  return state.tab === "equipe" ? "Nouvelle personne" : state.tab === "risques" ? "Nouveau risque" : "Nouveau projet";
}

/* ---------- briques communes ---------- */
function barreFiltres(){
  const f = DB.settings.f;
  const services = DB.settings.services.slice();
  V(DB.projets).forEach(p => { if(p.service && !services.includes(p.service)) services.push(p.service); });
  const chefs = [...new Set(V(DB.projets).map(p => p.chef).filter(Boolean))]
    .filter(id => DB.personnes[id]).sort((a,b) => cmp(norm(nomP(a)), norm(nomP(b))));
  const sel = (k, vide, opts) =>
    '<select class="' + (f[k] && !(k === "statut" && f[k] === "actifs") ? "on" : "") + '" data-filtre="' + k + '" aria-label="' + esc(vide) + '">' +
    (vide ? '<option value="">' + esc(vide) + '</option>' : "") +
    opts.map(([v,l]) => '<option value="' + esc(v) + '"' + (String(f[k]) === String(v) ? " selected" : "") + '>' + esc(l) + '</option>').join("") +
    '</select>';
  return '<div class="fbar noprint">' +
    sel("statut", "", F_STATUTS) +
    sel("service", "Tous services", services.map(s => [s,s])) +
    sel("chef", "Tous chefs de projet", chefs.map(id => [id, nomP(id)])) +
    sel("prio", "Toutes priorités", PRIOS) +
    sel("meteo", "Toutes météos", [["rouge","En difficulté"],["orange","À surveiller"],["vert","Sous contrôle"]]) +
    (filtreActif() ? '<button class="raz" data-act="filtres-raz">Réinitialiser</button>' : "") +
    '</div>';
}
function resumeFiltres(){
  const f = DB.settings.f, l = [];
  l.push(lib(F_STATUTS, f.statut) || "Actifs");
  if(f.service) l.push(f.service);
  if(f.chef) l.push(nomP(f.chef));
  if(f.prio) l.push("P" + f.prio);
  if(f.meteo) l.push(METEOS[f.meteo]);
  return l.join(" · ");

function barreAv(a, meteo){

/* ---------- matrice valeur / effort ----------
   La valeur se juge, elle se saisit à la main. L'effort, lui, se déduit en
   grande partie de ce qu'on sait déjà du projet : budget, charge, durée, et
   nombre de services à embarquer. On le propose, on laisse corriger. */
const SEUILS_EFFORT = { budget:[20000, 60000, 150000], charge:[20, 60, 150], mois:[3, 6, 12], services:[2, 3, 4] };
const NIV_EFFORT = ["", "faible", "moyen", "fort", "très fort"];
const palier = (v, s) => v <= 0 ? 0 : v < s[0] ? 1 : v < s[1] ? 2 : v < s[2] ? 3 : 4;
function effortCalc(o){
  const c = [];
  if(M().budget && o.budget > 0) c.push({ v:palier(o.budget, SEUILS_EFFORT.budget), t:"budget " + eurC(o.budget) });
  if(o.charge > 0) c.push({ v:palier(o.charge, SEUILS_EFFORT.charge), t:"charge " + jh(o.charge) + "/h" });
  if(o.debut && o.fin && o.fin > o.debut){
    const mois = diffJ(o.debut, o.fin) / 30.4;
    c.push({ v:palier(mois, SEUILS_EFFORT.mois), t:"durée " + Math.max(1, Math.round(mois)) + " mois" });
  }
  const serv = new Set([o.service].concat((o.equipe || []).map(id => (DB.personnes[id] || {}).service)).filter(Boolean));
  if(serv.size) c.push({ v:serv.size >= SEUILS_EFFORT.services[2] ? 4 : serv.size >= SEUILS_EFFORT.services[1] ? 3 : serv.size >= SEUILS_EFFORT.services[0] ? 2 : 1,
    t:serv.size + " service" + pl(serv.size) });
  if(!c.length) return null;
  return { v:clamp(Math.round(c.reduce((s,x) => s + x.v, 0) / c.length), 1, 4), crit:c };
}
function effortDe(p){
  if(num(p.effort)) return { v:num(p.effort), auto:false };
  const T = tachesDe(p.id);
  const r = effortCalc({ budget:num(p.budget), charge:T.length ? T.reduce((s,t) => s + num(t.charge), 0) : num(p.charge),
    debut:p.debut, fin:p.fin, service:p.service, equipe:p.equipe });
  return r ? { v:r.v, auto:true, crit:r.crit } : null;
}
const projetsVE = l => l.filter(p => num(p.valeur) && effortDe(p));
const QUADS = [
  ["qw", "Gains rapides",   v => v >= 3, e => e <= 2, "à lancer en priorité"],
  ["",   "Projets majeurs", v => v >= 3, e => e >= 3, "stratégiques, à suivre de près"],
  ["",   "Opportunités",    v => v <= 2, e => e <= 2, "si une équipe a du temps"],
  ["",   "À questionner",   v => v <= 2, e => e >= 3, "à reporter ou remettre en cause"]
];
const quadrantDe = p => { const v = num(p.valeur), e = (effortDe(p) || {}).v; return QUADS.find(q => q[2](v) && q[3](e)); };
function matriceVE(pv, cliquable){
  let auto = false;
  const chip = p => {
    const e = effortDe(p); if(e.auto) auto = true;
    return '<' + (cliquable ? 'button data-act="ouvrir-projet" data-id="' + p.id + '"' : 'span') + ' class="chip" title="' + esc(p.nom + " — valeur " + p.valeur + ", effort " + e.v + (e.auto ? " (estimé)" : "")) + '">' +
      '<span class="dot ' + an(p).meteo + '" style="width:7px;height:7px;margin-right:5px"></span>' + (e.auto ? "≈ " : "") + esc(p.nom) + '</' + (cliquable ? 'button' : 'span') + '>';
  };
  const h = '<div class="ve"><div class="ve-y">Valeur →</div>' +
    QUADS.map(([cls, titre, fv, fe]) => '<div class="ve-q ' + cls + '"><span class="h">' + titre + '</span>' +
      pv.filter(p => fv(num(p.valeur)) && fe(effortDe(p).v)).map(chip).join("") + '</div>').join("") +
    '<div></div><div class="ve-x">Effort →</div></div>';
  return h + (auto ? '<div class="aide" style="margin-top:2px">≈ effort estimé d\'après le budget, la charge, la durée et le nombre de services.</div>' : "");
}

/* ---------- ce qui me revient à moi ---------- */
function mesActions(pid){
  const auj = todayISO(), lim = addJ(auj, 14);
  const ok = t => DB.projets[t.projet] && actif(DB.projets[t.projet]);
  const T = V(DB.taches).filter(t => t.resp === pid && t.statut !== "fait" && ok(t) &&
    (t.statut === "bloque" || !t.fin || t.fin <= lim)).sort((a,b) => cmp(a.fin || "9999", b.fin || "9999"));
  const R = M().risques ? V(DB.risques).filter(r => r.resp === pid && r.statut !== "clos" && ok(r) && r.echeance && r.echeance <= lim)
    .sort((a,b) => cmp(a.echeance, b.echeance)) : [];

  const J = V(DB.jalons).filter(j => !j.fait && j.date && j.date <= lim && DB.projets[j.projet] && actif(DB.projets[j.projet]) &&
    DB.projets[j.projet].chef === pid).sort((a,b) => cmp(a.date, b.date));
  return { T, R, J };
}

/* ============================================================
   PLANNING — un Gantt sans fioritures
   ============================================================ */
const ZOOMS = [["3m","3 mois"],["6m","6 mois"],["12m","12 mois"],["tout","Tout"]];
function debutMois(iso){ const d = dateDe(iso); return isoDe(new Date(d.getFullYear(), d.getMonth(), 1, 12)); }
function finMois(iso){ const d = dateDe(iso); return isoDe(new Date(d.getFullYear(), d.getMonth()+1, 0, 12)); }
function fenetreBornes(a, b, largeur){
  const debut = debutMois(a), fin = finMois(b);
  const jours = diffJ(debut, fin) + 1;
  return { debut, fin, px: clamp(largeur / jours, .6, 12) };
}
function fenetre(projets){
  const z = DB.settings.gZoom, auj = todayISO();
  if(z === "tout"){
    let a = auj, b = addJ(auj, 60);
    projets.forEach(p => {
      if(p.debut && p.debut < a) a = p.debut;
      [p.fin, p.finBase].forEach(f => { if(f && f > b) b = f; });
    });
    return fenetreBornes(a, b, 1000);
  }
  const mois = { "3m":3, "6m":6, "12m":12 }[z] || 6;
  const px = { "3m":9, "6m":4.6, "12m":2.4 }[z] || 4.6;
  const pas = Math.max(1, Math.round(mois / 3));
  const d0 = dateDe(auj);
  const m0 = new Date(d0.getFullYear(), d0.getMonth() - 1 + state.gDecal * pas, 1, 12);
  return { debut:isoDe(m0), fin:isoDe(new Date(m0.getFullYear(), m0.getMonth() + mois + 1, 0, 12)), px };
}
function gantt(rows, w){
  const jours = diffJ(w.debut, w.fin) + 1, W = Math.round(jours * w.px);
  const X = iso => diffJ(w.debut, iso) * w.px;
  let mo = "", vl = "", d = dateDe(w.debut), first = true;
  while(isoDe(d) <= w.fin){
    const iso = isoDe(d), dim = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    const x = X(iso), wd = dim * w.px;
    const txt = wd < 24 ? MOIS[d.getMonth()].charAt(0) :
      MOIS[d.getMonth()] + ((d.getMonth() === 0 || first) && wd > 44 ? " " + String(d.getFullYear()).slice(2) : "");
    mo += '<div class="g-mo" style="left:' + x + 'px;width:' + wd + 'px">' + txt + '</div>';
    vl += '<div class="g-vl" style="left:' + x + 'px"></div>';
    d = new Date(d.getFullYear(), d.getMonth()+1, 1, 12); first = false;
  }
  const auj = todayISO();
  const now = auj >= w.debut && auj <= w.fin ? '<div class="g-now" style="left:' + (X(auj) + w.px/2) + 'px" title="Aujourd\'hui"></div>' : "";
  let h = '<div class="gantt"><div class="g-in" style="width:calc(var(--gl) + ' + W + 'px)">' +
    '<div class="g-grid" style="width:' + W + 'px;z-index:2">' + vl + now + '</div>' +
    '<div class="g-head"><div class="g-corner">' + esc(w.titre || "") + '</div><div class="g-months" style="width:' + W + 'px">' + mo + '</div></div>';
  const seg = (a, b) => {
    const x = a < w.debut ? w.debut : a, y = b > w.fin ? w.fin : b;
    if(!a || !b || y < x) return null;
    return { left:X(x), width:Math.max(3, (diffJ(x, y) + 1) * w.px) };
  };
  rows.forEach(r => {
    h += '<div class="g-row' + (r.sub ? " sub" : "") + '"><div class="g-lab">' +
      (r.chev != null ? '<button class="chev' + (r.chev ? " on" : "") + '" data-act="g-toggle" data-id="' + r.id + '" aria-label="Déplier">' + svg("chev", 14, 2) + '</button>' : "") +
      '<button class="gx" style="text-align:left" data-act="' + r.act + '" data-id="' + r.id + '"><span class="gt">' + esc(r.t) + '</span>' +
      (r.s ? '<span class="gs">' + esc(r.s) + '</span>' : "") + '</button></div>' +
      '<div class="g-tr" style="width:' + W + 'px">';
    if(r.base){ const s = seg(r.base.d, r.base.f); if(s) h += '<div class="g-base" style="left:' + s.left + 'px;width:' + s.width + 'px" title="Planning initial"></div>'; }
    if(r.d && r.f){
      const s = seg(r.d, r.f);
      if(s){
        const dur = (diffJ(r.d, r.f) + 1) * w.px;
        const fin = X(r.d) + dur * (r.pct || 0) / 100;
        const fw = clamp(fin - s.left, 0, s.width);
        h += '<div class="g-bar ' + (r.cls || "") + '" style="left:' + s.left + 'px;width:' + s.width + 'px" title="' +
          esc(r.t + " — " + frDate(r.d) + " → " + frDate(r.f) + " · " + (r.pct||0) + " %") + '"><i style="width:' + fw + 'px"></i></div>';
        if(r.pct != null && s.left + s.width + 44 < W) h += '<span class="g-pct" style="left:' + (s.left + s.width + 5) + 'px">' + r.pct + ' %</span>';
      }
    }
    (r.j || []).forEach(j => {
      if(!j.date || j.date < w.debut || j.date > w.fin) return;
      const cls = j.fait ? "fait" : j.date < auj ? "retard" : "";
      h += '<div class="g-j ' + cls + (j.cle ? " cle" : "") + '" style="left:' + (X(j.date) + w.px/2) + 'px" title="' +
        esc("◆ " + j.titre + " — " + frDate(j.date, true) + (j.fait ? " · atteint" : j.date < auj ? " · en retard" : "") + (j.cle ? " · jalon clé" : "")) + '"></div>';
    });
    h += '</div></div>';
  });
  return h + '</div></div>';
}
function legendeGantt(){
  return '<div class="g-leg">' +
    '<span><i class="d" style="background:var(--acc)"></i>jalon</span>' +
    '<span><i class="d" style="background:var(--acc);width:12px;height:12px"></i>jalon clé</span>' +
    '<span><i class="d" style="background:var(--ok)"></i>atteint</span>' +
    '<span><i class="d" style="background:var(--dang)"></i>en retard</span>' +
    '<span><i style="width:18px;height:3px;background:var(--gris2);border-radius:2px;display:inline-block"></i>date initiale</span>' +
    '<span><i style="width:2px;height:12px;background:var(--dang);display:inline-block"></i>aujourd\'hui</span>' +
    '<span><i style="width:18px;height:10px;border:1px solid var(--dang);border-radius:3px;display:inline-block;background:repeating-linear-gradient(45deg,var(--dangF) 0 3px,transparent 3px 6px)"></i>bloqué</span>' +
    '</div>';
}
function lignesTaches(p, T){

  return T.slice().sort((a,b) => cmp(a.debut || a.fin || "", b.debut || b.fin || "")).map(t => ({

function vuePlanning(){

  h += '<div class="g-nav"><div class="seg">' + ZOOMS.map(([k,l]) =>
      '<button class="' + (DB.settings.gZoom === k ? "on" : "") + '" data-act="g-zoom" data-id="' + k + '">' + l + '</button>').join("") + '</div>' +
    (DB.settings.gZoom !== "tout" ? '<div class="seg"><button data-act="g-decal" data-id="-1" aria-label="Période précédente">' + svg("fleche",15,2) + '</button>' +
      '<button data-act="g-decal" data-id="0">Aujourd\'hui</button>' +
      '<button data-act="g-decal" data-id="1" aria-label="Période suivante">' + svg("chev",15,2) + '</button></div>' : "") +
    '<span class="sp"></span><button class="btn pt" data-act="g-tout">' + (state.gOuverts.size ? "Tout replier" : "Tout déplier") + '</button></div>';
  if(!L.length) return h + vide("Rien à planifier", "Aucun projet ne correspond aux filtres.");
  const rows = [];
  L.forEach(p => {
    const a = an(p), ouvert = state.gOuverts.has(p.id);
    const alerte = a.tBloq.length ? " · ⚠ bloqué" : (M().risques && a.rMax >= 12) ? " · ⚠ risque" : "";
    rows.push({ t:p.nom, s:[nomP(p.chef) || p.service, a.avance + " %"].filter(Boolean).join(" · ") + alerte,
      act:"ouvrir-projet", id:p.id, chev:(a.T.length ? ouvert : null),

      base:(p.finBase && p.finBase !== p.fin ? { d:p.debut, f:p.finBase } : null), j:a.J });
    if(ouvert) lignesTaches(p, a.T).forEach(r => rows.push(r));
  });
  h += gantt(rows, w) + legendeGantt();
  h += '<div class="aide">La barre se remplit avec l\'avancement ; sa couleur est la météo du projet. Le trait gris en dessous marque la date de fin initiale quand elle a bougé. Touchez la flèche pour voir les tâches, le nom pour ouvrir le projet.</div>';
  return h;

function statsPersonne(pe){
  const auj = todayISO();

  const retard = T.filter(t => t.fin && t.fin < auj).length;
  const chef = V(DB.projets).filter(p => p.chef === pe.id && actif(p)).length;
  const projets = new Set(T.map(t => t.projet));
  V(DB.projets).forEach(p => { if(actif(p) && (p.equipe||[]).includes(pe.id)) projets.add(p.id); });
  return { T, retard, chef, projets:projets.size, c:chargePersonne(pe.id) };

function enregistrerRevue(){
  const s = state.sheet; capturerRevue();

  const m = s.m, a = an(p);
  p.meteo = m.meteo || "auto";
  if(!a.T.length) p.avance = clamp(num(m.avance), 0, 100);
  if(M().budget && m.conso !== "") p.conso = num(m.conso);
  if(m.fin && m.fin !== p.fin){
    if(p.fin) evenement(p.id, "Fin prévue déplacée du " + frDate(p.fin, true) + " au " + frDate(m.fin, true) + " (" + (diffJ(p.fin, m.fin) > 0 ? "+" : "") + diffJ(p.fin, m.fin) + " j)");

  }
  p.maj = Date.now();
  _an.delete(p.id);
  const txt = (m.texte || "").trim();
  if(txt){
    const e = { id:uid(), projet:p.id, type:"point", date:todayISO(), texte:txt, meteo:an(p).meteo, cree:Date.now() };

  sauver();
  suivantRevue();
}
function suivantRevue(){
  const s = state.sheet;
  if(s.i >= s.ids.length - 1){
    const n = s.faits;
    state.sheet = null; render();
    toast("Point hebdo terminé · " + n + " projet" + pl(n) + " mis à jour");
    return;

  s.i++; s.m = null; render();
  const sh = document.querySelector(".sheet"); if(sh) sh.scrollTop = 0;
}

function donneesRapport(){
  const L = projetsFiltres(true), act = trierProjets(L.filter(actif), "meteo"), auj = todayISO();
  const cnt = { vert:0, orange:0, rouge:0 };
  act.forEach(p => { const m = an(p).meteo; if(cnt[m] != null) cnt[m]++; });
  const jal = []; act.forEach(p => an(p).J.forEach(j => { if(!j.fait && diffJ(auj, j.date) <= 60) jal.push(j); }));
  jal.sort((a,b) => cmp(a.date, b.date));
  const risques = []; act.forEach(p => an(p).rOuv.forEach(r => { if(scoreR(r) >= 8) risques.push(r); }));
  risques.sort((a,b) => scoreR(b) - scoreR(a));

    chP:act.reduce((s,p) => s + an(p).chargePrev, 0), chC:act.reduce((s,p) => s + an(p).chargeConso, 0),
    retard:act.filter(p => an(p).enRetard).length };
}

/* ============================================================
   MÉTÉO SUIVIE DANS LE TEMPS
   À chaque rendu, on compare la météo de chaque projet à la dernière notée ;
   un changement s'inscrit au journal. C'est ce qui nourrit les tendances.
   ============================================================ */
function suivreMeteos(){
  let chg = false;
  V(DB.projets).forEach(p => {
    const m = an(p).meteo;
    if(!p.meteoNotee){ p.meteoNotee = m; chg = true; return; }
    if(p.meteoNotee === m) return;
    if(m !== "gris" && p.meteoNotee !== "gris"){
      const r = an(p).raisons[0], pire = ORDRE_M[m] < ORDRE_M[p.meteoNotee];
      evenement(p.id, "Météo : " + METEOS[p.meteoNotee].toLowerCase() + " → " + METEOS[m].toLowerCase() + (pire && r ? " — " + r.t : ""), m);
    }
    p.meteoNotee = m; chg = true;
  });
  if(chg) sauver(true);
}
function meteoAu(p, date){
  const e = journalDe(p.id).find(x => x.date <= date && x.meteo && x.meteo !== "gris" && ORDRE_M[x.meteo] != null);
  return e ? e.meteo : null;
}
const MAUVAIS = { rouge:2, orange:1, vert:0 };
function carteMeteo(act){
  const cnt = { vert:0, orange:0, rouge:0 };
  act.forEach(p => { const m = an(p).meteo; if(cnt[m] != null) cnt[m]++; });
  const n = cnt.vert + cnt.orange + cnt.rouge;
  if(!n) return "";
  const p1r = act.some(p => an(p).meteo === "rouge" && String(p.prio) === "1");
  const g = (p1r || cnt.rouge / n >= .25) ? "rouge" : (cnt.rouge || cnt.orange / n >= .4) ? "orange" : "vert";
  const titre = { rouge:"Portefeuille en difficulté", orange:"Portefeuille à surveiller", vert:"Portefeuille sous contrôle" }[g];
  const lim = addJ(todayISO(), -14);
  let b0 = 0, b1 = 0, k = 0;
  act.forEach(p => { const m0 = meteoAu(p, lim), m1 = an(p).meteo; if(m0 && MAUVAIS[m1] != null){ b0 += MAUVAIS[m0]; b1 += MAUVAIS[m1]; k++; } });
  const tend = k >= 2 ? (b1 < b0 ? '<span class="c-ok">↗ en amélioration</span>' : b1 > b0 ? '<span class="c-dang">↘ en dégradation</span>' : '<span>→ stable</span>') + " sur 2 semaines" : "";
  const f = DB.settings.f;
  const rouges = act.filter(p => an(p).meteo === "rouge");
  return '<div class="mg ' + g + '"><div class="mg-h"><span class="mg-ic"></span><div style="min-width:0"><div class="mg-t">' + titre + '</div>' +
    '<div class="mg-s">' + (tend || "Tendance disponible après deux semaines de suivi") + '</div></div></div>' +
    '<div class="mbar" style="margin-top:12px">' + ["rouge","orange","vert"].map(k2 => cnt[k2] ?
      '<i style="flex:' + cnt[k2] + ';background:var(--' + ({ rouge:"dang", orange:"att", vert:"ok" })[k2] + ')"></i>' : "").join("") + '</div>' +
    '<div class="mleg">' + ["rouge","orange","vert"].map(k2 =>
      '<button data-act="filtre-meteo" data-id="' + k2 + '" class="' + (f.meteo === k2 ? "on" : "") + '"><span class="dot ' + k2 + '"></span><b>' + cnt[k2] + '</b>' + METEOS[k2] + '</button>').join("") + '</div>' +
    (rouges.length ? '<div class="chipsw" style="margin-top:10px">' + rouges.map(p =>
      '<button class="chip" data-act="ouvrir-projet" data-id="' + p.id + '"><span class="dot rouge" style="width:7px;height:7px;margin-right:5px"></span>' + esc(p.nom) + '</button>').join("") + '</div>' : "") +
    '</div>';
}
function carteMesActions(){
  const moi = DB.settings.moi;
  if(!moi || !DB.personnes[moi])
    return V(DB.personnes).length ? '<div class="aide noprint" style="margin:10px 0 0">Indiquez qui vous êtes dans les <button class="lien" style="color:var(--acc);text-decoration:underline" data-act="tab" data-id="reglages">réglages</button> pour voir vos actions ici.</div>' : "";
  const { T, R, J } = mesActions(moi), auj = todayISO(), sem = addJ(auj, 7), dem = addJ(auj, 1);
  const retard = T.filter(t => t.statut !== "bloque" && t.fin && t.fin < auj).length + R.filter(r => r.echeance < auj).length + J.filter(j => j.date < auj).length;
  const semaine = T.filter(t => t.statut !== "bloque" && t.fin && t.fin >= auj && t.fin <= sem).length +
    R.filter(r => r.echeance >= auj && r.echeance <= sem).length + J.filter(j => j.date >= auj && j.date <= sem).length;
  const bloq = T.filter(t => t.statut === "bloque").length;
  const c = M().charge ? chargePersonne(moi) : null;
  const items = T.map(t => ({ k:t.statut === "bloque" ? 1 : t.fin && t.fin < auj ? 0 : 2, d:t.fin || "", h:ligneTache(t, true) }))
    .concat(R.map(r => ({ k:r.echeance < auj ? 0 : 2, d:r.echeance,
      h:'<button class="ln" data-act="modifier-risque" data-id="' + r.id + '"><span class="ln-ic ' + (r.echeance < auj ? "dang" : "att") + '">' + svg("bouclier", 15, 2) + '</span>' +
        '<span class="ln-mid"><span class="ln-t">' + esc(r.action || r.titre) + '</span><span class="ln-m">' + esc(nomProjet(r.projet) + " · risque « " + r.titre + " »") + '</span></span>' +
        '<span class="ln-r ' + (r.echeance < auj ? "c-dang" : "") + '">' + esc(relJ(r.echeance)) + '</span></button>' })))
    .concat(J.map(j => ({ k:j.date < auj ? 0 : 2, d:j.date, h:ligneJalon(j, true) })));
  const parJour = DB.settings.mesVue === "jour";
  let corps = "";
  if(!parJour){
    // Vue « urgence » : retards, puis blocages, puis le reste par échéance.
    items.sort((a,b) => a.k - b.k || cmp(a.d || "9999", b.d || "9999"));
    corps = (state.mesTout ? items : items.slice(0, 4)).map(x => x.h).join("");
  } else {
    // Vue « par jour » : les mêmes éléments rangés sous l'intitulé de leur jour.
    const JRS = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
    const cle = d => !d ? "9" : d < auj ? "0" : d;
    const lib2 = k => k === "0" ? ["En retard", "dang"] : k === "9" ? ["Sans échéance", ""] : k === auj ? ["Aujourd'hui", "acc"] :
      k === dem ? ["Demain", ""] : [JRS[dateDe(k).getDay()] + " " + frDate(k), ""];
    items.sort((a,b) => cmp(cle(a.d), cle(b.d)) || a.k - b.k);
    let n = 0, cour = null;
    for(const x of items){
      if(!state.mesTout && n >= 6) break;
      const k = cle(x.d);
      if(k !== cour){ const [l, cl] = lib2(k); corps += '<div class="jour-h ' + cl + '">' + esc(l) + '</div>'; cour = k; }
      corps += x.h; n++;
    }
  }
  const lim = parJour ? 6 : 4;
  return '<div class="pan moi"><div class="sect"><h2>Mes actions</h2><span class="sp"></span>' +
    '<div class="seg"><button class="' + (!parJour ? "on" : "") + '" style="padding:5px 9px;font-size:12px" data-act="mes-vue" data-id="urgence">Urgence</button>' +
    '<button class="' + (parJour ? "on" : "") + '" style="padding:5px 9px;font-size:12px" data-act="mes-vue" data-id="jour">Par jour</button></div></div>' +
    '<div class="kchips">' +
      '<span class="kchip' + (retard ? " dang" : "") + '"><b>' + retard + '</b> en retard</span>' +
      '<span class="kchip' + (semaine ? " att" : "") + '"><b>' + semaine + '</b> cette semaine</span>' +
      '<span class="kchip' + (bloq ? " dang" : "") + '"><b>' + bloq + '</b> bloquée' + pl(bloq) + '</span>' +
      (c && c.pct != null ? '<span class="kchip' + (c.pct > 100 ? " dang" : c.pct > 80 ? " att" : " ok") + '">charge <b>' + c.pct + ' %</b> sur 4 sem.</span>' : "") +
    '</div>' +
    (items.length ? corps : '<div class="vide petit">Rien d\'urgent pour vous dans les 14 jours.</div>') +
    (items.length > lim ? '<button class="plus-r" data-act="mes-tout">' + (state.mesTout ? "Réduire" : "Tout voir (" + items.length + ")") + '</button>' : "") +
    '</div>';

}

const CLS_RES = { atteint:"ok", partiel:"att", non:"dang", abandon:"" };
function statsCloture(p, date, conso){
  const a = an(p), ref = p.finBase || p.fin;
  return { finBase:ref || "", finPrevue:p.fin || "", finReelle:date,
    ecartJ: ref && date ? diffJ(ref, date) : null,
    budget:a.budget, conso, ecartBudgetPct: a.budget ? Math.round(conso / a.budget * 100) - 100 : null,
    chargePrev:a.chargePrev, chargeConso:a.chargeConso, avance:a.avance,
    taches:a.T.length, tachesFaites:a.T.filter(t => t.statut === "fait").length,

/* ============================================================
   AJOUT RAPIDE DE TÂCHES
   Une ligne par tâche : « Paramétrage @karim 15/10 5j ». Le @ désigne le
   responsable (début du prénom ou du nom), la date l'échéance, « 5j » la
   charge. Tout le reste est l'intitulé.
   ============================================================ */
function lireLigneRapide(l){
  let s = " " + String(l || "").replace(/^[\s\-•*]+/, "") + " ", resp = "", fin = "", charge = 0;
  s = s.replace(/\s@([^\s@]+)/, (x, n) => {
    const q = norm(n);
    const pe = V(DB.personnes).find(pe => norm(pe.nom).split(/\s+/).some(w => w.startsWith(q))) ||
               V(DB.personnes).find(pe => norm(pe.nom).replace(/\s+/g, "").startsWith(q));
    if(pe) resp = pe.id;
    return " ";
  });
  s = s.replace(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/, (x, d, mo, y) => {
    let yy = y ? (y.length === 2 ? 2000 + Number(y) : Number(y)) : new Date().getFullYear();
    let iso = yy + "-" + p2(mo) + "-" + p2(d);
    if(isNaN(dateDe(iso)) || Number(mo) > 12 || Number(d) > 31) return x;
    if(!y && iso < todayISO()) iso = (yy + 1) + "-" + p2(mo) + "-" + p2(d);
    fin = iso; return " ";
  });
  s = s.replace(/\s(\d+(?:[.,]\d+)?)\s?(?:j|jh|j\/h)(?=\s)/i, (x, n) => { charge = num(n); return " "; });
  return { titre:s.replace(/\s+/g, " ").trim(), resp, fin, charge };
}
function apercuRapide(m){
  const L = String(m.texte || "").split(/\n/).map(lireLigneRapide).filter(x => x.titre);
  if(!L.length) return '<div class="aide">Rien à ajouter pour l\'instant.</div>';
  const p = DB.projets[m.projet], j = DB.jalons[m.jalon];
  const defaut = j ? j.date : p && p.fin;
  return L.map(x => '<div class="ln" style="padding:7px 2px"><span class="ln-mid"><span class="ln-t" style="font-size:13.5px">' + esc(x.titre) + '</span>' +
    '<span class="ln-m">' + esc([nomP(x.resp) || "non attribuée", "échéance " + frDate(x.fin || defaut) + (x.fin ? "" : " (par défaut)"), x.charge ? jh(x.charge) + "/h" : ""].filter(Boolean).join(" · ")) + '</span></span></div>').join("") +
    '<div class="aide">' + L.length + ' tâche' + pl(L.length) + ' à créer.</div>';
}

      "<b>@nom</b> pour le responsable, <b>15/10</b> pour l'échéance, <b>3j</b> pour la charge. Vous pouvez coller une liste depuis un mail ou un compte rendu.", "m-texte") +
    (J.length ? fChamp("Rattacher au jalon", fSel("jalon", m.jalon, J.map(j => [j.id, j.titre + " · " + frDate(j.date)]), "Aucun"), "", "m-jalon") : "") +

/* ============================================================

const lignesDe = s => String(s || "").split(/\n/).map(x => x.replace(/^[\s\-•*]+/, "").trim()).filter(Boolean);

  ["perimetre", "Périmètre", "Ce qui est inclus : services, sites, processus, applications"],

  ["criteres", "Critères de succès", "Comment saura-t-on que c'est réussi ?"],

function rentabilite(p){
  const c = cadrageDe(p), gain = num(c.gain), cout = num(c.cout) || num(p.budget);
  return gain > 0 && cout > 0 ? { gain, cout, mois:Math.round(cout / gain * 12) } : null;
}

    '<div class="aide">' + n + ' rubrique' + pl(n) + ' sur ' + RUBRIQUES.length + ' renseignée' + pl(n) + '. Dix minutes au lancement ; à la clôture, le bilan reprend les objectifs un par un.</div>';
  RUBRIQUES.forEach(([k, l]) => {
    h += '<div class="sect"><h2>' + l + '</h2></div>';
    if(!rempliR(c, k)){ h += '<div class="desc" style="color:var(--gris2)">À compléter</div>'; return; }
    if(k === "objectifs") h += '<ul class="liste-c">' + c.objectifs.map(o => '<li>' + esc(o.t) +
      (o.res ? ' <span class="badge ' + (o.res === "oui" ? "ok" : o.res === "partiel" ? "att" : "dang") + '">' + esc(lib(RES_OBJ, o.res)) + '</span>' : "") + '</li>').join("") + '</ul>';
    else h += '<div class="desc" style="color:var(--texte)">' + esc(c[k]) + '</div>';
  });
  if(mo.budget){
    const r = rentabilite(p);
    h += '<div class="sect"><h2>Rentabilité</h2></div>' + (r ? '<div class="infos"><div><small>Gain annuel estimé</small><span>' + eur(r.gain) + '</span></div>' +
      '<div><small>Coût du projet</small><span>' + eur(r.cout) + '</span></div><div><small>Remboursé en</small><span>' +
      (masque() ? "••" : r.mois < 24 ? r.mois + " mois" : (Math.round(r.mois / 12 * 10) / 10).toLocaleString("fr-FR") + " ans") + '</span></div></div>'
      : '<div class="desc" style="color:var(--gris2)">Facultatif : indiquez un gain annuel estimé pour calculer en combien de temps le projet est remboursé.</div>');
  }
  if(mo.dependances) h += blocDependances(p);
  return h;
}
function vueCadrage(m){

function mCadrage(p){

function enregistrerCadrage(){

  p.cadrage = c; p.depend = (m.depend || []).filter(id => DB.projets[id]); touche(p.id);

function blocDependances(p){

    return '<button class="ln" data-act="ouvrir-projet" data-id="' + x.id + '"><span class="dot ' + a.meteo + '" style="margin-top:6px"></span>' +

function apercuActionsCR(m){

function enregistrerCR(envoyer){
  capturerModal();
  const m = state.modal, p = DB.projets[m.projet]; if(!p) return fermerModal();
  const date = m.date || todayISO(), gl = lib(TYPES_R, m.genre);
  let e = m.id ? DB.journal[m.id] : null;
  if(!e){
    const decs = lignesDe(m.decisions);
    const acts = String(m.actions || "").split(/\n/).map(lireLigneRapide).filter(x => x.titre);
    const ids = acts.map(x => {
      const id = uid(), fin = x.fin || addJ(date, 14);
      DB.taches[id] = { id, projet:p.id, titre:x.titre, resp:x.resp, jalon:"", debut:date < fin ? date : fin, fin, statut:"afaire", avance:0,
        charge:x.charge, conso:0, motif:"", note:gl + " du " + frDate(date, true), cree:Date.now(), faitLe:"" };
      return id;
    });
    decs.forEach(d => { const id = uid(); DB.journal[id] = { id, projet:p.id, type:"decision", date, texte:d, meteo:an(p).meteo, cree:Date.now() }; });
    e = { id:uid(), projet:p.id, type:"reunion", cree:Date.now(), decisions:decs, actions:ids, meteo:an(p).meteo };
    DB.journal[e.id] = e;
  }
  Object.assign(e, { genre:m.genre, date, participants:(m.participants || []).filter(id => DB.personnes[id]), points:String(m.points || "").trim() });
  e.texte = gl + " du " + frDate(date, true) + " : " + (e.decisions || []).length + " décision" + pl((e.decisions || []).length) + ", " +
    (e.actions || []).length + " action" + pl((e.actions || []).length);
  touche(p.id); sauver();
  if(envoyer){ state.modal = mMail("cr", { projet:p.id, reunion:e.id }); render(); return; }
  state.modal = null; render(); toast("Compte rendu enregistré");
}

/* ============================================================
   MAILS
   Le contenu part avec sa mise en forme (HTML dans le presse-papiers) : on
   le colle dans Outlook ou Gmail et les titres, les listes et les pastilles
   de couleur suivent. La version texte, avec des pastilles emoji, sert au
   partage sur téléphone et de secours quand le HTML est refusé.
   ============================================================ */
/* Dans ce qui part vers l'extérieur (mails, rapport, CSV), le tiret long
   devient un tiret simple : plus sobre, plus proche d'un mail écrit à la main. */
const tiret = x => String(x == null ? "" : x).replace(/—/g, "-");
const MODELES = { point:"Point d'avancement", odj:"Ordre du jour", cadrage:"Cadrage", cr:"Compte rendu", relance:"Relance", synthese:"Synthèse direction" };
const COUL = { vert:"#0B6B45", orange:"#B3701E", rouge:"#B32424", gris:"#888888", info:"#888888" };
const EMOJI = { vert:"🟢", orange:"🟠", rouge:"🔴", gris:"⚪", info:"⚪" };
const prenom = n => String(n || "").trim().split(/\s+/)[0] || "";
const emailDe = id => ((DB.personnes[id] || {}).email || "").trim();

function gensDuProjet(p){
  const s = new Set([p.chef].concat(p.equipe || []));
  tachesDe(p.id).forEach(t => { if(t.resp && t.statut !== "fait") s.add(t.resp); });
  risquesDe(p.id).forEach(r => { if(r.resp && r.statut !== "clos") s.add(r.resp); });
  return [...s].filter(id => id && DB.personnes[id]).sort((a,b) => cmp(norm(nomP(a)), norm(nomP(b))));
}
function candidatsMail(m){
  if(m.modele === "relance") return m.personne && DB.personnes[m.personne] ? [m.personne] : [];
  if(m.projet && DB.projets[m.projet]) return gensDuProjet(DB.projets[m.projet]);
  return V(DB.personnes).filter(pe => pe.email).sort((a,b) => cmp(norm(a.nom), norm(b.nom))).map(pe => pe.id);
}
function mMail(modele, ctx){
  const m = { type:"mail", projet:ctx.projet || "", personne:ctx.personne || "", reunion:ctx.reunion || "", periode:"14", risques:M().risques };
  changerModele(m, modele);
  return m;
}
function changerModele(m, modele){
  m.modele = modele;
  const moi = DB.settings.moi;
  m.dest = {};
  if(modele === "relance"){ if(m.personne) m.dest[m.personne] = "to"; }
  else if(m.projet && DB.projets[m.projet]){
    const pp = DB.projets[m.projet], raci = M().raci ? (pp.raci || {}) : {}, e = DB.journal[m.reunion];
    const presents = modele === "cr" && e ? new Set(e.participants || []) : null;
    gensDuProjet(pp).forEach(id => {
      if(id === moi || !emailDe(id)) return;
      m.dest[id] = presents ? (presents.has(id) ? "to" : "cc") : raci[id] === "I" ? "cc" : "to";
    });
  }
  m.autres = modele === "synthese" ? (DB.settings.mailDirection || "") : "";
  m.budget = modele === "synthese" && M().budget;
  const p = DB.projets[m.projet], pe = DB.personnes[m.personne], auj = frDate(todayISO(), true);
  const ref = p ? (p.code ? "[" + p.code + "] " : "") + p.nom : "";
  const eR = DB.journal[m.reunion];
  m.objet = modele === "cadrage" ? ref + " — note de cadrage" :
    modele === "cr" ? ref + " — compte rendu " + (eR ? lib(TYPES_R, eR.genre).replace("Point projet", "du point projet").replace(/^(COPIL|Atelier|Lancement)$/, "$1") + " du " + frDate(eR.date, true) : "de réunion") :
    modele === "point" ? ref + " — point d'avancement du " + auj :
    modele === "odj" ? ref + " — ordre du jour du point projet" :
    modele === "relance" ? "Vos actions projets — point du " + auj :
    "Point portefeuille projets" + (DB.settings.organisation ? " " + DB.settings.organisation : "") + " — " + auj;
  m.objet = tiret(m.objet);
  m.intro = modele === "cadrage" ? "Bonjour à tous,\n\nVoici la note de cadrage du projet « " + (p ? p.nom : "") + " ». Merci de me faire part de vos remarques." :
    modele === "cr" ? "Bonjour à tous,\n\nVoici le compte rendu de notre réunion" + (eR ? " du " + frDate(eR.date, true) : "") + " sur le projet « " + (p ? p.nom : "") + " »." :
    modele === "point" ? "Bonjour à tous,\n\nVoici le point d'avancement du projet « " + (p ? p.nom : "") + " »." :
    modele === "odj" ? "Bonjour à tous,\n\nVoici l'ordre du jour de notre prochain point sur le projet « " + (p ? p.nom : "") + " ». N'hésitez pas à me faire part des sujets à ajouter." :
    modele === "relance" ? "Bonjour " + prenom(pe && pe.nom) + ",\n\nVoici les actions projets qui vous sont confiées et qui arrivent à échéance. Pouvez-vous me faire un retour sur leur avancement et me signaler tout blocage ?" :
    "Bonjour,\n\nVoici la synthèse du portefeuille de projets au " + auj + ".";
}
function signature(){
  const s = (DB.settings.signature || "").trim();
  if(s) return s;
  const moi = DB.settings.moi && nomP(DB.settings.moi);
  return "Cordialement," + (moi ? "\n" + moi : "");
}

/* Le contenu, en briques neutres : titre, paragraphe, puce, couple
   libellé / valeur. Deux rendus en sortent : texte et HTML. */
function ligneEcheance(t, avecProjet){
  const auj = todayISO(), retard = t.fin && t.fin < auj;
  return { k:"li", c: retard ? "rouge" : "",
    t:(avecProjet ? nomProjet(t.projet) + " — " : "") + t.titre + " : " + (t.fin ? "échéance " + frDate(t.fin) : "sans échéance") +
      (retard ? ", dépassée de " + diffJ(t.fin, auj) + " j" : "") + (avecProjet ? "" : " (" + (nomP(t.resp) || "non attribuée") + ")") +
      (avT(t) && t.statut !== "fait" ? " · " + avT(t) + " %" : "") };
}
function blocSynthese(p, a, m){
  const n = [], tend = tendance(p);
  n.push({ k:"kv", l:"Météo", v:METEOS[a.meteo] + (tend ? " (" + tend.t + ")" : ""), c:a.meteo });
