const rubriquesDe = type => ((DB.settings.rubriquesReu || {})[type] || FORMATS_REU[type].rubriques).slice();
const reunionsTriees = () => V(DB.reunions).sort((a,b) => cmp(b.date || "", a.date || "") || (b.cree || 0) - (a.cree || 0));
const titreReu = r => (r.titre || FORMATS_REU[r.type || "autre"].nom) + " du " + frDate(r.date, true);
const RE_ACTION = /^\s*(?:→|->|=>|\[\s?\]|todo\s*:?)\s*/i;
function grandir(el){ el.style.height = "auto"; el.style.height = (el.scrollHeight + 2) + "px"; }
function lignesNote(t){ return String(t || "").split(/\n/).map(x => x.replace(/\s+$/, "")).filter(x => x.trim()); }

function creerReunion(type, o){
  const f = FORMATS_REU[type] || FORMATS_REU.autre;
  const part = type === "equipe" ? (DB.settings.equipeReu || []) : type === "n1" ? [DB.settings.n1] : [];
  const r = { id:uid(), type, titre:f.nom, date:todayISO(), parPersonne:f.parPersonne,
    participants:part.filter(id => id && DB.personnes[id]),
    rubriques:rubriquesDe(type).map(t => ({ id:uid(), t, notes:{} })), cree:Date.now(), maj:Date.now(), ...(o || {}) };
  DB.reunions[r.id] = r;
  state.sheet = { t:"reunion", id:r.id }; state.modal = null;
  sauver(); render();
  if(!o) setTimeout(() => { const t = document.querySelector("#sheet .note-r"); if(t) t.focus(); }, 60);
  return r;
}

/* Les actions naissent des notes. À chaque fin de saisie d'un bloc, on
   rapproche les lignes « → » de ce qui existe : on crée les nouvelles, on
   retire celles dont la ligne a disparu (sauf si elles sont faites ou ont
   été retouchées à la main). */
function actionsDeNotes(r){
  const out = [];
  (r.rubriques || []).forEach(rb => Object.keys(rb.notes || {}).forEach(k => {
    if(k !== "_" && !(r.participants || []).includes(k)) return;
    lignesNote(rb.notes[k]).forEach(l => {
      if(!RE_ACTION.test(l)) return;
      const x = lireLigneRapide(l.replace(RE_ACTION, ""));
      if(!x.titre) return;
      out.push({ cle:rb.id + "|" + k + "|" + norm(l.replace(RE_ACTION, "")), rub:rb.id, texte:x.titre, resp:x.resp || (k !== "_" ? k : ""), echeance:x.fin });
    });
  }));
  return out;
}
function syncActions(r){
  if(!r) return;
  const vus = new Set(), avant = V(DB.suivis).filter(a => a.reunion === r.id);
  actionsDeNotes(r).forEach(x => {
    if(vus.has(x.cle)) return; vus.add(x.cle);
    const a = avant.find(a => a.cle === x.cle);
    if(a){ if(!a.manuel) Object.assign(a, { texte:x.texte, resp:x.resp, echeance:x.echeance || a.echeance, rub:x.rub }); return; }
    const id = uid();
    DB.suivis[id] = { id, reunion:r.id, cle:x.cle, rub:x.rub, texte:x.texte, resp:x.resp, echeance:x.echeance || "", fait:false, faitLe:"", cree:Date.now() };
  });
  avant.forEach(a => { if(!vus.has(a.cle) && !a.fait && !a.manuel) delete DB.suivis[a.id]; });
  sauver();
}
const actionRetard = a => !a.fait && a.echeance && a.echeance < todayISO();
function origineAction(a, ici){
  const r = DB.reunions[a.reunion];
  if(!r) return "action libre";
  const rb = (r.rubriques || []).find(x => x.id === a.rub);
  return (ici && r.id === ici ? "ce point" : (FORMATS_REU[r.type] || FORMATS_REU.autre).court.replace("Équipe", "point d'équipe").replace("N+1", "point N+1").replace("Autre", "réunion") + " du " + frDate(r.date)) +
    (rb ? " · " + rb.t : "");
}
function ligneSuivi(a, o){
  o = o || {};
  const ret = actionRetard(a);
  return '<div class="ln tk' + (a.fait ? " fait" : "") + '">' +
    '<button class="st ' + (a.fait ? "fait" : "") + '" data-act="suivi-fait" data-id="' + a.id + '" aria-label="' + (a.fait ? "Rouvrir" : "Marquer comme fait") + '" title="' + (a.fait ? "Rouvrir" : "Fait") + '">' + (a.fait ? svg("check", 13, 3) : "") + '</button>' +
    '<button class="ln-mid" style="text-align:left" data-act="modifier-suivi" data-id="' + a.id + '">' +
      '<span class="ln-t">' + esc(a.texte) + '</span>' +
      '<span class="ln-m">' + esc([o.sansResp ? "" : nomP(a.resp) || "sans responsable", origineAction(a, o.ici), a.fait && a.faitLe ? "fait le " + frDate(a.faitLe) : a.echeance ? "échéance " + relJ(a.echeance) : ""].filter(Boolean).join(" · ")) + '</span>' +
      (liensSuivi(a).length ? '<span class="ln-n" style="color:var(--acc)">→ ' + esc(liensSuivi(a).join(" · ")) + '</span>' : "") +
    '</button>' +
    (ret ? '<span class="ln-r c-dang">retard ' + diffJ(a.echeance, todayISO()) + ' j</span>' : "") + '</div>';
}
/* Actions regroupées par personne, l'équipe d'abord. */
function groupesActions(L, ordre){
  const g = new Map();
  (ordre || []).forEach(id => g.set(id, []));
  L.forEach(a => { const k = DB.personnes[a.resp] ? a.resp : ""; if(!g.has(k)) g.set(k, []); g.get(k).push(a); });
  return [...g.entries()].filter(([, l]) => l.length).sort((x,y) => (x[0] === "") - (y[0] === "") || 0);
}
const triActions = (a,b) => (a.fait - b.fait) || (actionRetard(b) - actionRetard(a)) || cmp(a.echeance || "9999", b.echeance || "9999") || (a.cree || 0) - (b.cree || 0);

  if(!R.length && !S.length){
    return h + vide("Votre carnet de réunions", "Un point d'équipe se prend par rubrique (tickets, projets, global, commandes) et par personne. Écrivez « → relancer Meraki » dans le bloc de Fabrice : c'est une action pour Fabrice, suivie d'un point à l'autre jusqu'à ce que vous la cochiez.",

  const ceMois = R.filter(r => (r.date || "").slice(0, 7) === auj.slice(0, 7));
  h += '<div class="kpis">' +
    tuile({ l:"Actions à suivre", ic:"revue", v:String(ouv.length), s:ouv.filter(a => !a.resp).length + " sans responsable" }) +

/* ---------- vue 1:1 ----------
   Tout ce qui a été noté sur une personne, point après point : son bloc dans
   les points d'équipe, les lignes ailleurs qui la citent (prénom ou @), ses
   entretiens 1:1, ses actions et ses projets. De quoi préparer un entretien
   individuel ou un bilan annuel. */
function notesSur(pid){
  const pe = DB.personnes[pid]; if(!pe) return [];
  const pr = norm(prenom(pe.nom)), re = new RegExp("(^|[^a-z0-9])@?" + pr.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "([^a-z0-9]|$)");
  const out = [];
  reunionsTriees().forEach(r => {
    const L = [];
    (r.rubriques || []).forEach(rb => Object.keys(rb.notes || {}).forEach(k => {
      const lignes = lignesNote(rb.notes[k]);
      if(k === pid || (r.type === "unaun" && (r.participants || [])[0] === pid && k === "_")) lignes.forEach(l => L.push({ rb, l:l.trim(), m:false }));
      else if(pr.length >= 3) lignes.forEach(l => { if(re.test(norm(l))) L.push({ rb, l:l.trim(), m:true, de:k === "_" ? "" : nomP(k) }); });
    }));
    if(L.length) out.push({ r, L });
  });
  return out;
}

/* ---------- recherche dans toutes les notes ----------
   Sans accents ni majuscules : « meraki » trouve « Méraki ». Chaque ligne
   trouvée dit d'où elle vient (point, date, rubrique, personne). */
function surligner(txt, q){
  const nt = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const n = nt(txt), i = n.indexOf(q);
  if(i < 0 || n.length !== txt.length) return esc(txt);
  return esc(txt.slice(0, i)) + '<mark>' + esc(txt.slice(i, i + q.length)) + '</mark>' + esc(txt.slice(i + q.length));
}
function rechercheNotes(q){
  const nq = norm(q), out = [];
  reunionsTriees().forEach(r => (r.rubriques || []).forEach(rb => Object.keys(rb.notes || {}).forEach(k => {
    if(k !== "_" && !DB.personnes[k]) return;
    lignesNote(rb.notes[k]).forEach(l => { if(norm(l).includes(nq)) out.push({ r, rb, k, l:l.trim() }); });
  })));
  const A = V(DB.suivis).filter(a => norm(a.texte).includes(nq)).sort(triActions);
  return { lignes:out, actions:A };
}
function resultatsRecherche(q){
  const nq = norm(q), x = rechercheNotes(q);
  const pe = V(DB.personnes).find(p => norm(prenom(p.nom)) === nq || norm(p.nom) === nq);
  let h = (pe ? '<div class="rappel" style="background:var(--accF);color:var(--texte)">' + svg("perso", 18) + '<span style="flex:1">Tout ce qui concerne <b>' + esc(pe.nom) + '</b> est réuni dans sa vue 1:1.</span>' +
    '<button class="btn pt pri" data-act="ouvrir-unaun" data-id="' + pe.id + '">Vue 1:1</button></div>' : "");
  h += '<div class="pan"><div class="sect"><h2>Dans les notes</h2><span class="cnt">' + x.lignes.length + ' ligne' + pl(x.lignes.length) + '</span><span class="sp"></span>' +
    '<button class="lien" data-act="r-effacer-q">Effacer la recherche</button></div>';
  if(!x.lignes.length && !x.actions.length) return h + '<div class="vide petit">Rien trouvé pour « ' + esc(q) + ' ».</div></div>';
  let der = "";
  x.lignes.slice(0, 150).forEach(z => {
    if(z.r.id !== der){ der = z.r.id;
      h += '<button class="grp-a lien-r" data-act="ouvrir-reunion" data-id="' + z.r.id + '">' + svg(z.r.type === "n1" ? "perso" : z.r.type === "equipe" ? "equipe" : "bulle", 14) +
        '<b>' + esc(titreReu(z.r)) + '</b><span class="sp"></span><span class="cnt">ouvrir</span></button>'; }
    h += '<button class="ln" style="padding:7px 2px 7px 22px" data-act="ouvrir-reunion" data-id="' + z.r.id + '"><span class="ln-mid">' +
      '<span class="ln-t" style="white-space:normal">' + surligner(z.l, nq) + '</span>' +
      '<span class="ln-m">' + esc([z.rb.t, z.k === "_" ? "" : nomP(z.k)].filter(Boolean).join(" · ")) + '</span></span></button>';
  });
  h += '</div>';
  if(x.actions.length) h += '<div class="pan"><div class="sect"><h2>Dans les actions</h2><span class="cnt">' + x.actions.length + '</span></div>' + x.actions.map(a => ligneSuivi(a)).join("") + '</div>';
  return h;
}

/* Petits coups de main par rubrique : ce que Jalon sait déjà et qu'on peut
   verser dans les notes d'un geste. */
function sourceAstuce(r, rb, k){
  const t = norm(rb.t), auj = todayISO();
  if(/projet/.test(t)){
    const P = k !== "_" ? V(DB.projets).filter(p => actif(p) && (p.chef === k || (p.equipe || []).includes(k)))
                        : (r.parPersonne ? [] : V(DB.projets).filter(p => actif(p) && an(p).meteo !== "vert" && an(p).meteo !== "gris"));
    if(!P.length) return null;
    return { kind:"projets", items:trierProjets(P, "meteo").map(p => { const a = an(p);
      return { c:a.meteo, t:p.nom, l:p.nom + " : " + METEOS[a.meteo].toLowerCase() + ", " + a.avance + " %, fin " + frDate(p.fin) + (a.raisons[0] ? " (" + a.raisons[0].t + ")" : "") }; }) };
  }
  const itemsLic = () => V(DB.licences).map(l => ({ l, e:etatLic(l) })).filter(x => x.e.k === "expiree" || x.e.k === "bientot").sort((a,b) => cmp(a.l.fin, b.l.fin))
    .map(x => ({ c:x.e.c === "dang" ? "rouge" : "orange", t:"Licence " + x.l.logiciel, l:"Licence " + x.l.logiciel + " : " + x.e.l.toLowerCase() + " (" + frDate(x.l.fin, true) + ")" }));
  if(/commande|achat/.test(t) && k === "_"){
    const A = V(DB.achats).filter(a => !a.recu && !estPrevu(a)).sort((x,y) => cmp(x.date || "", y.date || ""));
    const items = A.map(a => { const e = etatDA(a); return { c:e.c === "dang" ? "rouge" : e.c === "acc" ? "orange" : "", t:a.objet,
      l:a.objet + (a.fournisseur ? " (" + a.fournisseur + ")" : "") + " : " + e.l.toLowerCase() + (factureAttendue(a) ? ", facture attendue" : "") }; })
      .concat(/licence/.test(t) ? itemsLic() : []);
    return items.length ? { kind:/licence/.test(t) ? "achatsLic" : "achats", items } : null;
  }
  if(/licence|budget/.test(t) && k === "_"){
    const items = itemsLic();
    return items.length ? { kind:"licences", items } : null;
  }
  if(/equipe|charge|rh/.test(t) && k === "_" && M().charge){
    const L = (DB.settings.equipeReu || []).filter(id => DB.personnes[id]).map(id => ({ id, c:chargePersonne(id) })).filter(x => x.c.pct != null);
    if(!L.length) return null;
    return { kind:"charge", items:L.map(x => ({ c:x.c.pct > 100 ? "rouge" : x.c.pct > 80 ? "orange" : "vert", t:prenom(nomP(x.id)) + " " + x.c.pct + " %",
      l:nomP(x.id) + " : charge projet " + x.c.pct + " % sur 4 semaines" })) };
  }
  return null;
}
function astuce(r, rb, k){

  return '<div class="astuce noprint"><span>' + lib0 + ' :</span>' + s.items.slice(0, 6).map(x =>

/* ---------- coller des notes (OneNote, Word, mail…) ----------
   Le format de vos points : des blocs séparés par une ligne de tirets, chacun
   ouvert par son titre de rubrique, puis le prénom de chaque personne suivi de
   ses points. Un prénom se reconnaît s'il est déjà dans l'équipe, ou s'il
   revient seul sur sa ligne dans plusieurs blocs. */
function lireNotesCollees(txt){
  const L = String(txt || "").replace(/\r/g, "").split("\n");
  const blocs = [[]];
  L.forEach(l => { if(/^\s*[-_=–—]{4,}\s*$/.test(l)) blocs.push([]); else blocs[blocs.length - 1].push(l.replace(/\s+$/, "")); });
  const B = blocs.map(b => b.filter(l => l.trim())).filter(b => b.length);
  const nomCandidat = l => { const s = l.trim(); return s.length <= 30 && /^[A-ZÀ-Ý][\p{L}'-]+(?: [A-ZÀ-Ý][\p{L}'-]+)?$/u.test(s); };
  const connu = s => V(DB.personnes).find(pe => norm(pe.nom) === norm(s) || norm(prenom(pe.nom)) === norm(s));
  const freq = {};
  B.forEach(b => new Set(b.slice(1).filter(nomCandidat).map(x => x.trim())).forEach(s => { freq[s] = (freq[s] || 0) + 1; }));
  const estNom = s => nomCandidat(s) && (connu(s.trim()) || (freq[s.trim()] || 0) >= 2);
  const noms = [], rubs = [];
  B.forEach(b => {
    let titre = b[0].trim().replace(/\s*:\s*$/, ""), lignes = b.slice(1);
    if(estNom(b[0])){ titre = "Notes"; lignes = b; }
    const rb = { t:titre, notes:{} }; let cur = "_";
    lignes.forEach(l => {
      if(estNom(l)){ cur = l.trim(); if(!noms.includes(cur)) noms.push(cur); rb.notes[cur] = rb.notes[cur] || ""; return; }
      rb.notes[cur] = (rb.notes[cur] ? rb.notes[cur] + "\n" : "") + l.trim();
    });
    rubs.push(rb);
  });
  return { rubs, noms:noms.map(n => ({ n, pe:connu(n) })) };
}
function apercuColler(m){
  const x = lireNotesCollees(m.texte);
  if(!x.rubs.length) return '<div class="aide">Collez vos notes : l\'aperçu de ce qui sera repris s\'affiche ici.</div>';
  const nv = x.noms.filter(n => !n.pe);
  return '<div class="lic-total" style="margin-top:0"><span class="d">' + x.rubs.length + ' rubrique' + pl(x.rubs.length) + ' : ' + esc(x.rubs.map(r => r.t).join(", ")) + '</span>' +

/* ============================================================

const PERIODES = [["an","par an"],["mois","par mois"],["unique","achat unique"]];
const FILTRES_DA = [["encours","En cours"],["alivrer","À livrer"],["arecep","À réceptionner"],["sansfact","Facture attendue"],["prevu","Budgétés"],["recu","Réceptionnés"],["tout","Tout"]];
const estPrevu = a => !!a.prevu && !a.livre && !a.recu;
/* Tags de couleur : le territoire (une teinte par territoire) et le service

const filtreServ = o => !state.aServ || (state.aServ === "_" ? !o.service : o.service === state.aServ);
const FILTRES_LIC = [["tout","Toutes"],["bientot","À renouveler"],["expiree","Expirées"],["active","Actives"]];
const addAns = (iso, n) => { const d = dateDe(iso); d.setFullYear(d.getFullYear() + n); return isoDe(d); };
const nomSite = id => (site(id) || {}).n || "";
function etatDA(a){
  const auj = todayISO();
  if(a.recu) return { k:"recu", l:"Réceptionné", c:"ok", ic:"carton" };
  if(a.prevu && !a.livre) return { k:"prevu", l:"Budgété, pas encore commandé", c:"", ic:"euro" };
  if(a.livre) return { k:"livre", l:"Livré, à réceptionner", c:"acc", ic:"camion" };
  if(a.livPrevue && a.livPrevue < auj) return { k:"retard", l:"Livraison en retard de " + diffJ(a.livPrevue, auj) + " j", c:"dang", ic:"alerte" };
  return { k:"commande", l:"Commandé", c:"", ic:"panier" };
}
function etatLic(l){
  if(!l.fin) return { k:"active", l:"Sans échéance", c:"", j:null };
  const j = diffJ(todayISO(), l.fin), al = num(l.alerte) || 60;
  if(j < 0) return { k:"expiree", l:"Expirée depuis " + (-j) + " j", c:"dang", j };
  if(j <= al) return { k:"bientot", l:j === 0 ? "Expire aujourd'hui" : "Expire dans " + j + " j", c:j <= 30 ? "dang" : "att", j };
  return { k:"active", l:"Active", c:"ok", j };
}
/* Coût d'une licence : le prix unitaire × le nombre de licences, plus autant
   de lignes que le devis en compte (maintenance, support, installation…),
   chacune avec sa périodicité. Les licences saisies avant la 1.8 n'avaient
   qu'un coût global : il tient lieu de ligne principale. */
const annualise = (m, p) => p === "mois" ? m * 12 : p === "unique" ? 0 : m;
const LIB_PER = { an:"/ an", mois:"/ mois", unique:"unique" };
function coutsLic(l){
  const q = num(l.quantite) || 1;
  const pu = l.prixU != null && l.prixU !== "" ? num(l.prixU) : null;
  const base = pu != null ? pu * q : num(l.cout);
  const per = l.periode || "an";
  const lignes = (l.lignes || []).filter(x => num(x.m)).map(x => ({ l:(x.l || "").trim() || "Autre coût", m:num(x.m), p:x.p || "an" }));
  const tout = [{ m:base, p:per }].concat(lignes);
  return { q, pu, base, per, lignes,
    parAn:tout.reduce((s,x) => s + annualise(x.m, x.p), 0),
    unique:tout.filter(x => x.p === "unique").reduce((s,x) => s + x.m, 0) };
}
const coutAnnuel = l => coutsLic(l).parAn;
function totalLicTexte(c){
  const t = [c.parAn ? eur(c.parAn) + " / an" : "", c.unique ? eur(c.unique) + (c.parAn ? " ponctuel" : "") : ""].filter(Boolean);
  return t.length ? t.join(" + ") : "—";
}
/* Détail lisible : « 4 × 360 € = 1 440 € / an · Maintenance 300 € / an ». */
function detailLic(c){
  const d = [];
  if(c.base) d.push((c.pu != null && c.q > 1 ? c.q + " × " + eur(c.pu) + " = " : "") + eur(c.base) + " " + LIB_PER[c.per]);
  c.lignes.forEach(x => d.push(x.l + " " + eur(x.m) + " " + LIB_PER[x.p]));
  return d.join(" · ");
}
const factureAttendue = a => (a.livre || a.recu) && !(a.numFacture || "").trim();
function achatsFiltres(){
  const q = norm(state.qa), s = state.aSite || "";
  return V(DB.achats).filter(a => (!s || a.site === s) && filtreServ(a) && (!q || norm([a.objet, a.numDA, a.numCmd, a.fournisseur, a.numFacture, a.note, a.service,
    nomSite(a.site), DB.projets[a.projet] ? DB.projets[a.projet].nom : ""].join(" ")).includes(q)));

function licencesFiltrees(){

    nomSite(l.site), nomP(l.resp)].join(" ")).includes(q)));

/* Années. Un achat compte l'année de sa commande. Une licence compte l'année
   où on la paie : au début de chaque période (chaque anniversaire pour une
   ligne « par an », chaque mois pour une ligne « par mois », une seule fois
   pour une ligne « unique »). Les renouvellements à venir sont supposés au
   même prix, sauf pour une licence déjà expirée. Les achats en cours, eux,
   restent visibles quelle que soit l'année. */
const anCourant = () => todayISO().slice(0, 4);
const anVu = () => state.aAn == null ? anCourant() : state.aAn;   // "" = toutes
const dansAn = (iso, an) => !an || (iso || "").slice(0, 4) === an;
const addMois = (iso, n) => { const d = dateDe(iso), j = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
  d.setDate(Math.min(j, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return isoDe(d); };
function anneesAchats(){
  const s = new Set([anCourant(), String(+anCourant() + 1)]);
  V(DB.achats).forEach(a => a.date && s.add(a.date.slice(0, 4)));
  V(DB.licences).forEach(l => [l.debut].concat((l.histo || []).map(x => x.debut)).forEach(d => d && s.add(d.slice(0, 4))));
  return [...s].filter(x => /^\d{4}$/.test(x)).sort().reverse();
}
/* Coût d'une période écoulée, gardé dans l'historique : le récurrent annualisé,
   plus le ponctuel s'il s'agit de la toute première période. */
const coutPeriode = (l, c) => c.parAn + ((l.histo || []).length ? 0 : c.unique);
function paiementsLic(l, an){
  const y0 = an + "-01-01", y1 = an + "-12-31", dans = d => d >= y0 && d <= y1, out = [], H = l.histo || [];
  H.forEach(x => { if(x.debut && dans(x.debut) && num(x.cout)) out.push({ d:x.debut, m:num(x.cout), prev:false }); });
  if(!l.debut) return out;
  const c = coutsLic(l), lignes = [{ m:c.base, p:c.per }].concat(c.lignes).filter(x => x.m);
  const exp = etatLic(l).k === "expiree";
  let deb = l.debut, fin = l.fin || "9999-12-31", premiere = !H.length;
  for(let i = 0; i < 40 && deb <= y1; i++){
    lignes.forEach(x => {
      if(x.p === "unique"){ if(premiere && dans(deb)) out.push({ d:deb, m:x.m, prev:i > 0 }); return; }
      // Une échéance annuelle qui tombe dans la dernière semaine de la période
      // (période d'un an et un jour) appartient à la période suivante.
      const pas = x.p === "mois" ? d => addMois(d, 1) : d => addAns(d, 1), lim = x.p === "mois" ? fin : addJ(fin, -7);
      for(let d = deb, k = 0; (d < lim || k === 0) && d < fin && d <= y1 && k < 600; d = pas(d), k++) if(dans(d)) out.push({ d, m:x.m, prev:i > 0 });
    });
    if(!l.fin || exp || l.arret) break;
    deb = debutSuivant(deb, fin); fin = addAns(fin, 1); premiere = false;
  }
  return out;
}
/* Début de la période suivante. Une licence du 01/01 au 31/12 repart le 01/01
   suivant, pas le 31/12 (sinon son renouvellement tomberait dans l'année
   qu'elle vient de payer). Une licence du 27/01 au 27/01 repart le 27/01. */
const debutSuivant = (debut, fin) => { const j = addJ(fin, 1); return debut && j.slice(5) === debut.slice(5) ? j : fin; };
function budgetLic(L, an){
  const auj = todayISO(); let paye = 0, avenir = 0; const parL = {};
  L.forEach(l => paiementsLic(l, an).forEach(p => { if(p.d <= auj) paye += p.m; else avenir += p.m; parL[l.id] = (parL[l.id] || 0) + p.m; }));
  return { paye, avenir, total:paye + avenir, parL };
}
/* Une licence en reconduction tacite ne doit pas tomber « expirée » : passé
   son échéance, elle repart pour un an, et la période écoulée rejoint son
   historique. */
function reconduireTacites(){
  const auj = todayISO(), noms = [];
  V(DB.licences).forEach(l => {
    if(!l.renouvAuto || l.arret || !l.fin || l.fin >= auj) return;
    for(let i = 0; i < 20 && l.fin < auj; i++){
      l.histo = (l.histo || []).concat([{ debut:l.debut || "", fin:l.fin, cout:coutPeriode(l, coutsLic(l)), le:l.fin, auto:true }]);
      l.debut = debutSuivant(l.debut, l.fin); l.fin = addAns(l.fin, 1);
    }
    l.maj = Date.now(); noms.push(l.logiciel);
  });
  if(noms.length){ sauver(); render();
    toast(noms.length === 1 ? "« " + noms[0] + " » reconduite tacitement pour un an" : noms.length + " licences reconduites tacitement pour un an"); }
}

/* Ce qui, côté achats et licences, mérite d'apparaître dans les points
   d'attention du tableau de bord. Suit le filtre de territoire. */
function alertesAchats(){
  const s = DB.settings.f.site || "", out = [];
  V(DB.achats).forEach(a => {
    if(s && a.site !== s) return;
    const e = etatDA(a), p = DB.projets[a.projet];
    const m = ["Achat", a.fournisseur, nomSite(a.site), p ? p.nom : ""].filter(Boolean).join(" · ");
    if(e.k === "retard") out.push({ n:"rouge", ic:"camion", act:"modifier-achat", id:a.id, m,
      t:"Livraison en retard de " + diffJ(a.livPrevue, todayISO()) + " j : " + a.objet });
    else if(e.k === "livre" && a.dateLivre && diffJ(a.dateLivre, todayISO()) > 7) out.push({ n:"info", ic:"carton", act:"modifier-achat", id:a.id, m,
      t:"Livré il y a " + diffJ(a.dateLivre, todayISO()) + " j, pas encore réceptionné : " + a.objet });
  });
  V(DB.licences).forEach(l => {

/* Import de licences par fusion : un fichier JSON avec une liste « licences »
   (objet ou tableau), qu'il vienne d'un export ERP préparé ou d'une autre
   sauvegarde Jalon. Rien n'est écrasé : une licence déjà présente (même
   logiciel et même fournisseur) est laissée telle quelle. Annulable. */
const cleLic = l => norm(l.logiciel) + "|" + norm(l.fournisseur);
function licenceImportee(x){
  const logiciel = String(x.logiciel || "").trim();
  if(!logiciel) return null;
  const txt = v => String(v == null ? "" : v).trim();
  const date = v => /^\d{4}-\d{2}-\d{2}$/.test(txt(v)) ? txt(v) : "";
  const per = p => PERIODES.some(([k]) => k === p) ? p : "an";
  const now = Date.now();
  const l = { id:uid(), cree:now, maj:now, logiciel, editeur:txt(x.editeur), fournisseur:txt(x.fournisseur),
    quantite:num(x.quantite) || 1, prixU:x.prixU != null && x.prixU !== "" ? num(x.prixU) : num(x.cout) / (num(x.quantite) || 1),
    lignes:(Array.isArray(x.lignes) ? x.lignes : []).filter(y => y && num(y.m)).map(y => ({ l:txt(y.l) || "Autre coût", m:num(y.m), p:per(y.p) })),
    periode:per(x.periode), debut:date(x.debut), fin:date(x.fin), alerte:num(x.alerte) || 60, renouvAuto:!!x.renouvAuto,
    numContrat:txt(x.numContrat), site:site(x.site) ? x.site : SITE_DEF, resp:DB.personnes[x.resp] ? x.resp : "", note:txt(x.note), histo:[] };
  if(l.debut && l.fin && l.fin < l.debut) l.fin = "";
  l.cout = coutsLic(l).base;
  return l;
}
function importerLicences(){
  const i = document.createElement("input");
  i.type = "file"; i.accept = "application/json,.json";
  i.onchange = async () => {
    const f = i.files && i.files[0]; if(!f) return;
    try{
      const x = JSON.parse(await f.text());
      const src = x && (Array.isArray(x) ? x : x.licences);
      if(!src || typeof src !== "object") throw new Error("aucune liste de licences dans ce fichier");
      const deja = new Set(V(DB.licences).map(cleLic)), vues = new Set();
      const nouv = []; let doublons = 0, vides = 0;
      V(src).forEach(y => {
        const l = licenceImportee(y || {});
        if(!l){ vides++; return; }
        const k = cleLic(l);
        if(deja.has(k) || vues.has(k)){ doublons++; return; }
        vues.add(k); nouv.push(l);
      });
      if(!nouv.length){ toast("Rien à ajouter : " + (doublons ? doublons + " licence" + pl(doublons) + " déjà présente" + pl(doublons) : "fichier vide")); return; }
      const an = nouv.reduce((s,l) => s + coutAnnuel(l), 0);
      ouvrirModal({ type:"confirmer", titre:"Ajouter " + nouv.length + " licence" + pl(nouv.length) + " ?", bouton:"Ajouter",
        texte:nouv.length + " licence" + pl(nouv.length) + " à ajouter, pour " + eur(an) + " par an." +
          (doublons ? " " + doublons + " déjà présente" + pl(doublons) + " (même logiciel et même fournisseur) " + (doublons > 1 ? "seront laissées" : "sera laissée") + " telle" + pl(doublons) + " quelle" + pl(doublons) + "." : "") +
          (vides ? " " + vides + " ligne" + pl(vides) + " sans nom de logiciel ignorée" + pl(vides) + "." : "") +
          " Vos autres données ne changent pas.",
        ok:() => {
          nouv.forEach(l => { DB.licences[l.id] = l; });
          corbeille = { _ajouts:{ licences:nouv.map(l => l.id) } };
          state.aVue = "lic"; sauver(); render();
          toast(nouv.length + " licence" + pl(nouv.length) + " ajoutée" + pl(nouv.length), "annuler");
        } });
    }catch(e){ toast("Fichier illisible : " + ((e && e.message) || e)); }
  };
  i.click();
}

function demarrerRevue(){
  const ids = trierProjets(projetsFiltres(true).filter(p => actif(p) && p.statut !== "pause"), "meteo").map(p => p.id);
  if(!ids.length){ toast("Aucun projet actif dans la sélection"); return; }
  state.sheet = { t:"revue", ids, i:0, m:null, faits:0 };
  render();
}
function capturerRevue(){
  const s = state.sheet;
  if(!s || s.t !== "revue" || !s.m) return;
  document.querySelectorAll("#sheet [data-rf]").forEach(el => { s.m[el.dataset.rf] = el.value; });
}

function enregistrerRevue(){
  const s = state.sheet; capturerRevue();
  const p = DB.projets[s.ids[s.i]]; if(!p) return;
  const m = s.m, a = an(p);
  p.meteo = m.meteo || "auto";
  if(!a.T.length) p.avance = clamp(num(m.avance), 0, 100);
  if(M().budget && m.conso !== "") p.conso = num(m.conso);
  if(m.fin && m.fin !== p.fin){
    if(p.fin) evenement(p.id, "Fin prévue déplacée du " + frDate(p.fin, true) + " au " + frDate(m.fin, true) + " (" + (diffJ(p.fin, m.fin) > 0 ? "+" : "") + diffJ(p.fin, m.fin) + " j)");
    if(!p.finBase) p.finBase = p.fin || m.fin; p.fin = m.fin;
  }
  p.maj = Date.now();
  _an.delete(p.id);
  const txt = (m.texte || "").trim();
  if(txt){
    const e = { id:uid(), projet:p.id, type:"point", date:todayISO(), texte:txt, meteo:an(p).meteo, cree:Date.now() };
    DB.journal[e.id] = e;
  }
  s.faits++;
  sauver();
  suivantRevue();
}
function suivantRevue(){
  const s = state.sheet;
  if(s.i >= s.ids.length - 1){
    const n = s.faits;
    state.sheet = null; render();
    toast("Point hebdo terminé · " + n + " projet" + pl(n) + " mis à jour");
    return;
  }
  s.i++; s.m = null; render();
  const sh = document.querySelector(".sheet"); if(sh) sh.scrollTop = 0;
}

/* ============================================================
   RAPPORT DIRECTION — une page, imprimable, reprenant les filtres
   ============================================================ */
function donneesRapport(){
  const L = projetsFiltres(true), act = trierProjets(L.filter(actif), "meteo"), auj = todayISO();
  const cnt = { vert:0, orange:0, rouge:0 };
  act.forEach(p => { const m = an(p).meteo; if(cnt[m] != null) cnt[m]++; });
  const jal = []; act.forEach(p => an(p).J.forEach(j => { if(!j.fait && diffJ(auj, j.date) <= 60) jal.push(j); }));
  jal.sort((a,b) => cmp(a.date, b.date));
  const risques = []; act.forEach(p => an(p).rOuv.forEach(r => { if(scoreR(r) >= 8) risques.push(r); }));
  risques.sort((a,b) => scoreR(b) - scoreR(a));
  const ids = new Set(act.map(p => p.id));
  const decisions = V(DB.journal).filter(e => ids.has(e.projet) && e.type === "decision" && diffJ(e.date, auj) <= 30)
    .sort((a,b) => cmp(b.date, a.date));
  const clos = V(DB.projets).filter(p => p.cloture && diffJ(p.cloture.date, auj) <= 90).sort((a,b) => cmp(b.cloture.date, a.cloture.date));
  return { L, act, cnt, jal, risques, decisions, clos, ve:projetsVE(act), al:alertes(L).filter(x => x.n !== "info"),
    bud:act.reduce((s,p) => s + an(p).budget, 0), cons:act.reduce((s,p) => s + an(p).conso, 0),
    eac:act.reduce((s,p) => { const a = an(p); return s + (a.eac != null ? a.eac : a.budget); }, 0),
    chP:act.reduce((s,p) => s + an(p).chargePrev, 0), chC:act.reduce((s,p) => s + an(p).chargeConso, 0),
    retard:act.filter(p => an(p).enRetard).length };
}

/* ============================================================
   MÉTÉO SUIVIE DANS LE TEMPS
   À chaque rendu, on compare la météo de chaque projet à la dernière notée ;
   un changement s'inscrit au journal. C'est ce qui nourrit les tendances.
   ============================================================ */
function suivreMeteos(){
  let chg = false;
  V(DB.projets).forEach(p => {
    const m = an(p).meteo;
    if(!p.meteoNotee){ p.meteoNotee = m; chg = true; return; }
    if(p.meteoNotee === m) return;
    if(m !== "gris" && p.meteoNotee !== "gris"){
      const r = an(p).raisons[0], pire = ORDRE_M[m] < ORDRE_M[p.meteoNotee];
      evenement(p.id, "Météo : " + METEOS[p.meteoNotee].toLowerCase() + " → " + METEOS[m].toLowerCase() + (pire && r ? " — " + r.t : ""), m);
    }
    p.meteoNotee = m; chg = true;
  });
  if(chg) sauver(true);
}
function meteoAu(p, date){
  const e = journalDe(p.id).find(x => x.date <= date && x.meteo && x.meteo !== "gris" && ORDRE_M[x.meteo] != null);
  return e ? e.meteo : null;
}
const MAUVAIS = { rouge:2, orange:1, vert:0 };
function carteMeteo(act){
  const cnt = { vert:0, orange:0, rouge:0 };
  act.forEach(p => { const m = an(p).meteo; if(cnt[m] != null) cnt[m]++; });
  const n = cnt.vert + cnt.orange + cnt.rouge;
  if(!n) return "";
  const p1r = act.some(p => an(p).meteo === "rouge" && String(p.prio) === "1");
  const g = (p1r || cnt.rouge / n >= .25) ? "rouge" : (cnt.rouge || cnt.orange / n >= .4) ? "orange" : "vert";
  const titre = { rouge:"Portefeuille en difficulté", orange:"Portefeuille à surveiller", vert:"Portefeuille sous contrôle" }[g];
  const lim = addJ(todayISO(), -14);
  let b0 = 0, b1 = 0, k = 0;
  act.forEach(p => { const m0 = meteoAu(p, lim), m1 = an(p).meteo; if(m0 && MAUVAIS[m1] != null){ b0 += MAUVAIS[m0]; b1 += MAUVAIS[m1]; k++; } });
  const tend = k >= 2 ? (b1 < b0 ? '<span class="c-ok">↗ en amélioration</span>' : b1 > b0 ? '<span class="c-dang">↘ en dégradation</span>' : '<span>→ stable</span>') + " sur 2 semaines" : "";
  const f = DB.settings.f;
  const rouges = act.filter(p => an(p).meteo === "rouge");
  return '<div class="mg ' + g + '"><div class="mg-h"><span class="mg-ic"></span><div style="min-width:0"><div class="mg-t">' + titre + '</div>' +
    '<div class="mg-s">' + (tend || "Tendance disponible après deux semaines de suivi") + '</div></div></div>' +
    '<div class="mbar" style="margin-top:12px">' + ["rouge","orange","vert"].map(k2 => cnt[k2] ?
      '<i style="flex:' + cnt[k2] + ';background:var(--' + ({ rouge:"dang", orange:"att", vert:"ok" })[k2] + ')"></i>' : "").join("") + '</div>' +
    '<div class="mleg">' + ["rouge","orange","vert"].map(k2 =>
      '<button data-act="filtre-meteo" data-id="' + k2 + '" class="' + (f.meteo === k2 ? "on" : "") + '"><span class="dot ' + k2 + '"></span><b>' + cnt[k2] + '</b>' + METEOS[k2] + '</button>').join("") + '</div>' +
    (rouges.length ? '<div class="chipsw" style="margin-top:10px">' + rouges.map(p =>
      '<button class="chip" data-act="ouvrir-projet" data-id="' + p.id + '"><span class="dot rouge" style="width:7px;height:7px;margin-right:5px"></span>' + esc(p.nom) + '</button>').join("") + '</div>' : "") +

}
function carteMesActions(){
  const moi = DB.settings.moi;
  if(!moi || !DB.personnes[moi])
    return V(DB.personnes).length ? '<div class="aide noprint" style="margin:10px 0 0">Indiquez qui vous êtes dans les <button class="lien" style="color:var(--acc);text-decoration:underline" data-act="tab" data-id="reglages">réglages</button> pour voir vos actions ici.</div>' : "";
  const { T, R, J } = mesActions(moi), auj = todayISO(), sem = addJ(auj, 7), dem = addJ(auj, 1);
  const retard = T.filter(t => t.statut !== "bloque" && t.fin && t.fin < auj).length + R.filter(r => r.echeance < auj).length + J.filter(j => j.date < auj).length;
  const semaine = T.filter(t => t.statut !== "bloque" && t.fin && t.fin >= auj && t.fin <= sem).length +
    R.filter(r => r.echeance >= auj && r.echeance <= sem).length + J.filter(j => j.date >= auj && j.date <= sem).length;
  const bloq = T.filter(t => t.statut === "bloque").length;
  const c = M().charge ? chargePersonne(moi) : null;
  const items = T.map(t => ({ k:t.statut === "bloque" ? 1 : t.fin && t.fin < auj ? 0 : 2, d:t.fin || "", h:ligneTache(t, true) }))
    .concat(R.map(r => ({ k:r.echeance < auj ? 0 : 2, d:r.echeance,
      h:'<button class="ln" data-act="modifier-risque" data-id="' + r.id + '"><span class="ln-ic ' + (r.echeance < auj ? "dang" : "att") + '">' + svg("bouclier", 15, 2) + '</span>' +
        '<span class="ln-mid"><span class="ln-t">' + esc(r.action || r.titre) + '</span><span class="ln-m">' + esc(nomProjet(r.projet) + " · risque « " + r.titre + " »") + '</span></span>' +
        '<span class="ln-r ' + (r.echeance < auj ? "c-dang" : "") + '">' + esc(relJ(r.echeance)) + '</span></button>' })))
    .concat(J.map(j => ({ k:j.date < auj ? 0 : 2, d:j.date, h:ligneJalon(j, true) })));
  const parJour = DB.settings.mesVue === "jour";
  let corps = "";
  if(!parJour){
    // Vue « urgence » : retards, puis blocages, puis le reste par échéance.
    items.sort((a,b) => a.k - b.k || cmp(a.d || "9999", b.d || "9999"));
    corps = (state.mesTout ? items : items.slice(0, 4)).map(x => x.h).join("");
  } else {
    // Vue « par jour » : les mêmes éléments rangés sous l'intitulé de leur jour.
    const JRS = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
    const cle = d => !d ? "9" : d < auj ? "0" : d;
    const lib2 = k => k === "0" ? ["En retard", "dang"] : k === "9" ? ["Sans échéance", ""] : k === auj ? ["Aujourd'hui", "acc"] :
      k === dem ? ["Demain", ""] : [JRS[dateDe(k).getDay()] + " " + frDate(k), ""];
    items.sort((a,b) => cmp(cle(a.d), cle(b.d)) || a.k - b.k);
    let n = 0, cour = null;
    for(const x of items){
      if(!state.mesTout && n >= 6) break;
      const k = cle(x.d);
      if(k !== cour){ const [l, cl] = lib2(k); corps += '<div class="jour-h ' + cl + '">' + esc(l) + '</div>'; cour = k; }
      corps += x.h; n++;
    }
  }
  const lim = parJour ? 6 : 4;
  return '<div class="pan moi"><div class="sect"><h2>Mes actions</h2><span class="sp"></span>' +
    '<div class="seg"><button class="' + (!parJour ? "on" : "") + '" style="padding:5px 9px;font-size:12px" data-act="mes-vue" data-id="urgence">Urgence</button>' +
    '<button class="' + (parJour ? "on" : "") + '" style="padding:5px 9px;font-size:12px" data-act="mes-vue" data-id="jour">Par jour</button></div></div>' +
    '<div class="kchips">' +
      '<span class="kchip' + (retard ? " dang" : "") + '"><b>' + retard + '</b> en retard</span>' +
      '<span class="kchip' + (semaine ? " att" : "") + '"><b>' + semaine + '</b> cette semaine</span>' +
      '<span class="kchip' + (bloq ? " dang" : "") + '"><b>' + bloq + '</b> bloquée' + pl(bloq) + '</span>' +
      (c && c.pct != null ? '<span class="kchip' + (c.pct > 100 ? " dang" : c.pct > 80 ? " att" : " ok") + '">charge <b>' + c.pct + ' %</b> sur 4 sem.</span>' : "") +
    '</div>' +
    (items.length ? corps : '<div class="vide petit">Rien d\'urgent pour vous dans les 14 jours.</div>') +
    (items.length > lim ? '<button class="plus-r" data-act="mes-tout">' + (state.mesTout ? "Réduire" : "Tout voir (" + items.length + ")") + '</button>' : "") +
    '</div>';

}

function appliquerModele(p, mid){
  const mo = modelesDispo().find(x => x.id === mid);
  if(!mo || !p.debut || !p.fin) return "";
  const dur = Math.max(1, diffJ(p.debut, p.fin)), at = pct => addJ(p.debut, Math.round(dur * pct / 100)), now = Date.now();
  const ids = mo.jalons.map(([titre, pct, cle]) => {
    const id = uid(), d = at(pct);
    DB.jalons[id] = { id, projet:p.id, titre, date:d, dateBase:d, cle:!!cle, fait:false, note:"", cree:now,
      checklist:M().gonogo && estMEP(titre) ? CHECK_DEFAUT.map(t => ({ t, ok:false })) : [] };
    return id;
  });
  mo.taches.forEach(([titre, a, b, ji, charge]) => {
    const id = uid();
    DB.taches[id] = { id, projet:p.id, titre, resp:"", debut:at(a), fin:at(b), statut:"afaire", avance:0, charge:charge || 0, conso:0,
      jalon:ids[ji] || "", motif:"", note:"", cree:now, faitLe:"" };

function enregistrerCommeModele(pid){
  const p = DB.projets[pid];

  const dur = Math.max(1, diffJ(p.debut, p.fin)), pc = d => clamp(Math.round(diffJ(p.debut, d || p.debut) / dur * 100), 0, 100);
  const J = jalonsDe(pid);
  const mo = { id:"p-" + uid(), perso:true, nom:p.nom,
    jalons:J.map(j => [j.titre, pc(j.dateBase || j.date), j.cle ? 1 : 0]),
    taches:tachesDe(pid).sort((a,b) => cmp(a.debut || "", b.debut || "")).map(t => [t.titre, pc(t.debut), pc(t.fin || t.debut), J.findIndex(j => j.id === t.jalon), num(t.charge)]) };
  DB.settings.modelesPerso = (DB.settings.modelesPerso || []).concat([mo]);
  sauver(); render();
  toast("Modèle « " + mo.nom + " » enregistré : " + mo.jalons.length + " jalons, " + mo.taches.length + " tâches");
}

/* ============================================================
   CLÔTURE ET ARCHIVES
   Clôturer fige un bilan chiffré (délai, budget, tâches, jalons) et une
   appréciation. Le projet quitte le tableau de bord mais reste consultable,
   avec tout son journal, dans les archives.
   ============================================================ */
const RESULTATS = [["atteint","Objectifs atteints"],["partiel","Partiellement"],["non","Non atteints"],["abandon","Abandonné"]];
const CLS_RES = { atteint:"ok", partiel:"att", non:"dang", abandon:"" };
function statsCloture(p, date, conso){
  const a = an(p), ref = p.finBase || p.fin;
  return { finBase:ref || "", finPrevue:p.fin || "", finReelle:date,
    ecartJ: ref && date ? diffJ(ref, date) : null,
    budget:a.budget, conso, ecartBudgetPct: a.budget ? Math.round(conso / a.budget * 100) - 100 : null,
    chargePrev:a.chargePrev, chargeConso:a.chargeConso, avance:a.avance,
    taches:a.T.length, tachesFaites:a.T.filter(t => t.statut === "fait").length,
    jalons:a.J.length, jalonsAtteints:a.J.filter(j => j.fait).length,
    jalonsATemps:a.J.filter(j => j.fait && j.atteintLe && j.atteintLe <= (j.dateBase || j.date)).length,
    risques:a.R.length };
}
function texteStats(st){
  const l = [];
  if(st.ecartJ != null) l.push(st.ecartJ > 0 ? "livré avec " + st.ecartJ + " j de retard" : st.ecartJ < 0 ? "livré avec " + (-st.ecartJ) + " j d'avance" : "livré à la date prévue");
  if(M().budget && st.budget) l.push("budget " + (masque() ? "••" : Math.round(st.conso / st.budget * 100)) + " %");
  if(st.taches) l.push(st.tachesFaites + "/" + st.taches + " tâches faites");
  if(st.jalons) l.push(st.jalonsAtteints + "/" + st.jalons + " jalons atteints");
  return l.join(" · ");
}
function mCloture(p){
  const c = p.cloture || {};
  return { type:"cloture", id:p.id, resultat:c.resultat || "atteint", date:c.date || todayISO(),
    conso:String(c.stats ? c.stats.conso : num(p.conso)), bilan:c.bilan || "", lecons:c.lecons || "" };
}
function vueCloture(m){
  const p = DB.projets[m.id]; if(!p) return "";
  const a = an(p), ouvertes = a.T.filter(t => t.statut !== "fait").length;
  const st = statsCloture(p, m.date, num(m.conso));
  return '<h3>' + (p.cloture ? "Bilan de clôture" : "Clôturer le projet") + '</h3><div class="sous">' + esc(p.nom) + ' — le projet quittera le tableau de bord et rejoindra les archives, avec tout son historique.</div>' +
    fChamp("Résultat", fSeg("resultat", m.resultat, RESULTATS)) +
    '<div class="duo">' + fChamp("Date de fin réelle", fTxt("date", m.date, "", "date"), "", "m-date") +
      (M().budget ? fChamp("Coût final (€)", fTxt("conso", m.conso, "0", "number"), "", "m-conso") : "") + '</div>' +
    '<div class="aide" style="margin:-4px 0 8px">' + esc(texteStats(st) || "Pas encore d'indicateur.") + '</div>' +
    (M().cadrage && (cadrageDe(p).objectifs || []).length ? '<div class="champ"><span class="lab">Objectifs du cadrage</span>' +
      cadrageDe(p).objectifs.map((o, i) => { const r = (m.objRes || [])[i] || o.res || "";
        return '<div class="obj-l"><span class="obj-t">' + esc(o.t) + '</span><div class="seg">' + RES_OBJ.map(([k, l]) =>
          '<button type="button" class="' + (r === k ? "on" : "") + '" style="padding:5px 8px;font-size:12px" data-act="m-obj" data-id="' + i + '" data-r="' + k + '">' + l + '</button>').join("") + '</div></div>'; }).join("") +
      '</div>' : "") +
    (ouvertes && !p.cloture ? '<div class="rappel" style="margin:0 0 8px"><span>' + svg("alerte",16) + '</span><span>' + ouvertes + ' tâche' + pl(ouvertes) + ' non terminée' + pl(ouvertes) + ' : elles resteront telles quelles dans l\'historique.</span></div>' : "") +
    fChamp("Ce qui a été livré", fArea("bilan", m.bilan, "Périmètre livré, bénéfices constatés, ce qui reste hors périmètre…", 3), "", "m-bilan") +
    fChamp("Retour d'expérience", fArea("lecons", m.lecons, "Ce qu'on referait, ce qu'on ne referait pas — utile au prochain projet du même type", 3), "", "m-lecons") +
    piedModal(p.cloture ? "Enregistrer le bilan" : "Clôturer et archiver", "enregistrer-cloture");
}
function enregistrerCloture(){
  capturerModal();
  const m = state.modal, p = DB.projets[m.id]; if(!p) return fermerModal();
  if(!m.date){ toast("Indiquez la date de fin réelle"); return; }
  const deja = !!p.cloture, conso = M().budget ? num(m.conso) : num(p.conso);
  const stats = deja && p.cloture.stats ? { ...p.cloture.stats, finReelle:m.date, conso,
      ecartJ:p.cloture.stats.finBase ? diffJ(p.cloture.stats.finBase, m.date) : null,
      ecartBudgetPct:p.cloture.stats.budget ? Math.round(conso / p.cloture.stats.budget * 100) - 100 : null }
    : statsCloture(p, m.date, conso);
  if(p.cadrage && (p.cadrage.objectifs || []).length) p.cadrage.objectifs.forEach((o, i) => { const r = (m.objRes || [])[i]; if(r) o.res = r; });
  p.cloture = { objectifs:p.cadrage ? copie(p.cadrage.objectifs || []) : [], date:m.date, resultat:m.resultat, bilan:(m.bilan||"").trim(), lecons:(m.lecons||"").trim(), stats };
  p.conso = conso;
  const avant = p.statut;

/* ============================================================
   AJOUT RAPIDE DE TÂCHES
   Une ligne par tâche : « Paramétrage @karim 15/10 5j ». Le @ désigne le
   responsable (début du prénom ou du nom), la date l'échéance, « 5j » la
   charge. Tout le reste est l'intitulé.
   ============================================================ */
function lireLigneRapide(l){
  let s = " " + String(l || "").replace(/^[\s\-•*]+/, "") + " ", resp = "", fin = "", charge = 0;
  s = s.replace(/\s@([^\s@]+)/, (x, n) => {
    const q = norm(n);
    const pe = V(DB.personnes).find(pe => norm(pe.nom).split(/\s+/).some(w => w.startsWith(q))) ||
               V(DB.personnes).find(pe => norm(pe.nom).replace(/\s+/g, "").startsWith(q));
    if(pe) resp = pe.id;
    return " ";
  });
  s = s.replace(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/, (x, d, mo, y) => {
    let yy = y ? (y.length === 2 ? 2000 + Number(y) : Number(y)) : new Date().getFullYear();
    let iso = yy + "-" + p2(mo) + "-" + p2(d);
    if(isNaN(dateDe(iso)) || Number(mo) > 12 || Number(d) > 31) return x;
    if(!y && iso < todayISO()) iso = (yy + 1) + "-" + p2(mo) + "-" + p2(d);
    fin = iso; return " ";
  });
  s = s.replace(/\s(\d+(?:[.,]\d+)?)\s?(?:j|jh|j\/h)(?=\s)/i, (x, n) => { charge = num(n); return " "; });
  return { titre:s.replace(/\s+/g, " ").trim(), resp, fin, charge };
}
function apercuRapide(m){
  const L = String(m.texte || "").split(/\n/).map(lireLigneRapide).filter(x => x.titre);
  if(!L.length) return '<div class="aide">Rien à ajouter pour l\'instant.</div>';
  const p = DB.projets[m.projet], j = DB.jalons[m.jalon];
  const defaut = j ? j.date : p && p.fin;
  return L.map(x => '<div class="ln" style="padding:7px 2px"><span class="ln-mid"><span class="ln-t" style="font-size:13.5px">' + esc(x.titre) + '</span>' +
    '<span class="ln-m">' + esc([nomP(x.resp) || "non attribuée", "échéance " + frDate(x.fin || defaut) + (x.fin ? "" : " (par défaut)"), x.charge ? jh(x.charge) + "/h" : ""].filter(Boolean).join(" · ")) + '</span></span></div>').join("") +
    '<div class="aide">' + L.length + ' tâche' + pl(L.length) + ' à créer.</div>';
}
function vueRapide(m){
  const J = jalonsDe(m.projet);
  return '<h3>Ajout rapide de tâches</h3><div class="sous">' + esc(nomProjet(m.projet)) + '</div>' +
    fChamp("Une tâche par ligne", fArea("texte", m.texte, "Audit de l'existant @karim 15/10 3j\nRédaction du cahier des charges @julie 30/10\nValidation par le comité", 6),
      "<b>@nom</b> pour le responsable, <b>15/10</b> pour l'échéance, <b>3j</b> pour la charge. Vous pouvez coller une liste depuis un mail ou un compte rendu.", "m-texte") +
    (J.length ? fChamp("Rattacher au jalon", fSel("jalon", m.jalon, J.map(j => [j.id, j.titre + " · " + frDate(j.date)]), "Aucun"), "", "m-jalon") : "") +
    '<div class="champ"><span class="lab">Aperçu</span><div id="apercu-rapide">' + apercuRapide(m) + '</div></div>' +
    piedModal("Créer les tâches", "enregistrer-rapide");
}
function enregistrerRapide(){
  capturerModal();
  const m = state.modal, p = DB.projets[m.projet]; if(!p) return fermerModal();
  const j = DB.jalons[m.jalon], auj = todayISO();
  const L = String(m.texte || "").split(/\n/).map(lireLigneRapide).filter(x => x.titre);
  if(!L.length){ toast("Aucune tâche à créer"); return; }
  const debut = p.debut && p.debut > auj ? p.debut : auj;
  L.forEach(x => {
    const id = uid(), fin = x.fin || (j ? j.date : p.fin) || "";
    DB.taches[id] = { id, projet:p.id, titre:x.titre, resp:x.resp, jalon:j ? j.id : "", debut:fin && fin < debut ? fin : debut, fin,
      statut:"afaire", avance:0, charge:x.charge, conso:0, motif:"", note:"", cree:Date.now(), faitLe:"" };
  });
  touche(p.id); state.modal = null; state.ptab = "taches"; sauver(); render();
  toast(L.length + " tâche" + pl(L.length) + " ajoutée" + pl(L.length));
}

/* ============================================================
   CADRAGE, RÔLES, RÉUNIONS, GO / NO-GO, KANBAN, DÉPENDANCES
   Six outils de méthode, chacun désactivable dans les réglages, tous
   branchés sur ce qui existe déjà : rien ne se saisit deux fois.
   ============================================================ */
const lignesDe = s => String(s || "").split(/\n/).map(x => x.replace(/^[\s\-•*]+/, "").trim()).filter(Boolean);

/* ---------- note de cadrage ---------- */
const RUBRIQUES = [
  ["objectifs", "Objectifs", "Un objectif par ligne, mesurable si possible : « Réduire de moitié les ressaisies de commandes »"],
  ["perimetre", "Périmètre", "Ce qui est inclus : services, sites, processus, applications"],
  ["exclu", "Hors périmètre", "Ce qu'on ne fera pas. C'est la rubrique qui évite le plus de malentendus."],
  ["livrables", "Livrables", "Ce qui sera remis concrètement"],
  ["criteres", "Critères de succès", "Comment saura-t-on que c'est réussi ?"],
  ["contraintes", "Contraintes et hypothèses", "Dates imposées, budget plafond, disponibilités, prérequis"]
];
const RES_OBJ = [["oui","Atteint"],["partiel","Partiel"],["non","Non atteint"]];
const cadrageDe = p => p.cadrage || {};
const rempliR = (c, k) => k === "objectifs" ? (c.objectifs || []).length > 0 : !!String(c[k] || "").trim();
const completude = p => RUBRIQUES.filter(([k]) => rempliR(cadrageDe(p), k)).length;
function rentabilite(p){
  const c = cadrageDe(p), gain = num(c.gain), cout = num(c.cout) || num(p.budget);
  return gain > 0 && cout > 0 ? { gain, cout, mois:Math.round(cout / gain * 12) } : null;
}
function ficheCadrage(p){
  const c = cadrageDe(p), n = completude(p), mo = M();
  let h = '<div class="btns"><button class="btn pri" data-act="modifier-cadrage" data-id="' + p.id + '">' + svg("crayon",15) + (n ? "Modifier le cadrage" : "Rédiger le cadrage") + '</button>' +
    '<button class="btn" data-act="mail-projet" data-id="' + p.id + '" data-m="cadrage">' + svg("mail",15) + 'Envoyer</button></div>' +
    '<div class="aide">' + n + ' rubrique' + pl(n) + ' sur ' + RUBRIQUES.length + ' renseignée' + pl(n) + '. Dix minutes au lancement ; à la clôture, le bilan reprend les objectifs un par un.</div>';
  RUBRIQUES.forEach(([k, l]) => {
    h += '<div class="sect"><h2>' + l + '</h2></div>';
    if(!rempliR(c, k)){ h += '<div class="desc" style="color:var(--gris2)">À compléter</div>'; return; }
    if(k === "objectifs") h += '<ul class="liste-c">' + c.objectifs.map(o => '<li>' + esc(o.t) +
      (o.res ? ' <span class="badge ' + (o.res === "oui" ? "ok" : o.res === "partiel" ? "att" : "dang") + '">' + esc(lib(RES_OBJ, o.res)) + '</span>' : "") + '</li>').join("") + '</ul>';
    else h += '<div class="desc" style="color:var(--texte)">' + esc(c[k]) + '</div>';
  });
  if(mo.budget){
    const r = rentabilite(p);
    h += '<div class="sect"><h2>Rentabilité</h2></div>' + (r ? '<div class="infos"><div><small>Gain annuel estimé</small><span>' + eur(r.gain) + '</span></div>' +
      '<div><small>Coût du projet</small><span>' + eur(r.cout) + '</span></div><div><small>Remboursé en</small><span>' +
      (masque() ? "••" : r.mois < 24 ? r.mois + " mois" : (Math.round(r.mois / 12 * 10) / 10).toLocaleString("fr-FR") + " ans") + '</span></div></div>'
      : '<div class="desc" style="color:var(--gris2)">Facultatif : indiquez un gain annuel estimé pour calculer en combien de temps le projet est remboursé.</div>');
  }
  if(mo.dependances) h += blocDependances(p);
  return h;
}
function vueCadrage(m){

    (mo.dependances && autres.length ? fChamp("Dépend de", '<div class="chipsw">' + autres.map(x =>

      "Les projets qui doivent avancer avant celui-ci. S'ils dérapent, ce projet est signalé.") : "") +
    piedModal("Enregistrer", "enregistrer-cadrage");
}
function mCadrage(p){
  const c = cadrageDe(p), m = { type:"cadrage", id:p.id, depend:(p.depend || []).slice(), gain:c.gain ? String(c.gain) : "", cout:c.cout ? String(c.cout) : "", focus:"m-objectifs" };
  RUBRIQUES.forEach(([k]) => { m[k] = k === "objectifs" ? (c.objectifs || []).map(o => o.t).join("\n") : (c[k] || ""); });
  return m;
}
function enregistrerCadrage(){
  capturerModal();
  const m = state.modal, p = DB.projets[m.id]; if(!p) return fermerModal();
  const anc = cadrageDe(p), avant = (anc.objectifs || []);
  const c = { gain:num(m.gain), cout:num(m.cout) };
  RUBRIQUES.forEach(([k]) => {
    if(k === "objectifs") c.objectifs = lignesDe(m.objectifs).map(t => ({ t, res:(avant.find(o => o.t === t) || {}).res || "" }));
    else c[k] = String(m[k] || "").trim();
  });
  const neuf = !completude(p);
  p.cadrage = c; p.depend = (m.depend || []).filter(id => DB.projets[id]); touche(p.id);
  if(neuf) evenement(p.id, "Note de cadrage rédigée");
  state.modal = null; sauver(); render(); toast("Cadrage enregistré");

function blocDependances(p){
  const dep = (p.depend || []).map(id => DB.projets[id]).filter(Boolean);

  return '<div class="sect"><h2>Dépendances</h2></div>' + dep.map(x => ligne(x, "doit avancer avant")).join("") + inv.map(x => ligne(x, "attend ce projet")).join("");

      : '<div class="btns grow" style="margin:18px 0 0"><button class="btn" data-act="fermer-modal">Annuler</button><button class="btn" data-act="enregistrer-cr">Enregistrer</button>' +
        '<button class="btn pri" data-act="enregistrer-cr" data-id="mail">' + svg("mail",15) + 'Enregistrer et envoyer</button></div>');
}
function apercuActionsCR(m){
  const L = String(m.actions || "").split(/\n/).map(lireLigneRapide).filter(x => x.titre);
  if(!L.length) return "";
  const def = addJ(m.date || todayISO(), 14);
  return '<div class="aide" style="margin-top:-4px">' + L.length + ' tâche' + pl(L.length) + ' à créer : ' +
    esc(L.map(x => x.titre + " (" + (nomP(x.resp) || "non attribuée") + ", " + frDate(x.fin || def) + ")").join(" ; ")) + '</div>';
}
function enregistrerCR(envoyer){
  capturerModal();
  const m = state.modal, p = DB.projets[m.projet]; if(!p) return fermerModal();
  const date = m.date || todayISO(), gl = lib(TYPES_R, m.genre);
  let e = m.id ? DB.journal[m.id] : null;
  if(!e){
    const decs = lignesDe(m.decisions);
    const acts = String(m.actions || "").split(/\n/).map(lireLigneRapide).filter(x => x.titre);
    const ids = acts.map(x => {
      const id = uid(), fin = x.fin || addJ(date, 14);
      DB.taches[id] = { id, projet:p.id, titre:x.titre, resp:x.resp, jalon:"", debut:date < fin ? date : fin, fin, statut:"afaire", avance:0,
        charge:x.charge, conso:0, motif:"", note:gl + " du " + frDate(date, true), cree:Date.now(), faitLe:"" };
      return id;
    });
    decs.forEach(d => { const id = uid(); DB.journal[id] = { id, projet:p.id, type:"decision", date, texte:d, meteo:an(p).meteo, cree:Date.now() }; });
    e = { id:uid(), projet:p.id, type:"reunion", cree:Date.now(), decisions:decs, actions:ids, meteo:an(p).meteo };
    DB.journal[e.id] = e;
  }
  Object.assign(e, { genre:m.genre, date, participants:(m.participants || []).filter(id => DB.personnes[id]), points:String(m.points || "").trim() });
  e.texte = gl + " du " + frDate(date, true) + " : " + (e.decisions || []).length + " décision" + pl((e.decisions || []).length) + ", " +
    (e.actions || []).length + " action" + pl((e.actions || []).length);
  touche(p.id); sauver();
  if(envoyer){ state.modal = mMail("cr", { projet:p.id, reunion:e.id }); render(); return; }
  state.modal = null; render(); toast("Compte rendu enregistré");
}

const checkOk = j => (j.checklist || []).filter(c => c.ok).length;

/* ---------- tableau Kanban ---------- */
function ficheKanban(p, a){
  const auj = todayISO();
  const cols = STATUTS_T.map(([k, l]) => {
    let T = a.T.filter(t => t.statut === k).sort((x,y) => cmp(x.fin || "9999", y.fin || "9999"));
    const tot = T.length;
    if(k === "fait") T = T.sort((x,y) => cmp(y.faitLe || "", x.faitLe || "")).slice(0, 12);
    return '<div class="kb-col" data-col="' + k + '"><div class="kb-h"><span class="st ' + k + '" style="width:16px;height:16px;flex-basis:16px;border-width:2px"></span>' + l + '<span class="cnt">' + tot + '</span></div>' +
      T.map(t => {
        const retard = t.statut !== "fait" && t.fin && t.fin < auj, j = DB.jalons[t.jalon];
        return '<div class="kb-card' + (retard ? " retard" : "") + '" draggable="true" data-tache="' + t.id + '">' +
          '<button class="st ' + t.statut + '" data-act="cycle-tache" data-id="' + t.id + '" aria-label="Avancer">' + (t.statut === "fait" ? svg("check", 12, 3) : t.statut === "bloque" ? '<b style="font-size:12px">!</b>' : "") + '</button>' +
          '<button class="kb-x" data-act="modifier-tache" data-id="' + t.id + '"><span class="kb-t">' + esc(t.titre) + '</span>' +
          '<span class="kb-m">' + esc([nomP(t.resp) || "non attribuée", t.fin ? relJ(t.fin) : ""].filter(Boolean).join(" · ")) + '</span>' +
          (j ? '<span class="kb-m">◆ ' + esc(j.titre) + '</span>' : "") +
          (t.statut === "bloque" && t.motif ? '<span class="kb-m c-dang">' + esc(t.motif) + '</span>' : "") + '</button></div>';
      }).join("") + (k === "fait" && tot > 12 ? '<div class="aide">… et ' + (tot - 12) + ' autres</div>' : "") + '</div>';
  }).join("");
  return '<div class="kb">' + cols + '</div><div class="aide">Faites glisser une carte d\'une colonne à l\'autre, ou touchez son rond pour la faire avancer.</div>';
}

/* ============================================================
   MAILS
   Le contenu part avec sa mise en forme (HTML dans le presse-papiers) : on
   le colle dans Outlook ou Gmail et les titres, les listes et les pastilles
   de couleur suivent. La version texte, avec des pastilles emoji, sert au
   partage sur téléphone et de secours quand le HTML est refusé.
   ============================================================ */
/* Dans ce qui part vers l'extérieur (mails, rapport, CSV), le tiret long
   devient un tiret simple : plus sobre, plus proche d'un mail écrit à la main. */
const tiret = x => String(x == null ? "" : x).replace(/—/g, "-");
const MODELES = { point:"Point d'avancement", odj:"Ordre du jour", cadrage:"Cadrage", cr:"Compte rendu", relance:"Relance", synthese:"Synthèse direction",
  "reu-cr":"Compte rendu", "reu-odj":"Ordre du jour", "reu-actions":"Relance des actions" };
const estReu = m => /^reu-/.test(m.modele || "");
const COUL = { vert:"#0B6B45", orange:"#B3701E", rouge:"#B32424", gris:"#888888", info:"#888888" };
const EMOJI = { vert:"🟢", orange:"🟠", rouge:"🔴", gris:"⚪", info:"⚪" };
const prenom = n => String(n || "").trim().split(/\s+/)[0] || "";
const emailDe = id => ((DB.personnes[id] || {}).email || "").trim();

function gensDuProjet(p){
  const s = new Set([p.chef].concat(p.equipe || []));
  tachesDe(p.id).forEach(t => { if(t.resp && t.statut !== "fait") s.add(t.resp); });
  risquesDe(p.id).forEach(r => { if(r.resp && r.statut !== "clos") s.add(r.resp); });
  return [...s].filter(id => id && DB.personnes[id]).sort((a,b) => cmp(norm(nomP(a)), norm(nomP(b))));
}
function candidatsMail(m){
  if(m.modele === "relance" || m.modele === "reu-actions") return m.personne && DB.personnes[m.personne] ? [m.personne] : [];
  if(m.reu && DB.reunions[m.reu]){
    const r = DB.reunions[m.reu], s = new Set((r.participants || []).concat(r.type === "n1" && DB.settings.n1 ? [DB.settings.n1] : [], r.type === "equipe" ? DB.settings.equipeReu || [] : []));
    return [...s].filter(id => DB.personnes[id] && id !== DB.settings.moi);
  }
  if(m.projet && DB.projets[m.projet]) return gensDuProjet(DB.projets[m.projet]);
  return V(DB.personnes).filter(pe => pe.email).sort((a,b) => cmp(norm(a.nom), norm(b.nom))).map(pe => pe.id);
}
function mMail(modele, ctx){
  const m = { type:"mail", projet:ctx.projet || "", personne:ctx.personne || "", reunion:ctx.reunion || "", reu:ctx.reu || "", periode:"14", risques:M().risques };
  changerModele(m, modele);
  return m;
}
function changerModele(m, modele){
  m.modele = modele;
  const moi = DB.settings.moi;
  m.dest = {};
  if(estReu(m)){
    const r = DB.reunions[m.reu];
    if(modele === "reu-actions"){ if(m.personne && emailDe(m.personne)) m.dest[m.personne] = "to"; }
    else candidatsMail(m).forEach(id => { if(emailDe(id)) m.dest[id] = r && (r.participants || []).includes(id) ? "to" : "cc"; });
    const quoi = r ? titreReu(r) : "";
    m.autres = ""; m.budget = false; m.risques = false;
    m.objet = tiret(modele === "reu-cr" ? "Compte rendu — " + quoi : modele === "reu-odj" ? "Ordre du jour — " + quoi : "Actions en cours — point du " + frDate(todayISO(), true));
    m.intro = modele === "reu-cr" ? "Bonjour à tous,\n\nVoici le compte rendu de notre " + (r ? (r.titre || FORMATS_REU[r.type].nom).toLowerCase() : "réunion") + " du " + (r ? frDate(r.date, true) : "") + ". Les actions de chacun sont rappelées à la fin." :
      modele === "reu-odj" ? "Bonjour à tous,\n\nVoici l'ordre du jour de notre " + (r ? (r.titre || FORMATS_REU[r.type].nom).toLowerCase() : "réunion") + " du " + (r ? frDate(r.date, true) : "") + ". Préparez vos points, et faites-moi signe s'il manque un sujet." :
      "Bonjour " + prenom(nomP(m.personne)) + ",\n\nVoici les actions qui te sont confiées suite à nos derniers points. Peux-tu me faire un retour sur leur avancement ?";
    return;
  }
  if(modele === "relance"){ if(m.personne) m.dest[m.personne] = "to"; }
  else if(m.projet && DB.projets[m.projet]){
    const pp = DB.projets[m.projet], raci = M().raci ? (pp.raci || {}) : {}, e = DB.journal[m.reunion];
    const presents = modele === "cr" && e ? new Set(e.participants || []) : null;
    gensDuProjet(pp).forEach(id => {
      if(id === moi || !emailDe(id)) return;
      m.dest[id] = presents ? (presents.has(id) ? "to" : "cc") : raci[id] === "I" ? "cc" : "to";
    });
  }
  m.autres = modele === "synthese" ? (DB.settings.mailDirection || "") : "";
  m.budget = modele === "synthese" && M().budget;
  const p = DB.projets[m.projet], pe = DB.personnes[m.personne], auj = frDate(todayISO(), true);
  const ref = p ? (p.code ? "[" + p.code + "] " : "") + p.nom : "";
  const eR = DB.journal[m.reunion];
  m.objet = modele === "cadrage" ? ref + " — note de cadrage" :
    modele === "cr" ? ref + " — compte rendu " + (eR ? lib(TYPES_R, eR.genre).replace("Point projet", "du point projet").replace(/^(COPIL|Atelier|Lancement)$/, "$1") + " du " + frDate(eR.date, true) : "de réunion") :
    modele === "point" ? ref + " — point d'avancement du " + auj :
    modele === "odj" ? ref + " — ordre du jour du point projet" :
    modele === "relance" ? "Vos actions projets — point du " + auj :
    "Point portefeuille projets" + (DB.settings.organisation ? " " + DB.settings.organisation : "") + " — " + auj;
  m.objet = tiret(m.objet);
  m.intro = modele === "cadrage" ? "Bonjour à tous,\n\nVoici la note de cadrage du projet « " + (p ? p.nom : "") + " ». Merci de me faire part de vos remarques." :
    modele === "cr" ? "Bonjour à tous,\n\nVoici le compte rendu de notre réunion" + (eR ? " du " + frDate(eR.date, true) : "") + " sur le projet « " + (p ? p.nom : "") + " »." :
    modele === "point" ? "Bonjour à tous,\n\nVoici le point d'avancement du projet « " + (p ? p.nom : "") + " »." :
    modele === "odj" ? "Bonjour à tous,\n\nVoici l'ordre du jour de notre prochain point sur le projet « " + (p ? p.nom : "") + " ». N'hésitez pas à me faire part des sujets à ajouter." :
    modele === "relance" ? "Bonjour " + prenom(pe && pe.nom) + ",\n\nVoici les actions projets qui vous sont confiées et qui arrivent à échéance. Pouvez-vous me faire un retour sur leur avancement et me signaler tout blocage ?" :
    "Bonjour,\n\nVoici la synthèse du portefeuille de projets au " + auj + ".";
}
function signature(){
  const s = (DB.settings.signature || "").trim();
  if(s) return s;
  const moi = DB.settings.moi && nomP(DB.settings.moi);
  return "Cordialement," + (moi ? "\n" + moi : "");
}

/* Le contenu, en briques neutres : titre, paragraphe, puce, couple
   libellé / valeur. Deux rendus en sortent : texte et HTML. */
function ligneEcheance(t, avecProjet){
  const auj = todayISO(), retard = t.fin && t.fin < auj;
  return { k:"li", c: retard ? "rouge" : "",
    t:(avecProjet ? nomProjet(t.projet) + " — " : "") + t.titre + " : " + (t.fin ? "échéance " + frDate(t.fin) : "sans échéance") +
      (retard ? ", dépassée de " + diffJ(t.fin, auj) + " j" : "") + (avecProjet ? "" : " (" + (nomP(t.resp) || "non attribuée") + ")") +
      (avT(t) && t.statut !== "fait" ? " · " + avT(t) + " %" : "") };
}
function blocSynthese(p, a, m){
  const n = [], tend = tendance(p);
  n.push({ k:"kv", l:"Météo", v:METEOS[a.meteo] + (tend ? " (" + tend.t + ")" : ""), c:a.meteo });
  n.push({ k:"kv", l:"Avancement", v:a.avance + " %" + (a.tempsPct != null ? " (temps écoulé " + a.tempsPct + " %)" : "") });
  n.push({ k:"kv", l:"Fin prévue", v:frDate(p.fin, true) + (a.joursRetard ? " — dépassée de " + a.joursRetard + " j" : a.glissement > 0 ? " — décalée de " + a.glissement + " j" : ""),
    c: a.joursRetard ? "rouge" : a.glissement > 0 ? "orange" : "" });
  if(m.budget && a.budget) n.push({ k:"kv", l:"Budget", v:eur(a.conso) + " consommés sur " + eur(a.budget) + (a.eac != null && a.avance < 100 ? " · projection " + eur(a.eac) : ""),
    c: a.eacPct > 100 ? (a.eacPct > 115 ? "rouge" : "orange") : "" });
  return n;
}
function contenuMail(m){
  const n = [], auj = todayISO(), p = DB.projets[m.projet];
  const H = t => n.push({ k:"h", t }), LI = (t, c, sub) => n.push({ k:"li", t, c, sub });
  if(estReu(m)){
    const r = DB.reunions[m.reu], ST = t => n.push({ k:"st", t });
    const lignesLI = txt => lignesNote(txt).forEach(l => LI(l.trim().replace(RE_ACTION, "→ "), RE_ACTION.test(l) ? "orange" : ""));
    const actLI = a => LI(a.texte + (a.resp ? " — " + nomP(a.resp) : "") + (a.echeance ? ", pour le " + frDate(a.echeance, true) : "") +
      (actionRetard(a) ? " (en retard de " + diffJ(a.echeance, auj) + " j)" : "") + (a.fait ? " (fait)" : ""), a.fait ? "vert" : actionRetard(a) ? "rouge" : "");
    if(m.modele === "reu-actions"){
      const L = V(DB.suivis).filter(a => !a.fait && a.resp === m.personne).sort(triActions);
      if(L.length){ H("Actions ouvertes"); L.forEach(a => LI(a.texte + " — " + origineAction(a) + (a.echeance ? ", pour le " + frDate(a.echeance, true) : "") +
        (actionRetard(a) ? " (en retard de " + diffJ(a.echeance, auj) + " j)" : ""), actionRetard(a) ? "rouge" : "")); }
      else n.push({ k:"p", t:"Aucune action ouverte de ton côté : merci !" });
      return n;
    }
    if(!r) return n;
    const P = (r.participants || []).filter(id => DB.personnes[id]);
    n.push({ k:"kv", l:"Date", v:frDate(r.date, true) });
    if(P.length) n.push({ k:"kv", l:r.type === "n1" ? "Avec" : "Participants", v:P.map(nomP).join(", ") });
    const ouvertes = V(DB.suivis).filter(a => !a.fait && a.reunion !== r.id && (!a.reunion || (DB.reunions[a.reunion] && DB.reunions[a.reunion].type === r.type))).sort(triActions);
    if(m.modele === "reu-odj"){
      H("Ordre du jour");
      (r.rubriques || []).forEach((rb, i) => LI((i + 1) + ". " + rb.t + (rb.notes && rb.notes._ ? " — " + lignesNote(rb.notes._).map(l => l.trim()).join(" ; ") : "")));
      if(ouvertes.length){ H("Actions en cours à faire le point"); groupesActions(ouvertes, P).forEach(([id, l]) => { ST(id ? nomP(id) : "Sans responsable"); l.forEach(actLI); }); }
      return n;
    }
    (r.rubriques || []).forEach(rb => {
      const N = rb.notes || {};
      const qui = (r.parPersonne ? P : []).filter(id => lignesNote(N[id]).length);
      if(!lignesNote(N._).length && !qui.length) return;
      H(rb.t);
      lignesLI(N._);
      qui.forEach(id => { ST(nomP(id)); lignesLI(N[id]); });
    });
    const ici = V(DB.suivis).filter(a => a.reunion === r.id).sort(triActions);
    if(ici.length){ H("Actions décidées"); groupesActions(ici, P).forEach(([id, l]) => { ST(id ? nomP(id) : "Sans responsable"); l.forEach(actLI); }); }
    if(ouvertes.length){ H("Toujours en cours depuis les points précédents"); ouvertes.forEach(actLI); }
    return n;
  }
  if(m.modele === "cadrage" && p){
    const c = cadrageDe(p);
    RUBRIQUES.forEach(([k, l]) => {
      if(!rempliR(c, k)) return;
      H(l);
      if(k === "objectifs") c.objectifs.forEach(o => LI(o.t)); else lignesDe(c[k]).forEach(x => LI(x));
    });
    n.push({ k:"kv", l:"Début", v:frDate(p.debut, true) }); n.push({ k:"kv", l:"Fin prévue", v:frDate(p.fin, true) });
    if(nomP(p.chef)) n.push({ k:"kv", l:"Chef de projet", v:nomP(p.chef) });
    if(p.sponsor) n.push({ k:"kv", l:"Sponsor", v:p.sponsor });
    const rb = rentabilite(p);
    if(m.budget && rb){ n.push({ k:"kv", l:"Budget", v:eur(rb.cout) }); n.push({ k:"kv", l:"Gain annuel estimé", v:eur(rb.gain) }); n.push({ k:"kv", l:"Remboursé en", v:rb.mois + " mois" }); }
    if(M().raci && p.raci && Object.keys(p.raci).length){
      H("Rôles");
      ROLES.forEach(([k, l]) => { const qui = Object.keys(p.raci).filter(id => p.raci[id] === k && DB.personnes[id]).map(nomP); if(qui.length) LI(l + " : " + qui.join(", ")); });
    }
  }
  else if(m.modele === "cr" && p){
    const e = DB.journal[m.reunion];
    if(e){
      if((e.participants || []).length) n.push({ k:"kv", l:"Participants", v:e.participants.filter(id => DB.personnes[id]).map(nomP).join(", ") });
      n.push({ k:"kv", l:"Date", v:frDate(e.date, true) });
      if(e.points){ H("Points abordés"); n.push({ k:"p", t:e.points }); }
      if((e.decisions || []).length){ H("Décisions"); e.decisions.forEach(d => LI(d, "vert")); }
      const acts = (e.actions || []).map(id => DB.taches[id]).filter(Boolean);
      if(acts.length){ H("Actions"); acts.forEach(t => LI(t.titre + " : " + (nomP(t.resp) || "non attribuée") + ", pour le " + frDate(t.fin, true) + (t.statut === "fait" ? " (fait)" : ""), t.statut === "fait" ? "vert" : "")); }
      const a = an(p);
      H("Où en est le projet");
      n.push({ k:"kv", l:"Météo", v:METEOS[a.meteo], c:a.meteo }); n.push({ k:"kv", l:"Avancement", v:a.avance + " %" });
      const jal = a.J.filter(j => !j.fait).slice(0, 2);
      if(jal.length) n.push({ k:"kv", l:"Prochain" + (jal.length > 1 ? "s" : "") + " jalon" + (jal.length > 1 ? "s" : ""), v:jal.map(j => j.titre + " (" + frDate(j.date) + ")").join(", ") });

    if(m.modele === "point"){

      if(R.length){ H("Actions sur les risques"); R.forEach(r => LI(nomProjet(r.projet) + " — " + (r.action || r.titre) + " : échéance " + frDate(r.echeance) +

      if(!T.length && !R.length) n.push({ k:"p", t:"Rien en retard ni d'imminent de votre côté : merci !" });

  else {

      d.retard + " en retard." + (resumeFiltres() !== "Actifs" ? "\nSélection : " + resumeFiltres() + "." : "") });
    if(m.budget && d.bud) n.push({ k:"kv", l:"Budget", v:eur(d.cons) + " consommés sur " + eur(d.bud) + " · projection " + eur(d.eac) });

    H("Projets");
    d.act.forEach(p => {

        a.meteo, dp ? dp.texte.replace(/\s+/g, " ") : "");
    });
    if(d.al.length){ H("Points d'attention"); d.al.slice(0, 10).forEach(x => LI(x.p.nom + " : " + x.t, x.n)); }
    if(d.jal.length){ H("Jalons à 60 jours"); d.jal.slice(0, 10).forEach(j => LI(frDate(j.date) + " — " + j.titre + " (" + nomProjet(j.projet) + ")" + (j.cle ? " · jalon clé" : ""), j.date < auj ? "rouge" : "")); }
    if(m.risques && M().risques && d.risques.length){ H("Risques majeurs"); d.risques.slice(0, 8).forEach(r => LI(r.titre + " (" + nomProjet(r.projet) + ") — " + (r.action || "sans plan d'action"), niveau(scoreR(r)) === "crit" ? "rouge" : "orange")); }

function rendreMail(m, brut){
  const n = contenuMail(m), intro = (m.intro || "").trim(), sig = brut ? "" : signature();
  const tx = [];
  if(brut && m.reu && DB.reunions[m.reu]) tx.push(titreReu(DB.reunions[m.reu]).toUpperCase(), "");
  if(intro) tx.push(intro, "");
  n.forEach((x, i) => {
    if(x.k === "h"){ if(i && tx[tx.length - 1] !== "") tx.push(""); tx.push(x.t.toUpperCase()); }
    else if(x.k === "st") tx.push("", "— " + x.t);
    else if(x.k === "p") tx.push(x.t, "");
    else if(x.k === "kv") tx.push((x.c && EMOJI[x.c] ? EMOJI[x.c] + " " : "") + x.l + " : " + x.v);
    else tx.push((x.c && EMOJI[x.c] ? EMOJI[x.c] + " " : "• ") + x.t + (x.sub ? "\n   " + x.sub : ""));
  });
  if(sig) tx.push("", sig);
  const e = s => esc(s).replace(/\n/g, "<br>");
  const dot = c => c && COUL[c] ? '<span style="color:' + COUL[c] + '">●</span> ' : "";
  let h = "", ouvert = "";
  const fermer = () => { if(ouvert === "ul") h += "</ul>"; if(ouvert === "kv") h += "</table>"; ouvert = ""; };
  if(brut && m.reu && DB.reunions[m.reu]) h += '<p style="margin:0 0 10px;font-size:18px;font-weight:bold">' + e(titreReu(DB.reunions[m.reu])) + '</p>';
  if(intro) h += '<p style="margin:0 0 12px">' + e(intro) + '</p>';
  n.forEach(x => {
    if(x.k === "li"){ if(ouvert !== "ul"){ fermer(); h += '<ul style="margin:0 0 10px;padding-left:22px">'; ouvert = "ul"; }
      h += '<li style="margin:0 0 4px">' + dot(x.c) + e(x.t) + (x.sub ? '<br><span style="color:#666;font-style:italic">' + e(x.sub) + '</span>' : "") + '</li>'; return; }
    if(x.k === "kv"){ if(ouvert !== "kv"){ fermer(); h += '<table style="border-collapse:collapse;margin:0 0 10px">'; ouvert = "kv"; }
      h += '<tr><td style="padding:2px 18px 2px 0;color:#666;vertical-align:top">' + e(x.l) + '</td><td style="padding:2px 0;font-weight:600' +
        (x.c && COUL[x.c] ? ';color:' + COUL[x.c] : "") + '">' + dot(x.c) + e(x.v) + '</td></tr>'; return; }
    fermer();
    if(x.k === "h") h += '<p style="margin:18px 0 6px;font-size:15px;font-weight:bold;color:#111;border-bottom:1px solid #e3e3e3;padding-bottom:3px">' + e(x.t) + '</p>';
    else if(x.k === "st") h += '<p style="margin:8px 0 3px;font-weight:bold;color:#333">' + e(x.t) + '</p>';
    else h += '<p style="margin:0 0 10px">' + e(x.t) + '</p>';
  });
  fermer();
  if(sig) h += '<p style="margin:16px 0 0">' + e(sig) + '</p>';
  return { text:tiret(tx.join("\n")), html:tiret('<div style="font-family:Segoe UI,Calibri,Arial,sans-serif;font-size:14px;line-height:1.5;color:#1a1a1a">' + h + '</div>') };
}
async function copierRiche(html, text){
  try{
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({ "text/html":new Blob([html], { type:"text/html" }), "text/plain":new Blob([text], { type:"text/plain" }) })]);
      return true;
    }
  }catch(e){}
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){ return false; }
}
function adressesMail(m){
  const to = [], cc = [];
  Object.keys(m.dest || {}).forEach(id => { const a = emailDe(id); if(!a) return; if(m.dest[id] === "to") to.push(a); else if(m.dest[id] === "cc") cc.push(a); });
  String(m.autres || "").split(/[;,\s]+/).map(x => x.trim()).filter(x => /.+@.+/.test(x)).forEach(x => { if(!to.includes(x)) to.push(x); });
  return { to, cc };
}
async function envoyerMail(act){
  const m = state.modal; if(!m) return;
  const r = rendreMail(m), objet = tiret((m.objet || "").trim());
  if(m.modele === "synthese" && DB.settings.mailDirection !== (m.autres || "")){ DB.settings.mailDirection = m.autres || ""; sauver(true); }
  if(act === "mail-partager"){
    try{ await navigator.share({ title:objet, text:objet + "\n\n" + r.text }); }catch(e){}
    return;
  }
  const ok = await copierRiche(r.html, r.text);
  if(act === "mail-copier"){ toast(ok ? "Copié avec la mise en forme : collez-le dans votre mail" : "Copie refusée par le navigateur"); return; }
  const { to, cc } = adressesMail(m);
  let url = "mailto:" + to.join(",") + "?subject=" + encodeURIComponent(objet) + (cc.length ? "&cc=" + cc.join(",") : "");
  if(!ok) url += "&body=" + encodeURIComponent(r.text.slice(0, 1800));
  const a = document.createElement("a"); a.href = url; document.body.appendChild(a); a.click(); a.remove();
  toast(ok ? "Contenu copié : collez-le (Ctrl+V) dans le mail qui s'ouvre" : "Mail ouvert avec le texte brut");
}

const fChamp = (lbl, inner, aide, id) => '<div class="champ">' + (lbl ? (id ? '<label for="' + id + '">' : '<span class="lab">') + lbl + (id ? '</label>' : '</span>') : "") +

  (type === "number" ? ' inputmode="decimal" step="any" min="0"' : "") + '>';
const fArea = (k, v, ph, rows) => '<textarea id="m-' + k + '" data-f="' + k + '" rows="' + (rows || 3) + '" placeholder="' + esc(ph || "") + '">' + esc(v || "") + '</textarea>';
const fSel = (k, v, opts, vide, rerender) => '<select id="m-' + k + '" data-f="' + k + '"' + (rerender ? ' data-rerender="1"' : "") + '>' +
  (vide != null ? '<option value="">' + esc(vide) + '</option>' : "") +
  opts.map(([a,b]) => '<option value="' + esc(a) + '"' + (String(v) === String(a) ? " selected" : "") + '>' + esc(b) + '</option>').join("") + '</select>';
const fSeg = (k, v, opts, clsFn) => '<div class="seg plein">' + opts.map(([a,b]) =>
  '<button type="button" class="' + (clsFn ? clsFn(a) : "") + (String(v) === String(a) ? " on" : "") + '" data-act="m-set" data-k="' + k + '" data-id="' + esc(a) + '">' + esc(b) + '</button>').join("") + '</div>';

  (d ? '<span class="d">' + d + '</span>' : "") + '</span><span class="k"></span></button>';

function aideEffort(m){
  const T = m.id ? tachesDe(m.id) : [];
  const r = effortCalc({ budget:num(m.budget), charge:T.length ? T.reduce((s,t) => s + num(t.charge), 0) : num(m.charge),
    debut:m.debut, fin:m.fin, service:m.service, equipe:m.equipe });
  if(!r) return "Auto : renseignez budget, charge, dates ou équipe pour obtenir une estimation.";
  const det = r.crit.map(c => c.t + " → " + c.v).join(", ");
  return (num(m.effort) ? "Fixé à la main. " : "") + "Estimation automatique : <b>" + NIV_EFFORT[r.v] + "</b> (" + esc(det) + ", sur une échelle de 1 à 4). " +
    (num(m.effort) ? "Choisissez Auto pour la suivre." : "Elle se met à jour avec le projet.");
}

/* Fermer par erreur une fenêtre en cours de saisie fait tout perdre : ni le
   clic à côté ni Échap (dès qu'on a commencé à saisir) ne la ferment. */
function secouerModal(msg){
  const d = document.querySelector(".mdl"); if(!d) return;
  d.classList.remove("secoue"); void d.offsetWidth; d.classList.add("secoue");
  if(msg) toast(msg);
}

function capturerModal(){
  const m = state.modal; if(!m) return;
  document.querySelectorAll("#modal [data-f]").forEach(el => { m[el.dataset.f] = el.value; });
  document.querySelectorAll("#modal [data-lg]").forEach(el => { const x = (m.lignes || [])[Number(el.dataset.lg)]; if(x) x[el.dataset.lk] = el.value; });
}
const copie = o => JSON.parse(JSON.stringify(o));

/* ---------- création des fenêtres ---------- */
/* ---------- remplissages automatiques d'un nouveau projet ----------
   Code : abrégé du service, année, numéro d'ordre (DSI-26-03). Sponsor : le
   responsable déclaré pour le service. Tous deux suivent le service choisi
   tant qu'on ne les a pas retouchés à la main. */
function ajouterService(nom, resp){
  const exist = DB.settings.services.find(s => norm(s) === norm(nom));
  const n = exist || nom;
  if(!exist) DB.settings.services.push(n);
  if(resp){ DB.settings.respServices = DB.settings.respServices || {}; DB.settings.respServices[n] = resp; }
  return n;
}
const respService = s => ((DB.settings.respServices || {})[s] || "").trim();
function codeAuto(service, sauf){
  const pre = (service ? norm(service).replace(/[^a-z0-9]/g, "").slice(0, 4).toUpperCase() : "") || "PRJ";
  const base = pre + "-" + String(new Date().getFullYear()).slice(2) + "-";
  const autres = V(DB.projets).filter(p => p.id !== sauf);
  let n = 1;
  autres.forEach(p => { if(p.code && p.code.startsWith(base)){ const k = parseInt(p.code.slice(base.length), 10); if(k >= n) n = k + 1; } });
  const pris = new Set(autres.map(p => p.code));
  while(pris.has(base + p2(n))) n++;
  return base + p2(n);
}
function autoProjet(m){
  if(!m.id && m.codeAuto) m.code = codeAuto(m.service);
  if(m.sponsorAuto) m.sponsor = respService(m.service);
}
function mProjet(p){
  if(p) return { type:"projet", ...copie(p), prio:String(p.prio || ""), avance:String(num(p.avance)), equipe:(p.equipe||[]).slice(),
    sponsorAuto:!p.sponsor };
  const auj = todayISO(), service = DB.settings.f.service || "";
  return { type:"projet", nom:"", code:codeAuto(service), codeAuto:true, sponsorAuto:true, statut:"encours", prio:"2", service,
